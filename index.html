          if (e.cards.length >= 12) hs.bito6 = true;
          if (hs.pogWatch) hs.pogSaved = true;
        }
        hs.pogWatch = false;
        return wait(HOLD, function () {
          sweep(bitoPoint(), function () {
            vbito += e.cards.length;
            drawAll(); wait(140, next);
          });
        });
      case 'draw':
        var w = Math.round(cardW() * 0.45), dp = deckPoint(), k2 = 0;
        e.list.forEach(function (d) {
          for (var q = 0; q < d.n; q++) (function (pp, dl) {
            wait(dl, function () { flyBack(dp, seatPoint(pp), w); });
          })(d.p, (k2++) * 55);
        });
        return wait(k2 * 55 + 340, function () {
          e.list.forEach(function (d) { vcount[d.p] = (vcount[d.p] || 0) + d.n; });
          vtalon = e.left;
          vhand = g.hands[ME].slice();
          drawAll(); wait(120, next);
        });
      case 'out':
        vout[e.p] = true;
        if (e.p === ME) hs.outN = e.n;
        toast(e.p === ME ? 'Вы вышли из игры — ' + (e.n === 1 ? 'первым' : e.n + '-м') : g.names[e.p] + ' ' +
          (g.sex && g.sex[e.p] === 'f' ? 'вышла' : 'вышел'));
        drawSeats();
        return wait(700, next);
      case 'hand-end':
        try { handStats(e.res); } catch (err) { }
        vt = []; drawAll();
        showResult(e); return;          // дальше — по кнопке
      default: return next();
    }
  }
  function liveCount() { var n = 0; for (var i = 0; i < g.N; i++) if (!vout[i]) n++; return n; }

  var handTimer = null;
  function drawHandLater() { clearTimeout(handTimer); handTimer = setTimeout(drawHand, 40); }

  var pumping = false, paused = false, needReady = false, overDone = false;
  var pausedUI = false, netHold = false;
  function pump() {
    if (pumping) return;
    pumping = true; busy = true;
    step();
    function step() {
      if (evIdx >= g.ev.length) { pumping = false; busy = false; return ready(); }
      var e = g.ev[evIdx++];
      if (e.e === 'hand-end') { pumping = false; busy = false; }
      handleEvent(e, step);
    }
  }

  /* ---------- две паузы: своя (окно) и сетевая (ждём вылетевшего) ---------- */
  function repause() {
    var was = paused;
    paused = pausedUI || netHold;
    if (was && !paused && needReady) { needReady = false; ready(); }
  }
  function setPaused(v) { pausedUI = !!v; repause(); }
  function netHoldOn(v) { netHold = !!v; repause(); }
  function me() { return ME; }

  function ready() {
    if (paused) { needReady = true; return; }
    if (g.isNet && g.pendHold !== undefined) { g.pending = g.pendHold; g.pendHold = undefined; }
    resync();
    if (g.isBot && g.isBot.some(function (b, i) { return b && i !== ME; })) { if (hs) hs.botSeen = true; }
    drawAll();
    if (window.Boot && !g.isNet) Boot.saveSolo();
    if (g.over) { if (overDone) return; overDone = true; return showOver(); }
    var p = g.pending;
    if (!p) return;
    if (p.type === 'next') return;
    if (p.p === ME) return askHuman(p);
    hint('Ход: ' + g.names[p.p]);
    if (!brains[p.p]) return;                      // за это место играет живой — ждём его
    var delay = p.type === 'attack' ? 620 : (p.type === 'defend' ? 560 : 420);
    wait(delay, function () {
      if (paused) { needReady = true; return; }
      if (!g.pending || g.pending !== p) return;
      if (!brains[p.p]) return;                    // пока думал, человек вернулся за стол
      var a = brains[p.p].act(p);
      if (!g.apply(a)) g.apply(fallbackOf(p));
      rtAfter();
      if (typeof Net !== 'undefined' && Net.S.host) Net.broadcast(g);
      pump();
    });
  }
  function fallbackOf(p) {
    if (p.type === 'attack') return { cards: [p.legal[0]] };
    if (p.type === 'defend') return { t: 'take' };
    return { t: 'pass' };
  }

  function act(a) {
    /* Единственная дверь для ходов: и свои щелчки, и присланные гостями.
       Стол ждёт вылетевшего — ход не принимаем. */
    if (netHold) { toast('Партия на паузе — ждём игрока'); return; }
    stopIdle();
    var ok = g.apply(a);
    if (ok === false && !g.isNet) { toast('Так нельзя'); drawHand(); return; }
    rtAfter();
    if (typeof Net !== 'undefined' && Net.S.host && !g.isNet) Net.broadcast(g);
    pump();
  }
  /* Рейтинг — СРАЗУ после хода, который закончил партию: пока движок не
     ушёл в следующую (у хозяина «следующую» может нажать и гость). Один
     раз на партию — флаг лежит на самом итоге. Гость не считает: ждёт
     расчёт хозяина в общем состоянии. */
  function rtAfter() {
    if (!g || g.isNet || !g.result || g.result.rtDone) return;
    try { if (window.Boot && Boot.rtFinish) Boot.rtFinish(g); } catch (e) { }
  }
  function actIf(type, a) { if (g.pending && g.pending.type === type) act(a); }

  /* ---------- ввод человека ---------- */
  var idleT = null;
  function stopIdle() { clearTimeout(idleT); idleT = null; }
  function startIdle() {
    stopIdle();
    var my = gen;
    idleT = setTimeout(function () {
      if (my !== gen || !g.pending || g.pending.p !== ME) return;
      talk(anyBot(), 'slow', null, true);
      startIdle();
    }, 15000);
  }
  function askHuman(p) {
    sel = sel.filter(function (id) { return canPick(K.parse(id)); });
    if (p.type === 'attack') hint(g.o.pairs || g.N > 2 ? 'Ваш ход. Отбивается ' + g.names[p.def] : 'Ваш ход');
    else if (p.type === 'defend') hint('Отбивайтесь' + (p.transfer ? ' или переводите' : '') + ' — или «Беру»');
    else if (p.type === 'throw') hint(p.chase ? g.names[p.def] + ' берёт — подкинуть вдогонку?' : 'Подкинуть? Отбивается ' + g.names[p.def]);
    drawHand(); drawTable(); startIdle();
  }

  /* --- клик и перетаскивание --- */
  var drag = null;
  function onDown(ev) {
    var c = ev.target.closest('#hand .card');
    if (!c || !myTurn()) return;
    if (!c.classList.contains('playable')) { toast(pend().type === 'defend' ? 'Этой картой не побить' : 'Эту карту сейчас не положить'); return; }
    var r = c.getBoundingClientRect();
    drag = { el: c, id: c.dataset.id, x0: ev.clientX, y0: ev.clientY, ox: ev.clientX - r.left, oy: ev.clientY - r.top, w: r.width, h: r.height, moved: false };
    c.setPointerCapture && c.setPointerCapture(ev.pointerId);
    ev.preventDefault();
  }
  function onMove(ev) {
    if (!drag) return;
    var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 8) return;
    if (!drag.moved) {
      drag.moved = true;
      drag.el.classList.add('drag');
      drag.el.style.width = drag.w + 'px'; drag.el.style.height = drag.h + 'px';
    }
    drag.el.style.left = (ev.clientX - drag.ox) + 'px';
    drag.el.style.top = (ev.clientY - drag.oy) + 'px';
    drag.el.style.transform = 'scale(1.15)';
    var d = $('#drop'), dr = d.getBoundingClientRect();
    var hot = ev.clientY < dr.bottom + 20 && ev.clientY > dr.top - 60;
    d.classList.toggle('hot', hot); drag.hot = hot;
    ev.preventDefault();
  }
  function onUp(ev) {
    if (!drag) return;
    var d = drag; drag = null;
    $('#drop').classList.remove('hot');
    if (!d.moved) return tapCard(d.id);
    d.el.classList.remove('drag');
    d.el.style.cssText = '';
    if (!d.hot) return drawHand();
    var c = K.parse(d.id), p = pend();
    if (p && p.type === 'defend') {
      // бросили на конкретную карту — бьём её
      d.el.style.visibility = 'hidden';
      var hit = document.elementFromPoint(ev.clientX, ev.clientY);
      d.el.style.visibility = '';
      var at = hit && hit.closest && hit.closest('#trick .card.att');
      if (at && beatOn(+at.dataset.i, c)) return;
      sel = [d.id];
    }
    commit(c);
  }
  function onTableClick(ev) {
    var a = ev.target.closest('#trick .card.att.tgt');
    if (!a || !myTurn() || sel.length !== 1) return;
    beatOn(+a.dataset.i, K.parse(sel[0]));
  }

  /* ---------- окна ---------- */
  function modal(html, wire, o) {
    o = o || {};
    var m = $('#modal');
    m.innerHTML = '<div class="dlg' + (o.wide ? ' wide' : '') + '">' + html + '</div>';
    m.classList.add('on');
    m.classList.toggle('light', !!o.light);
    m.classList.toggle('over', $('#splash').classList.contains('on'));
    if (wire) wire(m);
  }
  function closeModal() {
    var m = $('#modal');
    m.classList.remove('on'); m.classList.remove('light'); m.innerHTML = '';
    // кто закрыл последний слой — тот и снял паузу (грабли клабора, 27.10.2026)
    if (!$('#splash').classList.contains('on')) { pausedUI = false; repause(); }
  }
  function splash(html, wire, key) {
    var m = $('#splash');
    var wide = html.indexOf('<!--WIDE-->') === 0;
    if (wide) html = html.slice(11);
    var same = key && m.dataset.k === key && m.classList.contains('on');
    var top = same ? m.scrollTop : 0;
    var dlg = m.querySelector('.dlg');
    var dtop = (same && dlg) ? dlg.scrollTop : 0;
    var inner = ['.facerow', '.hlog', '.hpeople', '.achlist'], keep = {};
    if (same) inner.forEach(function (s) { var e2 = m.querySelector(s); if (e2) keep[s] = e2.scrollTop; });
    m.innerHTML = '<div class="dlg' + (wide ? ' hallwide' : '') + '">' + html + '</div>';
    m.dataset.k = key || '';
    m.classList.add('on');
    m.scrollTop = top;
    var nd = m.querySelector('.dlg');
    if (nd) nd.scrollTop = dtop;
    inner.forEach(function (s) { if (keep[s] == null) return; var e2 = m.querySelector(s); if (e2) e2.scrollTop = keep[s]; });
    setPaused(true);
    if (wire) wire(m);
  }
  function closeSplash() {
    $('#splash').classList.remove('on'); $('#splash').innerHTML = '';
    if (!$('#modal').classList.contains('on')) setPaused(false);
  }

  /* ---------- итог партии ---------- */
  function scoreLine(i, r) {
    var sd = g.sideList()[i], a = r.before[sd[0]], b = r.after[sd[0]];
    if (!g.o.tour) return String(g.fools[sd[0]]);
    return a === b ? String(b) : a + ' → <b>' + b + '</b>';
  }
  function showResult(e) {
    var r = e.res, i, sd = g.sideList();
    var head, sub = '';
    if (r.draw) { head = 'Ничья'; sub = 'Последние карты вышли разом — дурака нет.'; }
    else {
      var fn = g.o.pairs ? g.sideName(r.foolSide) : g.names[r.fool];
      var mine = g.sideOf(r.fool) === g.sideOf(ME);
      head = g.o.pairs ? (mine ? 'Вы с напарником — дураки' : fn + ' — дураки')
        : (r.fool === ME ? 'Вы — ' + (sexOfSeat(ME) === 'f' ? 'дура' : 'дурак') : fn + ' — ' + (g.sex[r.fool] === 'f' ? 'дура' : 'дурак'));
      sub = r.cards ? 'На руках осталось ' + r.cards + ' ' + plural(r.cards, 'карта', 'карты', 'карт') + '.' : '';
    }
    var pog = '';
    if (r.pog) {
      pog = '<div class="pogban"><div class="pogcards"><div class="card">' + ART.faceHTML({ r: r.pog.r, s: 'S' }) +
        '</div><div class="card">' + ART.faceHTML({ r: r.pog.r, s: 'H' }) + '</div></div><div><b>Погоны!</b> ' +
        (r.pog.by === ME ? 'Вы повесили' : esc(g.names[r.pog.by]) + ' ' + (g.sex[r.pog.by] === 'f' ? 'повесила' : 'повесил')) + ' ' + K.RANK_TWO[r.pog.r] +
        ' на ' + (r.pog.to === ME ? 'вас' : esc(g.names[r.pog.to])) + '. Теперь — <b>' + esc(r.title) + '</b>.' +
        (g.o.tour ? '<div class="sub" style="margin:3px 0 0">Повесившему — минус два штрафных.</div>' : '') + '</div></div>';
    }
    var rows = '';
    for (i = 0; i < sd.length; i++) {
      var who = sd[i].map(function (p) {
        var pl = r.place.indexOf(p);
        return ART.ava(faceOf(p), letterOf(p), 'sm') + ' ' + esc(g.names[p]) +
          (pl >= 0 ? ' <span class="dim">' + (p === ME ? 'вышли' : 'вышел' + (g.sex[p] === 'f' ? 'а' : '')) + ' ' +
            (p !== ME && g.sex[p] === 'f' ? ['первой', 'второй', 'третьей', 'четвёртой'] : ['первым', 'вторым', 'третьим', 'четвёртым'])[pl] + '</span>' : '');
      }).join('<br>');
      var fool = !r.draw && r.foolSide === i;
      rows += '<tr class="' + (sd[i].indexOf(ME) >= 0 ? 'me' : '') + (fool ? ' fool' : '') + '"><td data-h="">' + who + '</td>' +
        '<td data-h="">' + (fool ? '<b class="neg">дурак' + (g.o.pairs ? 'и' : '') + '</b>' : '') + '</td>' +
        '<td data-h="' + (g.o.tour ? 'Штрафные' : 'Дураком') + '" class="tot">' + scoreLine(i, r) + '</td>' +
        '<td data-h="Звание">' + sd[i].map(function (p) { return g.rank[p] ? K.titleOf(g.rank[p]) : '—'; }).join(', ') + '</td></tr>';
    }
    var tourNote = g.o.tour ? '<div class="sub">Турнир до ' + g.o.tour + ' штрафных' + (g.over ? ' — <b>окончен</b>.' : '.') + '</div>' : '';
    /* Портрет за игру: партия в дурака короткая, поэтому не за каждую, а
       за каждую третью доигранную (ничьи тоже в счёт). Итог турнира
       добавляет ещё один. Окно может открыться заново — считаем один раз. */
    var gift = '';
    if (window.Boot && e.res && !e.res.giftDone) {
      e.res.giftDone = true;
      try {
        var st = Boot.stats();
        if (st.games && st.games % 3 === 0) {
          var opened = Boot.unlockFace(!r.draw && g.sideOf(r.fool) !== g.sideOf(ME));
          if (opened >= 0) gift += '<div class="gift">' + ART.ava(opened, '+', 'huge') + '<div><b>Открыт новый портрет!</b>' +
            '<div class="sub" style="margin:2px 0 0">' + Boot.facesLine() + ' Забрать себе — в профиле.</div></div></div>';
        }
      } catch (err) { }
      if (!g.over) gift += achGifts();
    }
    var rtLine = '';
    try { if (window.Boot && Boot.rtBlock) rtLine = '<div class="rtres" id="rtRes">' + Boot.rtBlock(Boot.rating(), true) + '</div>'; } catch (err3) { }
    modal('<h3' + (r.fool === ME && !r.draw ? ' class="neg"' : '') + '>' + head + '</h3>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + pog +
      '<table class="res"><thead><tr><th>Игрок</th><th></th><th>' + (g.o.tour ? 'Штрафные' : 'Дураком') + '</th><th>Звание</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' + tourNote + rtLine + gift +
      '<div class="row"><button class="btn pri wide" data-n="1">' +
      (g.over ? 'Итог турнира' : 'Следующая партия') + '</button></div>', function (m) {
        m.onclick = function (ev) {
          if (!ev.target.closest('[data-n]')) return;
          closeModal(); evIdx = g.ev.length;
          if (g.over) return ready();
          actIf('next', {});
        };
      }, { light: true });
  }

  /* ============================================================
     ДОСТИЖЕНИЯ И СТАТИСТИКА
     Три вида, как просил Ник:
       • за любую игру, в том числе с ботами;
       • сетевые — за столом с живым соперником (боты могут сидеть рядом);
       • строго сетевые — за столом ТОЛЬКО живые люди, ни одного бота
         за всю партию. Золотые легенды Одессы — только отсюда.
     Своё место считается живым всегда; бот на чужом месте хоть раз за
     партию — и партия уже не «строго сетевая».
     ============================================================ */
  function liveOthers() {
    if (!window.Net || !Net.S.on) return 0;
    var n = 0;
    for (var i = 0; i < g.N; i++) if (i !== ME && !(g.isBot && g.isBot[i])) n++;
    return n;
  }
  function netLive() { return !!(window.Net && Net.S.on) && liveOthers() >= 1; }
  function allLive() { return netLive() && liveOthers() === g.N - 1 && !(hs && hs.botSeen); }
  function ach(id) { try { if (window.Boot && Boot.ach) Boot.ach(id); } catch (e) { } }

  function modeKey() { return g.o.pairs ? 'p' : String(g.N); }
  function handStats(r) {
    if (!window.Boot) return;
    var mineSide = g.sideOf(ME), fool = !r.draw && g.sideOf(r.fool) === mineSide;
    var won = !r.draw && !fool;
    var st0 = Boot.stats();
    var pat = { games: 1 };
    var dt = new Date(), today = dt.getFullYear() * 10000 + (dt.getMonth() + 1) * 100 + dt.getDate();
    if (today > (st0.lastDay || 0)) { Boot.setMax('lastDay', today); pat.days = 1; }

    if (Boot.CFG && Boot.CFG.talk) pat.talkGames = 1;

    if (!fool) Boot.setMax('streakMax', Boot.stats().streak);
    var st = Boot.stats();

    // ---- за любую игру ----
    if (won) ach('first');
    if (st.wins >= 10) ach('w10');

    if (st.wins >= 200) ach('w200');
    if (fool) ach('fool1');
    if (st.fools >= 25) ach('fool25');

    if (st.games >= 500) ach('g500');
    if (r.pog && r.pog.by === ME) {

    }
    if (r.pog && r.pog.to === ME) {
      ach('pogGot');
      if (g.rank[ME] >= 5) ach('major');
    }
    if (hs.pogSaved) ach('pogSaved');
    if (r.draw) ach('draw');
    if (won && hs.outN === 1 && g.N === 4) ach('out4');
    if (hs.maxTake >= 10) ach('take10');
    if (hs.bito6) ach('bito6');
    if (hs.transfers >= 3) ach('tr3');
    if (hs.trTransfer) ach('trBack');

    if (won && g.N === 2 && r.cards >= 6) ach('dry');
    if (st.streak >= 3) ach('s3');
    if (st.streak >= 5) ach('s5');
    if (st.streak >= 10) ach('s10');
    if (st.w2 >= 25) ach('duel25');
    if (st.w3 >= 25) ach('three25');
    if (st.w4 >= 25) ach('four25');
    if (st.wp >= 10) ach('pair10');
    if (st.w2 && st.w3 && st.w4 && st.wp) ach('allModes');
    if (st.transfers >= 25) ach('tr25');
    if (st.wPer >= 20) ach('per20');

  /* ---------- копирование в буфер ---------- */
  function copyText(t) {
    return new Promise(function (res) {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext)
          return navigator.clipboard.writeText(t).then(function () { res(true); }, function () { res(fallback(t)); });
      } catch (e) { }
      res(fallback(t));
    });
    function fallback(txt) {
      try {
        var a = document.createElement('textarea');
        a.value = txt; a.setAttribute('readonly', '');
        a.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
        document.body.appendChild(a);
        a.select(); a.setSelectionRange(0, txt.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(a);
        return ok;
      } catch (e) { return false; }
    }
  }
  function copyHTML(val, cls) {
    return '<button class="cpy' + (cls ? ' ' + cls : '') + '" data-cpy="' + val +
      '" title="Скопировать" aria-label="Скопировать">' + (cls === 'inline' ? 'копировать' : '⧉') + '</button>';
  }
  function onCopyClick(ev) {
    var e = ev.target.closest('[data-cpy]');

    copyText(val).then(function (ok) {

      if (!ok || e.tagName !== 'BUTTON') return;
      var was = e.innerHTML;
      e.classList.add('done'); e.innerHTML = e.classList.contains('inline') ? 'готово' : '✓';
      setTimeout(function () { e.classList.remove('done'); e.innerHTML = was; }, 1200);
    });
  }

    el.innerHTML = '<div class="dlg"><h3>Играют на другом устройстве</h3>' +
      '<div class="sub">Под этим входом' + (C.user && C.user.email ? ' (' + esc(C.user.email) + ')' : '') +
      ' дурака только что открыли в другом месте. Играть с одного профиля в двух местах сразу нельзя — ' +
      'здесь игра остановлена, всё наигранное уже в облаке.</div>' +
      '<div class="row"><button class="btn pri wide" data-cl="here">Играть здесь</button></div>' +
      '<div class="row"><button class="btn wide" data-cl="out">Выйти из профиля</button></div></div>';
    el.classList.add('on');
    el.onclick = function (ev) {
      var b = ev.target.closest('[data-cl]'); if (!b) return;
      if (b.dataset.cl === 'here') claim().catch(function (e) { UI.toast('Облако: ' + msg(e)); });
      else signOut();
    };
  }
  function unlock() { var el = document.getElementById('cloudLock'); if (el) el.classList.remove('on'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ---------- вход и выход ---------- */
  function signOut() {
    return run(function () {
      var p = (C.owner && print() !== sent) ? push() : Promise.resolve();
      return p.then(function () {
        if (C.owner) return sRef().update({ released: true }).catch(function () { });
      }).then(function () {
        unwatch(); C.owner = false; C.kicked = false; unlock(); ls(ON, null); sent = '';
        return auth.signOut();
      });
    });
  }

  // был вход раньше — поднимаемся сами
  if (ls(ON)) setTimeout(function () { load().catch(function (e) { C.err = msg(e); emit(); }); }, 400);

  C.on = function (f) { listeners.push(f); };
  /* select_account: Google каждый раз спрашивает, каким аккаунтом войти, —
     иначе сменить почту (выйти и войти другой) было бы нельзя: он молча
     пускал бы под прежней. */
  C.google = function () {
    return run(function () {
      var pr = new firebase.auth.GoogleAuthProvider();
      try { pr.setCustomParameters({ prompt: 'select_account' }); } catch (e) { }
      return auth.signInWithPopup(pr);
    });
  };
  C.signIn = function (e, p) { return run(function () { return auth.signInWithEmailAndPassword(e, p); }); };
  C.signUp = function (e, p) { return run(function () { return auth.createUserWithEmailAndPassword(e, p); }); };
  C.reset = function (e) { return run(function () { return auth.sendPasswordResetEmail(e); }); };
  C.signOut = signOut;
  C.push = push;
  C.msg = msg;
  C.SID = SID;
  return C;
})();

  // имя тянет за собой род, род — портрет, портрет — характер и манеру говорить
  // сначала выбираем свободный портрет, потом имя ему по полу —
  // иначе при неполном наборе лиц Циля рискует оказаться усатой

  // их вчетверо больше. Потом свободный портрет этого пола, и уже под портрет имя.
  function rollBots(N, level) {
    var pool = BOTNAMES.slice(), out = [], busy = [CFG.face], i, t;
    for (i = 1; i < N; i++) {
      var sex = Math.random() < 0.6 ? 'm' : 'f';
      var free = ART.facesOf(sex, busy);
      if (!free.length) {                        // портреты этого пола кончились — берём другой
        sex = sex === 'm' ? 'f' : 'm';
        free = ART.facesOf(sex, busy);
      }
      var face = free.length ? free[Math.floor(Math.random() * free.length)] : -1;
      if (face >= 0) { busy.push(face); sex = ART.FACE_SEX[face]; }
      var cand = [];
      for (t = 0; t < pool.length; t++) if (pool[t][1] === sex) cand.push(t);
      var idx = cand.length ? cand[Math.floor(Math.random() * cand.length)] : 0;
      var nm = pool.splice(idx, 1)[0];
      var name = nm[0];
      // легенда садится под своим именем: Беня Крик не бывает Цилей
      var leg = (face >= GOLD0) ? achOfFace(face) : null;
      if (leg) name = leg[1];
      else {
        var r = Math.random();
        if (r < 0.34) name += ' ' + PLACES[Math.floor(Math.random() * PLACES.length)];
        else if (r < 0.58) {
          var fam = SURNAMES[Math.floor(Math.random() * SURNAMES.length)];
          if (name.length + fam.length + 1 <= 14) name += ' ' + fam;
        }
      }
      out.push({ name: name, sex: nm[1], face: face, ch: face >= 0 ? ART.FACE_CH[face] : 'b' });
    }
    return out;
  }

  function opts(N, names) {
    return {
      players: N, pairs: N === 4 && !!CFG.pairs, human: 0, names: names,
      perevod: !!CFG.perevod, tour: CFG.tour | 0, first5: !!CFG.first5, pogony: CFG.pogony !== false
    };
  }

  // на медленном канале ждём, пока докачается колода: одна секунда ожидания
  // лучше, чем белые прямоугольники вместо карт
  function withDeck(fn) {
    var done = false, tm = null;
    ART.warm(function () {
      if (done) return; done = true;
      clearTimeout(tm); fn();
    });
    tm = setTimeout(function () { if (!done) { done = true; fn(); } }, 6000);
  }

  function start() {
    if (Net.S.on) Net.leave();

    var mySex = ART.FACE_SEX[CFG.face] || 'm';

  /* ============================================================
     ЭКРАНЫ

     ============================================================ */
  var stack = [];

  function go(fn, reset) {
    if (reset) stack = [];
    stack.push(fn);
    fn();
  }
  function back() {
    stack.pop();
    var f = stack[stack.length - 1];
    if (f) f(); else closeAll();
  }
  function closeAll() {
    stack = [];

  }
  // Вышли в меню из партии — за столом нас больше нет, даже если объект партии цел.

  var leftTable = false;

  // за столом ли мы сейчас — своя партия или сетевая, где партию ведёт хозяин
  function atTable() {

  }

  // Холл висит рядом с любым экраном меню: игрок ждёт партнёров и видит разговор.

  function screen(o) {

    var h = '<div class="nav">' +

      (hall ? '<div class="mainwrap"><div class="mcol">' + o.body + '</div>' + hallHTML() + '</div>'

        if (hall && hallWire(ev, m)) return;
        if (o.wire) o.wire(ev, m);

      if (hall) hallStart(m);

  }

  /* ---------- кусочки, которые нужны нескольким экранам ---------- */
  function segHTML(id, cur, items, cls) {
    return '<div class="seg' + (cls ? ' ' + cls : '') + '" id="' + id + '">' + items.map(function (it) {
      return '<button data-v="' + it[0] + '" class="' + (String(cur) === String(it[0]) ? 'on' : '') +

  /* ============================================================
     ПРОФИЛЬ ФАЙЛОМ
     Один файл .durak уносит с собой всё: имя, портрет, характер,
     открытые портреты, выбитые секреты и статистику.
     Содержимое перемешано и подписано контрольной суммой — руками цифры
     не подправить. Настоящей защитой это не является и не притворяется:
     ключ лежит в коде игры, как и в любой браузерной игре.
     ============================================================ */
  var PF_HEAD = 'DURAK1';

  function profilePack() {
    return {
      v: 1, ts: Date.now(),
      name: myName(), face: CFG.face, ch: CFG.myChar, uid: Net.myUid(),
      faces: myFaces(), ach: achList(), stats: stats(), rt: rtLoad()
    };
  }

  function scramble(bytes) {
    var out = new Uint8Array(bytes.length), st = (0x9e3779b9 ^ bytes.length) >>> 0;
    for (var i = 0; i < bytes.length; i++) {
      st = (Math.imul(st, 1103515245) + 12345) >>> 0;
      out[i] = bytes[i] ^ ((st >>> 16) & 255);
    }
    return out;
  }
  function sumOf(bytes) {
    var s = 0;
    for (var i = 0; i < bytes.length; i++) s = (Math.imul(s, 31) + bytes[i]) >>> 0;
    return s;
  }
  function b64(bytes) {
    var str = '', CH = 8000;
    for (var i = 0; i < bytes.length; i += CH)
      str += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(str);
  }
  function unb64(t) {
    var raw = atob(t), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }
  function utf8(sIn) {
    if (window.TextEncoder) return new TextEncoder().encode(sIn);
    var esc = unescape(encodeURIComponent(sIn)), a = new Uint8Array(esc.length);
    for (var i = 0; i < esc.length; i++) a[i] = esc.charCodeAt(i);
    return a;
  }
  function unutf8(bytes) {
    if (window.TextDecoder) return new TextDecoder().decode(bytes);
    var st = '';
    for (var i = 0; i < bytes.length; i++) st += String.fromCharCode(bytes[i]);
    return decodeURIComponent(escape(st));
  }

  function profileText() {
    var raw = utf8(JSON.stringify(profilePack()));
    return PF_HEAD + '.' + sumOf(raw).toString(36) + '.' + b64(scramble(raw));
  }

  function profileParse(text) {
    var parts = String(text || '').trim().split('.');
    if (parts.length !== 3 || parts[0] !== PF_HEAD) throw new Error('это не файл профиля дурака');
    var raw = scramble(unb64(parts[2]));          // перемешивание своё же и разбирает
    if (sumOf(raw).toString(36) !== parts[1]) throw new Error('файл повреждён');
    var o = JSON.parse(unutf8(raw));
    if (!o || o.v !== 1) throw new Error('версия файла не подходит');
    return o;
  }

  function profileSave() {
    var nm = myName().replace(/[^0-9A-Za-zА-Яа-яЁё]+/g, '-').slice(0, 20) || 'profile';
    var blob = new Blob([profileText()], { type: 'application/octet-stream' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'durak-' + nm + '.durak';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    UI.toast('Профиль сохранён в файл ' + a.download);
  }

  // Сливаем, а не затираем: портреты и секреты складываются, статистика
  // берётся та, где партий больше. Так перенос со старого файла ничего не отнимет.
  function profileLoad(text, quiet) {
    var o = profileParse(text), i;
    /* Номер игрока — часть профиля: перенёс профиль на другое
       устройство — это по-прежнему ты, и за стол ты садишься одним
       человеком, а не двумя. Если хочется сидеть с двух устройств
       ОДНОВРЕМЕННО (например, самому себя проверить), в профиле есть
       «Сменить номер». */
    if (o.uid) Net.setUid(o.uid);
    if (o.name) setMyName(o.name);
    if (typeof o.face === 'number') CFG.face = o.face;
    if (o.ch) CFG.myChar = o.ch;
    save();
    var f = myFaces().slice();
    (o.faces || []).forEach(function (n) { if (f.indexOf(n) < 0) f.push(n); });
    f.sort(function (a, b) { return a - b; }); saveFaces(f);
    var a = achList().slice();
    (o.ach || []).forEach(function (id) { if (a.indexOf(id) < 0 && achDef(id)) a.push(id); });
    try { localStorage.setItem('durak-ach', JSON.stringify(a)); } catch (e) { }
    var mine = stats();
    if (o.stats && (o.stats.games || 0) > (mine.games || 0)) {
      var st = {};
      for (var k in ST0) st[k] = (o.stats[k] != null) ? o.stats[k] : ST0[k];
      try { localStorage.setItem('durak-stats', JSON.stringify(st)); } catch (e) { }
    }
    /* Рейтинги не суммируются: берём тот, где партий больше, номера партий
       объединяем — иначе перенос зачёл бы одни и те же партии дважды. */
    if (o.rt) rtSave(Rating.merge(RCFG, rtLoad(), o.rt));
    if (Net.S.on) Net.updateMe(myName(), CFG.face);
    Hall.updateMe(myName(), CFG.face, hallCard());
    if (!quiet) ach('loadFile');
    return { faces: f.length, ach: a.length, name: myName() };

  ];
  // с какого номера начинается золото — граница одна и та же в игре и в художке
  var GOLD0 = ART.GOLD0;
  // те же портреты одним списком — чтобы случайная выдача их не трогала
  var RARE = ACH.map(function (a) { return a[3]; });

  function achList() {
    var l = null;
    try { l = JSON.parse(localStorage.getItem('durak-ach') || 'null'); } catch (e) { }
    return l && l.length ? l : [];
  }
  function achHas(id) { return achList().indexOf(id) >= 0; }
  function achDef(id) {
    for (var i = 0; i < ACH.length; i++) if (ACH[i][0] === id) return ACH[i];
    return null;
  }

  // выбить достижение; вернёт {name, why, face}, если оно новое
  var achFresh = [];
  function ach(id) {
    var d = achDef(id);
    if (!d || achHas(id)) return null;
    var l = achList(); l.push(id);
    try { localStorage.setItem('durak-ach', JSON.stringify(l)); } catch (e) { }
    var mine = myFaces();
    if (mine.indexOf(d[3]) < 0) { mine.push(d[3]); mine.sort(function (a, b) { return a - b; }); saveFaces(mine); }
    var got = { id: id, name: d[1], why: d[2], face: d[3], kind: d[4] };
    achFresh.push(got);
    // сразу коротко, без спойлера: что именно выбито — раскроется в конце партии
    try { UI.toast('Секрет открыт! Портрет ждёт в профиле.'); } catch (e) { }
    return got;
  }
  function achTake() { var l = achFresh; achFresh = []; return l; }

  // Простыни из достижений в профиле нет: в сетке портретов просто стоит
  // одна пустая клетка с вопросиком — клик по ней и есть вся подсказка.
  function achLeft() {
    var mine = myFaces(), n = 0;
    for (var i = 0; i < RARE.length; i++) if (mine.indexOf(RARE[i]) < 0) n++;
    return n;
  }
  // какое достижение дало этот портрет (нужно для подсказки в сетке)
  function achOfFace(n) {
    for (var i = 0; i < ACH.length; i++) if (ACH[i][3] === n) return ACH[i];
    return null;
  }
  function rareGot() { return RARE.length - achLeft(); }
  // портрет выбран руками: считаем смены и подсказываем, за что он дан
  function pickedFace(n) {
    bumpStats({ faceSwaps: 1 });
    if (stats().faceSwaps >= 10) ach('faces10');
    faceHint(n);
  }
  // клик по редкому портрету — говорим, за что он достался
  function faceHint(n) {
    var d = achOfFace(n);
    if (!d) {
      // обычный портрет — расскажем хотя бы, кто это
      if (ART.FACE_BIO && ART.FACE_BIO[n]) UI.toast(ART.FACE_BIO[n]);
      return;
    }
    try { UI.toast('«' + d[1] + '» — ' + d[2] + '.'); } catch (e) { }
  }

  /* ---------- портреты: свои открытые и общий пул ----------
     Портретов много, и все сразу отдавать неинтересно: игрок начинает
     с двух дюжин, а за каждую доигранную партию открывается ещё один.
     Ботам это не мешает — они берут кого угодно из всего набора. */
  var FREE_M = 12, FREE_W = 12;

  function defaultFaces() {
    var all = ART.have(), m = [], w = [], i;
    for (i = 0; i < all.length; i++) {
      var n = all[i];
      if (RARE.indexOf(n) >= 0) continue;             // редкие — только за достижения
      if (ART.FACE_SEX[n] === 'f') { if (w.length < FREE_W) w.push(n); }
      else if (m.length < FREE_M) m.push(n);
    }
    return m.concat(w).sort(function (a, b) { return a - b; });
  }

  function myFaces() {
    var all = ART.have(), l = null;
    try { l = JSON.parse(localStorage.getItem('durak-faces') || 'null'); } catch (e) { }
    if (!l || !l.length) { l = defaultFaces(); saveFaces(l); }
    return l.filter(function (n) { return all.indexOf(n) >= 0; });
  }
  function saveFaces(l) {
    try { localStorage.setItem('durak-faces', JSON.stringify(l)); } catch (e) { }
    if (l.length >= 100) ach('coll100');
  }

  /* Сколько портретов падает просто за доигранную партию. Дальше лотерея
     работает только на победы: первые два десятка добираются сами собой,
     а за остальными уже надо выигрывать. */
  var FREEPLAY = 44;                                 // 24 стартовых + 20 «за участие»

  // открыть один случайный ещё закрытый портрет; вернёт его номер или -1
  // редкие (за достижения) в эту лотерею не попадают
  function unlockFace(won) {
    var all = ART.have(), mine = myFaces(), left = [];
    if (mine.length >= FREEPLAY && !won) return -1;   // дальше портреты только за победу
    for (var i = 0; i < all.length; i++)
      if (mine.indexOf(all[i]) < 0 && RARE.indexOf(all[i]) < 0) left.push(all[i]);
    if (!left.length) return -1;
    var n = left[Math.floor(Math.random() * left.length)];
    mine.push(n); mine.sort(function (a, b) { return a - b; });
    saveFaces(mine);
    return n;
  }
  // 1 портрет, 2 портрета, 5 портретов — иначе «а 91 портретов» режет глаз
  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function facesLine() {
    var mine = myFaces().length, all = ART.have().length;
    var goldAll = 0, goldGot = 0, my = myFaces();
    for (var gi = 0; gi < RARE.length; gi++) if (RARE[gi] >= GOLD0) {
      goldAll++; if (my.indexOf(RARE[gi]) >= 0) goldGot++;
    }
    var rare = 'Редких, за секреты: <b>' + rareGot() + '</b> из ' + RARE.length +
      ' — они с синим ободком, клацните по такому, и он скажет, за что достался.' +
      '<br>Золотых легенд: <b>' + goldGot + '</b> из ' + goldAll +
      ' — эти берутся только за живым столом, с ботами ни одна не выбивается.';
    if (mine >= all) return 'Открыты все ' + all + ' портретов — коллекция собрана. ' + rare;
    var how = (mine >= FREEPLAY)
      ? '. Дальше новый портрет открывается за <b>каждую выигранную</b> партию, а '
      : '. За каждую доигранную партию открывается ещё один — так до ' + FREEPLAY +
        ', дальше только за победы. А ';
    return 'Открыто портретов: <b>' + mine + '</b> из ' + all + how +
      RARE.length + ' ' +
      plural(RARE.length, 'портрет', 'портрета', 'портретов') + ' случайно не ' +
      plural(RARE.length, 'выпадает', 'выпадают', 'выпадают') + ' вовсе.<br>' + rare;
  }

  function faceRow(cur) {
    var l = myFaces();
    if (!l.length) return '<div class="sub">Портреты не найдены в img/faces — играем кружками с буквой.</div>';
    if (l.indexOf(cur) < 0 && cur >= 0) l = l.concat([cur]).sort(function (a, b) { return a - b; });
    var cells = l.map(function (i) {
      var d = achOfFace(i);
      return '<div class="fc' + (cur === i ? ' on' : '') +
        (d ? (i >= GOLD0 ? ' gold' : ' rare') : '') +
        '" data-face="' + i + '"' + (d ? ' title="' + esc(d[1] + ' — ' + d[2]) + '"' : '') +
        '>' + ART.ava(i, 'Я', 'big') + '</div>';
    }).join('');
    if (achLeft()) cells += '<div class="fc q" data-q="1" title="Секрет"><span>?</span></div>';
    var bio = (cur >= 0 && ART.FACE_BIO && ART.FACE_BIO[cur])
      ? '<div class="bio">' + esc(ART.FACE_BIO[cur]) + '</div>' : '';
    return '<div class="facerow">' + cells + '</div>' + bio +
      '<div class="sub" style="margin:6px 0 0">' + facesLine() + '</div>';
  }
  function modeName(n, pairs) {
    return n === 2 ? 'вдвоём' : n === 3 ? 'втроём' : (pairs ? 'вчетвером напару' : 'вчетвером каждый за себя');
  }
  function lvlName(l) { return l === 1 ? 'новичок' : l === 3 ? 'катала' : 'дворовый'; }
  function tourName(t) { return t >= 20 ? 'большой турнир до 20' : t ? 'малый турнир до 10' : 'свободная игра'; }

  // как устроен стол — этот текст видит гость, он же идёт в паузе
  function rulesSummary(o, lvl) {
    var l = [];
    l.push('Играем <b>' + (o.perevod ? 'в переводного' : 'в подкидного') + '</b> ' + modeName(o.players, o.pairs) +
      ', <b>' + tourName(o.tour) + '</b>.');
    if (lvl) l.push('Свободные места ведут боты уровня <b>' + lvlName(lvl) + '</b>.');
    var v = [];
    if (o.pogony !== false) v.push('погоны по лестнице званий');
    if (o.first5) v.push('в первый отбой не больше пяти');
    if (o.tour) v.push('дураку штрафное очко, за погоны вешающему минус два');
    l.push(v.length ? 'Включено: ' + v.join(', ') + '.' : '');
    return l.join(' ');
  }

  /* ---------- настройки ----------
     kind = 'game' — что за стол (только хозяин), 'me' — что про себя (всегда) */
  /* ---------- настройки: экран в меню, окошко за столом ----------
     Пока партия не запущена, любая кнопка меню должна оставаться тем же
     широким экраном с комнатой сбоку — окошко поверх прячет чат. */
  function splashOn() {
    var el = document.getElementById('splash');
    return !!(el && el.classList.contains('on'));
  }

  function settingsBody(kind) {
    function opt(k, t, d) {
      return '<div class="opt' + (CFG[k] ? ' on' : '') + '" data-t="' + k + '"><span class="sw"></span>' +
        '<span>' + t + '<span class="d">' + d + '</span></span></div>';
    }
    /* Партия идёт — настройки её правил только на просмотр. Движок забирает
       опции один раз, при создании игры: переключатель во время партии ничего
       бы не изменил в текущей раздаче, зато молча поменял бы правила следующей.
       А по сети — ещё и разъехались бы правила у хозяина и у гостей. */
    if (kind === 'game' && running()) return '' +
      '<div class="sub" style="margin:0 0 10px">Партия уже идёт, и правила у неё те, ' +
      'с которыми её начали. Поменять их можно будет, когда партия закончится.</div>' +
      '<h4 class="hd">По каким правилам играем</h4>' +
      '<div class="calc">' + rulesSummary(game.o, game.lvl) + '</div>';

    if (kind === 'game') return '' +
      '<h4 class="hd">Кто играет</h4>' +
      segHTML('segP', CFG.players, [[2, 'Вдвоём'], [3, 'Втроём'], [4, 'Вчетвером']]) +
      (CFG.players === 4 ? segHTML('segPair', CFG.pairs ? 1 : 0, [[0, 'Каждый за себя'], [1, 'Напару']]) : '') +
      '<h4 class="hd">Во что играем</h4>' +
      segHTML('segV', CFG.perevod ? 1 : 0, [[0, 'Подкидной'], [1, 'Переводной']]) +
      '<h4 class="hd">Турнир</h4>' +
      segHTML('segTour', CFG.tour, [[0, 'Без турнира'], [10, 'Малый, до 10'], [20, 'Большой, до 20']]) +
      '<div class="sub" style="margin:4px 0 0">Дураку — штрафное очко, в погонах тоже одно. Кто повесил ' +
      'погоны — списывает себе два. Набрал свои десять (двадцать) — дурак турнира.</div>' +
      '<h4 class="hd">Соперники</h4>' +
      segHTML('segL', CFG.level, [[1, 'Новичок'], [2, 'Дворовый'], [3, 'Катала']]) +
      '<h4 class="hd">Варианты правил</h4>' +
      '<div class="sub" style="margin:0 0 4px">Уговор дороже денег.</div>' +
      opt('pogony', 'Погоны', 'последним ходом две карты одного достоинства — и отбивающийся их забрал; ' +
        'достоинство по званию: шестёрки, потом семёрки и так до тузов') +
      opt('first5', 'Первый отбой — пять карт', 'в самый первый заход подкидывают не больше пяти');

    var skins = ART.SKINS.map(function (sk) {
      return '<div class="skin' + (CFG.skin === sk.id ? ' on' : '') + '" data-skin="' + sk.id +
        '" style="background:' + sk.bg + '"><span>' + sk.n + '</span></div>';
    }).join('') + ART.TABLES.map(function (t) {
      return '<div class="skin' + (CFG.skin === t.id ? ' on' : '') + '" data-skin="' + t.id +
        '" style="background-image:url(' + t.img + ')"><span>' + t.n + '</span></div>';
    }).join('') +
      (localStorage.durakBg ? '<div class="skin' + (CFG.skin === 'custom' ? ' on' : '') +
        '" data-skin="custom" style="background-image:url(' + localStorage.durakBg + ')"><span>своё</span></div>' : '');
    return '' +
      '<h4 class="hd">Ваш портрет</h4>' + faceRow(CFG.face) +
      '<h4 class="hd">Колода</h4>' + CARDS.tiles('deck', CFG.deck) +
      '<h4 class="hd">Рубашка</h4>' + CARDS.tiles('back', CFG.back) +
      '<h4 class="hd">Стол</h4><div class="skins">' + skins + '</div>' +
      '<div class="row"><label class="btn wide" style="text-align:center">Свой фон' +
      '<input type="file" id="bgFile" accept="image/*" hidden></label></div>' +
      '<h4 class="hd">Скорость</h4>' +
      segHTML('segS', CFG.speed, [[0.6, 'Спокойно'], [1, 'Обычная'], [1.8, 'Быстро'], [3, 'Очень быстро']]) +
      '<h4 class="hd">Как играется</h4>' +
      opt('talk', 'Боты таки разговаривают', 'одесские словечки под ситуацию; кнопка «Базар» в шапке делает то же') +

      /* Брокер — это сваха: он знакомит два браузера, а карты дальше
         ходят напрямую, мимо него. Общий, публичный, у некоторых
         провайдеров просто не открывается — сокет рвётся без ответа, и
         ни стол, ни комната не поднимаются. Лечится только другим
         адресом, поэтому он тут, а не зашит в сборку. */
      '<h4 class="hd">Свой брокер</h4>' +
      '<input class="fld" id="brk" maxlength="120" spellcheck="false" ' +
      'placeholder="пусто — общий брокер" value="' + esc(Net.brokerText()) + '">' +
      '<div class="row"><button class="btn wide" data-brk="1">Проверить связь</button></div>' +
      '<div class="sub" id="brkOut">Брокер только знакомит игроков между собой — карты ' +
      'потом ходят напрямую, и через него не проходят. Если общий недоступен у вашего ' +
      'провайдера, впишите свой: <b>мойсервер.ру</b>, <b>мойсервер.ру:9000</b> или ' +
      '<b>https://мойсервер.ру/путь</b>. Пусто — как раньше. Адрес должен быть один и тот ' +
      'же у всех за столом.</div>';
  }

  // клик по вопросику в сетке портретов — единственная подсказка про секреты
  function qHint(ev) {
    if (!ev.target.closest('[data-q]')) return false;
    var left = achLeft();
    UI.toast('Выполните секретные задания, чтобы разблокировать портреты! Закрытых осталось ' + left + '.');
    return true;
  }

  // общий разбор кликов: redraw — перерисовать то же самое, done — «Готово»
  function settingsClick(kind, ev, redraw, done) {
    var t = ev.target, seg;
    if (qHint(ev)) return;
    // страховка к тому же: в идущей партии правила не трогаем даже с клавиатуры
    if (kind === 'game' && running() && !t.closest('[data-x]')) return;
    var fc = t.closest('[data-face]');
    if (fc) {
      CFG.face = +fc.dataset.face; save(); pickedFace(CFG.face);
      if (game && game.faces) { game.faces[UI.me()] = CFG.face; UI.drawAll(); }
      if (Net.S.on) Net.updateMe(null, CFG.face);
      Hall.updateMe(myName(), CFG.face, hallCard());
      return redraw();
    }
    var cp = t.closest('[data-deck],[data-back]');
    if (cp) {
      if (cp.dataset.locked) return;                       // закрытое — пока не выбрать
      if (cp.dataset.deck) CFG.deck = cp.dataset.deck; else CFG.back = cp.dataset.back;
      var got = CARDS.apply(CFG.deck, CFG.back); CFG.deck = got.deck; CFG.back = got.back;
      save(); if (game) UI.drawAll(); return redraw();
    }
    var sk = t.closest('[data-skin]');
    if (sk) { CFG.skin = sk.dataset.skin; save(); ART.applySkin(CFG.skin); return redraw(); }
    seg = t.closest('#segP button');
    if (seg) { CFG.players = +seg.dataset.v; save(); return redraw(); }
    seg = t.closest('#segPair button'); if (seg) { CFG.pairs = seg.dataset.v === '1'; save(); return redraw(); }
    seg = t.closest('#segV button'); if (seg) { CFG.perevod = seg.dataset.v === '1'; save(); return redraw(); }
    seg = t.closest('#segTour button'); if (seg) { CFG.tour = +seg.dataset.v; save(); return redraw(); }
    seg = t.closest('#segL button'); if (seg) { CFG.level = +seg.dataset.v; save(); return redraw(); }
    seg = t.closest('#segS button'); if (seg) { CFG.speed = +seg.dataset.v; UI.setSpeed(CFG.speed); save(); return redraw(); }
    var o = t.closest('.opt');
    if (o) {
      var k = o.dataset.t;
      CFG[k] = !CFG[k];
      save(); talkBtn(); return redraw();
    }
    if (t.closest('[data-brk]')) {
      var f = document.getElementById('brk'), out = document.getElementById('brkOut');
      if (f) saveBroker(f.value);
      if (out) out.textContent = 'Проверяю…';
      Net.testBroker().then(function (v) {
        if (out) out.textContent = (Net.brokerText() || 'общий брокер') + ' — ' + v;
      });
      return;
    }
    if (t.closest('[data-x]')) return done();
  }

  /* Сменили брокер — комната висит на старом адресе, её надо переселить. */
  function saveBroker(v) {
    if (Net.brokerText() === (v || '').trim()) return;
    Net.setBroker(v);
    try { Hall.leave(); hallEnter(); } catch (e) { }
  }

  /* Поле брокера сохраняем по уходу из него, а не только по кнопке:
     человек впишет адрес и нажмёт «Готово», кнопку не тронув. */
  function bindBroker(m) {
    var f = m.querySelector('#brk');
    if (f) f.onchange = f.onblur = function () { saveBroker(f.value); };
  }

  function bindBgFile(m, redraw) {
    var f = m.querySelector('#bgFile');
    if (!f) return;
    f.onchange = function (e) {
      var fl = e.target.files[0]; if (!fl) return;
      var r = new FileReader();
      r.onload = function () {
        try { localStorage.durakBg = r.result; } catch (err) { UI.toast('Картинка слишком большая'); return; }
        CFG.skin = 'custom'; save(); ART.applySkin('custom'); redraw();
      };
      r.readAsDataURL(fl);
    };
  }

  function scrSettings(kind) {
    screen({
      title: kind === 'game' ? (running() ? 'Правила этой партии' : 'Настройки партии') : 'Мои настройки',
      body: settingsBody(kind) +
        '<div class="row"><button class="btn pri wide" data-x="1">Готово</button></div>',
      wire: function (ev) { settingsClick(kind, ev, function () { scrSettings(kind); }, back); },
      after: function (m) { bindBgFile(m, function () { scrSettings(kind); }); bindBroker(m); }
    });
  }
  function scrSetGame() { scrSettings('game'); }
  function scrSetMe() { scrSettings('me'); }

  function dlgSettings(kind, onClose) {
    kind = kind || 'me';
    if (splashOn()) return go(kind === 'game' ? scrSetGame : scrSetMe);   // мы в меню — обычный экран
    UI.setPaused(true);                                                   // мы за столом — окошко
    UI.modal(
      '<h3>' + (kind === 'game' ? (running() ? 'Правила этой партии' : 'Настройки партии') : 'Мои настройки') + '</h3>' + settingsBody(kind) +
      '<div class="row"><button class="btn pri wide" data-x="1">Готово</button></div>',
      function (m) {
        function reopen() { UI.closeModal(); dlgSettings(kind, onClose); }
        bindBgFile(m, reopen); bindBroker(m);
        m.onclick = function (ev) {
          settingsClick(kind, ev, reopen, function () {
            UI.closeModal();
            if (!splashOn()) UI.setPaused(false);
            if (onClose) onClose();
          });
        };
      });
  }

  function scrRules() {
    ach('reader');
    screen({
      title: 'Правила одесского дурака',
      body: rulesHTML() + '<div class="row"><button class="btn pri wide" data-r="1">Понятно</button></div>',
      wire: function (ev) { if (ev.target.closest('[data-r]')) back(); }
    });
  }

  function dlgRules() {
    if (splashOn()) return go(scrRules);
    ach('reader');
    UI.setPaused(true);
    UI.modal('<h3>Правила одесского дурака</h3>' + rulesHTML() +
      '<div class="row"><button class="btn pri wide" data-r="1">Понятно</button></div>',
      function (m) {
        m.onclick = function (ev) {
          if (!ev.target.closest('[data-r]')) return;
          UI.closeModal();
          if (!document.getElementById('splash').classList.contains('on')) UI.setPaused(false);
        };
      });
  }

  /* ============================================================
     РЕЙТИНГ ИГРОКА
     ============================================================
     Общий модуль платформы (`p2r_rating.js`, он же
     `платформа/rating/rating.js`) — его не правим: всё своё задаём
     здесь. Документация: `платформа/09-РЕЙТИНГ.md`, раздел про дурака.

     Единица — одна партия (кон), не турнир. Режим мест: вышел раньше —
     выше; вышли разом — одно место; дурак — последний. Напару места у
     пары общие. Погоны — разгром (`crush`), они дороже обычной победы.
     Подкидной и переводной — один рейтинг.

     Наружу игрок видит только звёзды: 3★ — на равных со средним ботом,
     4★ — с сильным. Числа ботов — замер `calib_rating.js` (ПЛАН.md).

     Бросил партию — поражение. На раздаче ложится «заявка» (залог
     поражения), снимается она только на итогах. */
  var RCFG = Rating.config('durak', {
    /* Замер 31.10.2026: вдвоём (calib_rating.js, 2000 партий на пару) и
       втроём (calib_rating3.js, 3600 партий) вместе — люди играют и так, и
       так. Втроём катала почти не сильнее дворового. Подробности — ПЛАН.md. */
    bots: { 1: 1391, 2: 1500, 3: 1527 }
  });
  var RT_KEY = 'durak-rating', RT_PEND = 'durak-rating-pend';

  function rtLoad() {
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(RT_KEY) || 'null'); } catch (e) { }
    return Rating.normalize(RCFG, raw);
  }
  function rtSave(st) { try { localStorage.setItem(RT_KEY, JSON.stringify(st)); } catch (e) { } }
  function rtPend() {
    try { return JSON.parse(localStorage.getItem(RT_PEND) || 'null'); } catch (e) { return null; }
  }
  function rtPendSave(p) {
    try { p ? localStorage.setItem(RT_PEND, JSON.stringify(p)) : localStorage.removeItem(RT_PEND); } catch (e) { }
  }

  /* Номер партии: основа стола + номер партии. Основа ставится на старте
     стола (у хозяина — с кодом комнаты) и едет гостям в общем состоянии,
     поэтому номер одинаковый у всех за столом. */
  function rtBase(net) {
    var t = Date.now().toString(36);
    return net ? (Net.S.code + '-' + t) : ('s' + t);
  }
  // кон 0 — карты ещё не розданы (гость получил стол до первой раздачи): партии нет
  function rtMid(g, n) { n = n || (g && g.handNo); return g && g.mbase && n ? g.mbase + '-' + n : null; }

  /* Кто за каким местом — одним списком и для заявки, и для итогов.
     Бот — уровнем, живой — состоянием рейтинга (едет в `statCard().rt`).
     Человек, который в ЭТОЙ партии вылетел и не вернулся (за него
     доигрывал бот), — его место с пометкой `left`; в следующих партиях
     это место уже просто бот. */
  function rtSeats(g, fin) {
    var out = [], i, me = UI.me(), net = !!(g.isNet || (Net.S && Net.S.on)), r = fin ? g.result : null;
    for (i = 0; i < g.N; i++) {
      var s = { key: String(i) };
      if (g.o && g.o.pairs) s.team = i % 2;
      if (r) {
        if (g.o.pairs) s.place = (r.draw || g.sideOf(i) !== r.foolSide) ? 1 : 2;
        else s.place = (r.ranks && r.ranks[i]) || (i === r.fool ? g.N : 1);
      }
      var rt = g.stats && g.stats[i] && g.stats[i].rt;
      var bot = !!(g.isBot && g.isBot[i]);
      if (i === me) s.state = rtLoad();
      else if (!net) s.bot = g.lvl || CFG.level;
      else if (!bot && rt) s.state = rt;
      else if (bot && rt && g.leftHand && g.leftHand[i] === g.handNo) { s.state = rt; s.left = true; }
      else s.bot = g.lvl || CFG.level;
      out.push(s);
    }
    return out;
  }

  /* Партия (кон) началась — кладём заявку. Лежит заявка от ДРУГОЙ
     партии — ту бросили: поражение здесь же (так ловится и «начал новую
     поверх сохранённой»). */
  function rtStart(g) {
    var id = rtMid(g); if (!id) return;
    // эта партия уже зачтена (или брошена и засчитана) — заявку не кладём
    if (rtLoad().ids.indexOf(id) >= 0) return;
    var p = rtPend();
    if (p && String(p.id) === id) return;
    if (p) rtForfeit(p, false);
    rtPendSave(Rating.pending(RCFG, { id: id, mode: 'rank', seats: rtSeats(g, false) }, String(UI.me())));
  }

  function rtForfeit(p, quiet) {
    if (!p) return null;
    var r = Rating.forfeit(RCFG, rtLoad(), p);
    rtPendSave(null);
    if (r.skipped) return null;
    rtSave(r.state);
    bumpStats({ rtLeft: 1 });
    if (!quiet) UI.toast('Незаконченная партия засчитана поражением');
    return r;
  }

  /* Человек сам уходит из идущей партии кнопкой. Одиночная партия
     сохраняется и ждёт в меню — уходом в меню она не бросается. */
  function rtQuit() {
    var p = rtPend();
    if (!p) return false;
    if (!Net.S.on && savedSolo()) return false;
    /* стол умер у хозяина (брокер трижды сказал «нет такого») — гость
       не бросал партию, заявку снимаем без поражения */
    if (Net.S.on && Net.hostGone && Net.hostGone()) { rtPendSave(null); return false; }
    rtForfeit(p, true);
    return true;
  }

  /* Итоги партии: зовёт стол СРАЗУ после хода, который её закончил, —
     пока движок не ушёл в следующую партию. У хозяина считается за всех и
     уезжает гостям в общем состоянии. Один раз: флаг на самом итоге. */
  function rtFinish(g) {
    if (!g || !g.result || g.result.rtDone) return null;
    var net = !!(g.isNet || (Net.S && Net.S.on));
    if (net && !Net.S.host) return null;              // гость ждёт ответа хозяина
    g.result.rtDone = true;
    var id = rtMid(g); if (!id) return null;
    var r = g.result, crush = r.pog ? [[String(r.pog.by), String(r.pog.to)]] : [];
    var res = Rating.applyMatch(RCFG, { id: id, mode: 'rank', seats: rtSeats(g, true), crush: crush });
    var mine = res.states[String(UI.me())];
    if (mine) rtSave(mine);
    /* Снимки гостей у хозяина (g.stats[i].rt) приехали в hello ДО этой
       партии. Не обновить — следующий кон за этим же столом хозяин
       посчитал бы от старого состояния, и гость потерял бы этот
       (09-РЕЙТИНГ, «Сеть»: терялась каждая вторая партия). */
    Object.keys(res.states).forEach(function (k) {
      var i = +k, ns = res.states[k];
      if (i === UI.me()) return;
      if (g.stats && g.stats[i]) g.stats[i].rt = ns;
      var c = Net.S && Net.S.conns && Net.S.conns[i];
      if (c && c.stats) c.stats.rt = ns;
    });
    var p = rtPend();
    if (p && String(p.id) === id) rtPendSave(null);
    if (net) g.rating = { id: id, res: res.states, d: res.deltas };
    return res;
  }

  /* Гость: хозяин прислал результат — принять своё и снять заявку.
     Зовётся на каждом обновлении; дважды одно и то же не применится. */
  var rtTaken = '';
  function rtNet(g) {
    if (!g || !g.rating || !Net.S.on || Net.S.host) return;
    var R = g.rating, me = String(UI.me());
    if (String(R.id) === rtTaken) return;
    rtTaken = String(R.id);
    var got = R.res && R.res[me];
    if (got) rtSave(Rating.adopt(RCFG, rtLoad(), got, R.id, R.d && R.d[me]));
    var p = rtPend();
    if (p && String(p.id) === String(R.id)) rtPendSave(null);
  }

  /* Запуск игры: лежит заявка — прошлую партию не доиграли. Продолжить
     можно только её же: сохранённую одиночную или стол с записью
     возврата. Иначе — поражение. */
  function rtBoot() {
    var p = rtPend();
    if (!p) return;
    var id = String(p.id);
    if (id.charAt(0) === 's') {
      var d = savedSolo();
      if (d && d.game && rtMid(d.game) === id) return;
    } else {
      var code = id.split('-')[0];
      var back = Net.savedBack(), host = Net.savedHost();
      /* ждём возврата за стол, но не вечно: неделя — и это поражение */
      if (((back && back.code === code) || (host && host.code === code)) &&
        !Rating.holdExpired(RCFG, p)) return;
    }
    rtForfeit(p, false);
  }

  /* Хозяин попрощался (`bye`) — что делать с заявкой, решает причина
     (09-РЕЙТИНГ, «Прощание хозяина»): void — стол закрыли или нас убрали,
     без поражения; lost — места за нами больше нет, поражение; hold и без
     причины («вы вошли из другого окна») — не трогаем. Заявку чужого
     стола не трогаем никогда: туда, может, ещё вернёмся. */
  function rtTableGone(why, code) {
    var p = rtPend();
    if (!p || String(p.id).charAt(0) === 's') return;
    if (code && String(p.id).split('-')[0] !== String(code)) return;
    if (why === 'void') rtPendSave(null);
    else if (why === 'lost') rtForfeit(p, false);
  }

  /* ---------- показ: звёзды, не число ---------- */
  function rtStars(st) { return Rating.starsHTML(RCFG, st || rtLoad()); }
  function rtLine(st) {
    var v = Rating.view(RCFG, st || rtLoad());
    if (v.calibrating)

  /* ---------- сохранение партии и статистика ---------- */
  function saveSolo() {
    if (!game || Net.S.on || game.over) return;
    try {
      localStorage.setItem('durak-solo', JSON.stringify({
        ts: Date.now(), players: game.N, lvl: CFG.level,
        faces: game.faces || null, chars: game.chars || null,
        game: Engine.snapshot(game)
      }));
    } catch (e) { }
  }
  function savedSolo() {
    try {
      var d = JSON.parse(localStorage.getItem('durak-solo') || 'null');
      if (!d || !d.game || d.game.over) return null;
      return d;
    } catch (e) { return null; }
  }
  function dropSolo() { try { localStorage.removeItem('durak-solo'); } catch (e) { } }

  function resumeSolo() {
    var d = savedSolo(); if (!d) return start();
    if (Net.S.on) Net.leave();
    leftTable = false;
    game = Engine.restore(d.game);
    game.faces = d.faces || []; game.chars = d.chars || []; game.lvl = d.lvl || CFG.level;
    if (!game.mbase) game.mbase = rtBase(false);   // сохранение до рейтинга
    brains = [];
    for (var i = 0; i < game.N; i++) brains.push(new Bots.Brain(game, i, d.lvl || CFG.level));

    UI.attach(game, brains, 0);
    rtStart(game);                       // заявка той же партии (или новая, если её не было)
    closeAll();
    UI.netEvents([]);

  function rollMe() {
    var mine = myFaces();
    var face = mine.length ? mine[Math.floor(Math.random() * mine.length)] : CFG.face;
    var sex = ART.FACE_SEX[face] || 'm';
    var cand = BOTNAMES.filter(function (n) { return n[1] === sex; });
    if (!cand.length) cand = BOTNAMES;
    var nm = cand[Math.floor(Math.random() * cand.length)][0];
    var pl = PLACES[Math.floor(Math.random() * PLACES.length)];
    // имя игрока режется до 14 знаков — прозвище лепим, только если влезает целиком
    if (Math.random() < 0.3 && (nm + ' ' + pl).length <= 14) nm += ' ' + pl;
    setMyName(nm);
    CFG.face = face; save();
    return nm;

  function dlgKick(seat, name, after) {

  /* ============================================================

     Тот же вид показывается соперникам по сети, когда они клацают по аватару.

  function pct(a, b) { return b ? Math.round(a * 100 / b) + '%' : '—'; }

  // таблица статистики; card — данные профиля (свои или пришедшие по сети)
  function statTable(card) {
    var st = card || stats();
    function row(k, v, hint) {
      return '<tr><td>' + k + '</td><td class="v">' + v +
        (hint ? ' <span class="dim">' + hint + '</span>' : '') + '</td></tr>';
    }
    var modes = [];
    if (st.g2) modes.push('вдвоём ' + st.w2 + '/' + st.g2);

    if (st.g4) modes.push('вчетвером ' + st.w4 + '/' + st.g4);
    if (st.gp) modes.push('напару ' + st.wp + '/' + st.gp);
    return '<table class="prof">' +
      row('Партий сыграно', st.games || 0, st.games ? 'не дураком ' + (st.wins || 0) + ', это ' + pct(st.wins, st.games) : '') +
      (modes.length ? row('По режимам', modes.join(' · '), 'не дураком / всего') : '') +

      row('Лучшая серия', st.streakMax || 0, 'партий подряд не дураком') +

  // словами: чем один характер отличается от другого, и как это звучит

  function cloudBox() {

        '<div class="row"><button class="btn wide" data-m="cl-out">Выйти из профиля</button></div>';
    } else {
