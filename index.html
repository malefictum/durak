        '<div class="row"><button class="btn pri wide" data-m="cl-google">Войти через Google</button></div>' +
        '<input class="fld" id="clMail" type="email" autocomplete="email" placeholder="Почта">' +
        '<input class="fld" id="clPass" type="password" autocomplete="current-password" placeholder="Пароль">' +
        '<div class="row"><button class="btn wide" data-m="cl-in">Войти</button>' +
        '<button class="btn wide" data-m="cl-up">Создать вход</button></div>' +
        '<div class="row"><button class="btn wide" data-m="cl-reset">Забыли пароль?</button></div>';
    }
    return h + '<div class="hint" id="cloudMsg">' +
      (C.state === 'wait' ? 'Связываемся с облаком…' : (C.err ? 'Облако: ' + esc(C.err) : '')) + '</div></div>';
  }
  function cloudClick(v, m) {
    if (v.indexOf('cl-') !== 0) return false;
    var say = function (t) { var e = m.querySelector('#cloudMsg'); if (e) e.textContent = t; };
    var fail = function (e) { say('Облако: ' + (e.message || e)); };
    var mail = ((m.querySelector('#clMail') || {}).value || '').trim();
    var pass = (m.querySelector('#clPass') || {}).value || '';
    if (v === 'cl-google') { say('Связываемся с облаком…'); Cloud.google().catch(fail); return true; }
    if (v === 'cl-out') {
      Cloud.signOut().then(function () { UI.toast('Вы вышли. Профиль остался и в этом браузере.'); }).catch(fail);
      return true;
    }
    if (v === 'cl-reset') {
      if (!mail) { say('Впишите почту — пришлём письмо для нового пароля.'); return true; }
      Cloud.reset(mail).then(function () { say('Письмо для нового пароля отправлено на ' + mail + '.'); }).catch(fail);
      return true;
    }
    if (!mail || !pass) { say('Впишите почту и пароль.'); return true; }
    say('Связываемся с облаком…');
    (v === 'cl-up' ? Cloud.signUp(mail, pass) : Cloud.signIn(mail, pass)).catch(fail);
    return true;
  }
  // вошли, вышли, забрали игру — экран профиля перерисовываем, если он открыт
  var cloudSeen = '';
  Cloud.on(function (C) {
    var k = (C.user ? C.user.uid : '') + '|' + C.owner + '|' + C.at;
    if (k === cloudSeen) return; cloudSeen = k;
    var a = document.activeElement;
    if (document.getElementById('cloudBox') && !(a && /^cl(Mail|Pass)$/.test(a.id))) scrProfile();
  });

  function scrProfile() {
    /* Список выбитых — карточками, как в преферансе: портрет, название и
       за что дано. Одной строкой «секретов выбито: 39» человек видит
       только цифру, а хочется видеть, ЧТО именно он выбил. */
    var got = achList(), doneA = [], goldN = 0, ai, ad;
    for (ai = 0; ai < got.length; ai++) {
      ad = achDef(got[ai]);
      if (ad) { doneA.push(ad); if (ad[3] >= GOLD0) goldN++; }
    }
    var achHTML = doneA.length
      ? doneA.slice().reverse().map(function (a2) {
        return '<div class="ach' + (a2[3] >= GOLD0 ? ' gold' : ' rare') + '">' +
          '<span class="aface">' + ART.ava(a2[3], '\u2605') + '</span>' +
          '<b>' + esc(a2[1]) + '</b><span class="ahow">' + esc(a2[2]) + '</span></div>';
      }).join('')
      : '<div class="hint">Пока ничего не выбито. Всё откроется само — за игру.</div>';

    var body =
      '<div class="profhead">' + ART.ava(CFG.face, 'Я', 'huge') +
      '<div><div class="pname">' + esc(myName()) + '</div>' +
      '<div class="sub" style="margin:0">' + shortLine() + '</div></div></div>' +
      cloudBox() +
      '<h4 class="hd">Как вас звать</h4>' +
      '<input class="fld" id="pfName" maxlength="14" placeholder="Ваше имя" value="' + esc(myName()) + '">' +
      '<h4 class="hd">Ваш портрет</h4>' + faceRow(CFG.face) +
      '<h4 class="hd">Ваш характер за столом</h4>' +
      '<div class="hint">Вы тоже отпускаете фразочки — они всплывают над вашей рукой. ' +
      'Характер решает, какие именно.</div>' +
      segHTML('segCh', CFG.myChar, [['auto', 'Под портрет'], ['b', 'Балагур'], ['p', 'Понтярщик'],
        ['j', 'Жлоб'], ['k', 'Катала'], ['s', 'Шлимазл'], ['off', 'Молчу']], 'grid') +
      '<div class="hint">' + charHint(CFG.myChar) + '</div>' +
      '<h4 class="hd">Ваш рейтинг</h4>' + rtBlock(rtLoad(), true) +
      '<div class="hint">Звёзды привязаны к ботам: три — вы играете на равных с дворовым, ' +
      'четыре — с каталой. Считается каждая партия; погоны стоят больше обычной победы, ' +
      'а брошенная партия засчитывается поражением.</div>' +
      '<h4 class="hd">Статистика</h4>' + statTable(null) +
      '<div class="sub">Считаются только доигранные до конца партии. ' +
      'Профиль видят соперники по сети — они могут клацнуть по вашему аватару.</div>' +
      '<h4 class="hd">Достижения ' + doneA.length + ' из ' + ACH.length +
      (goldN ? ' · золотых ' + goldN : '') + '</h4>' +
      '<div class="achlist">' + achHTML + '</div>' +
      '<div class="hint">Редких портретов на руках: <b>' + rareGot() + '</b> из ' + RARE.length +
      (achLeft() ? '. Закрыто ещё ' + achLeft() + '. Что именно — секрет: ' +
        'условие открывается вместе с портретом.' : ' — все ваши.') + '</div>' +
      /* Номер игрока. Ник: «нельзя было зайти дважды с одного профиля».
         Показываем его тут же, потому что у него есть одно живое
         применение: два устройства за одним столом. */
      '<h4 class="hd">Номер игрока</h4>' +
      '<div class="calc" style="font:12px/1.4 ui-monospace,Consolas,monospace">' +
      esc(Net.myUid()) + '</div>' +
      '<div class="hint">По нему стол узнаёт вас и не пускает за него дважды: один номер — ' +
      'одно место. Вылетели и вернулись — сядете на своё, а не рядом с собой. Номер ' +
      'переносится вместе с профилем; меняйте его, только если хотите сесть за один стол ' +
      'с двух устройств сразу.</div>' +
      (Cloud.user ? '<div class="hint">Пока вы вошли, номер общий для всех ваших устройств — ' +
        'так один вход не сядет за стол дважды.</div>'
        : '<div class="row"><button class="btn wide" data-m="newuid">Сменить номер</button></div>') +
      '<h4 class="hd">Профиль файлом</h4>' +
      '<div class="hint">Один файл уносит с собой всё: имя, портрет, открытые портреты, ' +
      'секреты и статистику. Пригодится, чтобы перенести себя на другой компьютер ' +
      'или вернуться после чистки браузера.</div>' +
      '<div class="row"><button class="btn wide" data-m="pfsave">Сохранить в файл</button>' +
      '<label class="btn wide" style="text-align:center">Загрузить из файла' +
      '<input type="file" id="pfFile" accept=".durak,text/plain" hidden></label></div>' +
      '<div class="row"><button class="btn wide" data-m="pfcode">Профиль строкой</button></div>' +
      '<div class="row"><button class="btn wide" data-m="reset">Сбросить статистику</button></div>' +
      '<div class="row"><button class="btn pri wide" data-m="done">Готово</button></div>';

    screen({
      title: 'Профиль игрока',
      sub: firstRun2 ? 'Знакомимся: имя и портрет мы вам уже выбрали — поправьте на свой вкус.'
        : 'Портрет, имя и всё, что вы наиграли.',
      body: body,
      wire: function (ev, m) {
        if (qHint(ev)) return;
        var fc = ev.target.closest('[data-face]');
        if (fc) {
          CFG.face = +fc.dataset.face; save(); pickedFace(CFG.face);
          if (game && game.faces && UI.me() != null) { game.faces[UI.me()] = CFG.face; UI.drawAll(); }
          if (Net.S.on) Net.updateMe(null, CFG.face);
          setMyName(m.querySelector('#pfName').value);
          Hall.updateMe(myName(), CFG.face, hallCard());
          return scrProfile();
        }
        var seg = ev.target.closest('#segCh button');
        if (seg) {
          CFG.myChar = seg.dataset.v; save();
          setMyName(m.querySelector('#pfName').value);
          return scrProfile();
        }
        var b = ev.target.closest('[data-m]'); if (!b) return;
        if (b.dataset.m === 'done') {
          setMyName(m.querySelector('#pfName').value);
          if (myName() !== 'Вы') ach('hello');
          return back();
        }
        if (b.dataset.m === 'pfsave') {
          setMyName(m.querySelector('#pfName').value);
          try { profileSave(); ach('saveFile'); }
          catch (e2) { UI.toast('Не вышло сохранить: ' + (e2.message || e2)); }
          return;
        }
        if (b.dataset.m === 'newuid') {
          Net.newUid();
          UI.toast('Новый номер игрока. За столы, где вы уже сидели, вы теперь другой человек.');
          return scrProfile();
        }
        if (cloudClick(b.dataset.m, m)) return;
        if (b.dataset.m === 'pfcode') { setMyName(m.querySelector('#pfName').value); return dlgProfileCode(); }
        if (b.dataset.m === 'reset') return dlgResetStats();
      },
      after: function (m) {
        var f = m.querySelector('#pfName');
        f.onchange = f.onblur = function () {
          setMyName(f.value);
          if (Net.S.on) Net.updateMe(myName(), null);
        };
        var fl = m.querySelector('#pfFile');
        if (fl) fl.onchange = function (e) {
          var file = e.target.files[0]; if (!file) return;
          var rd = new FileReader();
          rd.onload = function () {
            try {
              var r = profileLoad(rd.result);
              UI.toast('Профиль загружен: ' + r.name + ', портретов ' + r.faces + ', секретов ' + r.ach);
              scrProfile();
            } catch (err) { UI.toast('Файл не подошёл: ' + (err.message || err)); }
          };
          rd.readAsText(file);
        };
      }
    });
  }

  /* Запасной путь на случай, если скачивание в рамке itch запрещено:
     та же строка профиля, но её можно скопировать руками и вставить обратно. */
  function dlgProfileCode() {
    var code = '';
    try { code = profileText(); } catch (e) { code = ''; }
    UI.modal('<h3>Профиль строкой</h3>' +
      '<div class="sub">Скопируйте и сохраните где угодно, а на другом устройстве вставьте сюда же ' +
      'и нажмите «Применить». Это тот же файл, только строкой.</div>' +
      '<textarea class="fld" id="pfCode" rows="5" style="width:100%;resize:vertical;' +
      'font:12px/1.4 ui-monospace,Consolas,monospace">' + esc(code) + '</textarea>' +
      '<div class="row"><button class="btn wide" data-c="copy">Скопировать</button>' +
      '<button class="btn wide" data-c="load">Применить</button></div>' +
      '<div class="row"><button class="btn pri wide" data-c="x">Закрыть</button></div>',
      function (m) {
        m.onclick = function (ev) {
          var b = ev.target.closest('[data-c]'); if (!b) return;
          var v = b.dataset.c;
          if (v === 'copy') {
            UI.copyText(m.querySelector('#pfCode').value).then(function (ok) {
              UI.toast(ok ? 'Строка профиля скопирована' : 'Скопируйте вручную');
            });
            return;
          }
          if (v === 'load') {
            try {
              var r = profileLoad(m.querySelector('#pfCode').value);
              UI.closeModal();
              UI.toast('Профиль загружен: ' + r.name + ', портретов ' + r.faces + ', секретов ' + r.ach);
              return scrProfile();
            } catch (e2) { UI.toast('Строка не подошла: ' + (e2.message || e2)); return; }
          }
          UI.closeModal();
        };
      });
  }

  function dlgResetStats() {
    UI.modal('<h3>Сбросить статистику?</h3>' +
      '<div class="sub">Партии, дураки, погоны, турниры — всё обнулится. ' +
      'Портрет и имя останутся. Отменить это будет нельзя.</div>' +
      '<div class="row"><button class="btn wide" data-r="1">Да, обнулить</button>' +
      '<button class="btn pri wide" data-r="0">Оставить как есть</button></div>', function (m) {
        m.onclick = function (ev) {
          var b = ev.target.closest('[data-r]'); if (!b) return;
          UI.closeModal();
          if (b.dataset.r === '1') { resetStats(); UI.toast('Статистика обнулена'); scrProfile(); }
        };
      });
  }

  // карточка чужого игрока — по клику на аватар за столом
  function showProfile(seat) {
    if (!game) return;
    var isMe = (UI.me() === seat);
    var card = isMe ? statCard() : (game.stats && game.stats[seat]);
    var name = game.names[seat];
    var live = isMe || !brains[seat];
    var head = '<div class="profhead">' + ART.ava(game.faces ? game.faces[seat] : -1, name[0], 'huge') +
      '<div><div class="pname">' + esc(name) + '</div><div class="sub" style="margin:0">' +
      (isMe ? 'это вы' : (live ? 'живой игрок' : 'бот, уровень ' + lvlName(game.lvl || CFG.level))) +
      (game.o.pairs ? ' · ' + (UI.me() === seat ? '' : (seat === (UI.me() + 2) % 4 ? 'ваш напарник' : 'соперник')) : '') +
      '</div></div></div>';
    var face = game.faces ? game.faces[seat] : -1;
    var bio = (face >= 0 && ART.FACE_BIO && ART.FACE_BIO[face])
      ? '<div class="bio">' + esc(ART.FACE_BIO[face]) + '</div>' : '';
    /* Рейтинг соседа — то, ради чего по аватару и клацают. У бота его
       нет: боты и есть шкала, по ним звёзды и меряются. */
    var rt = card && card.rt;
    var body = bio + (rt ? rtBlock(rt, isMe) : '') + (card ? statTable(card)
      : '<div class="sub">' + (live ? 'Профиль этого игрока ещё не доехал.' :
        'За ботов статистику не ведут — они играют и не считают.') + '</div>');
    UI.modal(head + body + '<div class="row"><button class="btn pri wide" data-x="1">Закрыть</button></div>',
      function (m) {
        m.onclick = function (ev) { if (ev.target.closest('[data-x]')) UI.closeModal(); };
      }, { light: true });
  }

  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }


  /* ============================================================
     ХОЛЛ — кто сейчас в меню и о чём говорят.
     Истории нет: зашёл — видишь то, что говорят сейчас.
     ============================================================ */

  /* ---------- визитка для комнаты ----------
     В списке людей хотелось не просто имя, а «кто это вообще». Полную
     статистику слать нельзя: список уходит всем при каждом чихе. Поэтому
     пять чисел и до четырёх лучших секретов — золотые вперёд, они редкие
     и про них интереснее всего. */
  function hallCard() {
    var st = stats(), my = myFaces(), got = achList(), gold = [], rare = [];
    for (var i = 0; i < got.length; i++) {
      var d = achDef(got[i]);
      if (!d) continue;
      (d[3] >= GOLD0 ? gold : rare).push(got[i]);
    }
    return {
      f: my.length, a: got.length, gl: gold.length,
      g: st.games || 0, w: st.wins || 0, ng: st.nGames || 0, nw: st.nWins || 0,
      fo: st.fools || 0, pg: st.pogGave || 0, rk: st.rankMax || 0,
      rt: Rating.card(RCFG, rtLoad()),     // звёзды для карточки в комнате
      top: gold.concat(rare.slice(-4)).slice(0, 4)
    };
  }

  // карточка человека из комнаты — по тапу на строку
  function hallProfile(id) {
    var l = Hall.list(), m = null, i;
    for (i = 0; i < l.length; i++) if (l[i].id === id) m = l[i];
    if (!m) return;
    var c = m.card, mine = (Hall.S.me.id === id);
    var who = [];
    if (m.host) who.push('главный в комнате');
    if (mine) who.push('это вы');
    who.push(m.table ? 'за столом ' + esc(m.table.code) : 'в меню');
    var head = '<div class="profhead">' + ART.ava(m.face != null ? m.face : -1, (m.name || '?')[0], 'huge') +
      '<div><div class="pname">' + esc(m.name) + '</div>' +
      '<div class="sub" style="margin:0">' + who.join(' · ') + '</div></div></div>';

    var body;
    if (!c) {
      body = '<div class="sub">Визитка ещё не доехала — человек на старой сборке ' +
        'или только что вошёл.</div>';
    } else {
      var rows = [
        ['Портретов открыто', c.f + ' из ' + ART.have().length],
        ['Секретов выбито', c.a + ' из ' + RARE.length + (c.gl ? ' · золотых ' + c.gl : '')],
        ['Партий сыграно', c.g + (c.w ? ', не дураком ' + c.w : '')],
        ['По сети', c.ng ? c.ng + ' ' + plural(c.ng, 'партия', 'партии', 'партий') +
          (c.nw ? ', побед ' + c.nw : '') : 'ещё не играл'],
        ['Погон повесил', c.pg || '—'],
        ['Высшее звание', c.rk ? K.titleOf(c.rk) : '—']
      ];
      body = (c.rt ? rtBlock(c.rt, mine) : '') +
        '<table class="prof">' + rows.map(function (r) {
          return '<tr><td>' + r[0] + '</td><td class="v">' + r[1] + '</td></tr>';
        }).join('') + '</table>';
      var tops = (c.top || []).map(function (id2) { return achDef(id2); })
        .filter(function (d) { return !!d; });
      if (tops.length) {
        body += '<h4 class="hd">Чем гордится</h4><div class="topach">' +
          tops.map(function (d) {
            // имя в span, а не в b: внутри аватарки уже есть свой <b> с картинкой
            return '<div class="ta' + (d[3] >= GOLD0 ? ' gold' : '') + '">' +
              ART.ava(d[3], '?', 'sm') + '<span class="tt"><span class="tan">' + esc(d[1]) + '</span>' +
              '<i>' + esc(d[2]) + '</i></span></div>';
          }).join('') + '</div>';
      }
    }
    UI.modal(head + body + '<div class="row"><button class="btn pri wide" data-x="1">Закрыть</button></div>',
      function (mm) {
        mm.onclick = function (ev) { if (ev.target.closest('[data-x]')) UI.closeModal(); };
      }, { light: true });
  }

  /* Комната видела только «такой-то вышел» и не понимала, партия началась
     или человек закрыл вкладку. Теперь хозяин стола перед выходом говорит,
     кто сел играть и в каком составе. */
  function hallStartNote() {
    try {
      if (!Hall.S.ready) return;
      var l = (Net.S.host ? hostSeatList() : (Net.lobbyList() || [])), live = [];
      l.forEach(function (p) { if (p.name && p.online) live.push(p.name); });
      if (!live.length) live = [myName()];
      var N = Net.S.cfg ? Net.S.cfg.N : CFG.players;
      var who = live.length > 2
        ? live.slice(0, 2).join(', ') + ' и ещё ' + (live.length - 2)
        : live.join(' и ');
      // один живой — значит сел с ботами, и «сели» тут звучало бы странно
      Hall.announce(who + (live.length > 1 ? ' сели' : ' сел') + ' играть ' + modeName(N, Net.S.cfg && Net.S.cfg.o && Net.S.cfg.o.pairs) +
        (live.length === 1 ? ' с ботами' : '') + '.');
    } catch (e) { }
  }

  function hallHead() {
    var S = Hall.S;
    if (!S.on) return '<span class="hstat">не подключены</span>';
    if (S.err) return '<span class="hstat bad">комната недоступна</span>' +
      '<button class="btn tiny" data-m="hretry">Ещё раз</button>';
    if (!S.ready) return '<span class="hstat">подключаемся…</span>';
    // подключились — в шапке не пишем ничего: счётчик уехал в ярлык вкладки,
    // а «главный» подписан прямо в строке человека. Иначе пять элементов
    // в один ряд не влезали и чипы переносились второй строкой.
    return '';
  }

  function hallPeople() {
    var S = Hall.S;
    if (S.err) return '<div class="hempty">Комната не отвечает. Играть это не мешает: ' +
      'боты и вход по коду работают как обычно.</div>';
    if (!S.ready) return '<div class="hempty">Подключаемся к комнате…</div>';
    if (!S.members.length) return '<div class="hempty">Пока никого. Вы тут первый.</div>';
    return S.members.map(function (m) {
      var mine = (m.id === S.me.id), busy = !!m.table;
      var w = m.where || 'room';
      var wName = w === 'table' ? 'за столом' : w === 'bots' ? 'играет с ботами' : 'в меню';
      var dot = '<i class="hdotst ' + (w === 'room' ? 'free' : w === 'bots' ? 'bots' : 'busy') +
        '" title="' + wName + '"></i>';
      /* Вторая строка под именем — как в аське, где под ником стоит статус.
         Туда уезжает всё, что раньше теснилось справа и обрезало имя. */
      var sub = [];
      if (m.host) sub.push('<i class="hhost">главный</i>');
      if (mine) sub.push('это вы');
      if (busy && mine) sub.push('ваш стол ' + esc(m.table.code));
      else sub.push(wName);
      return '<div class="hrow tapme' + (mine ? ' me' : '') + '" data-hprof="' + m.id + '">' +
        '<span class="hav">' +
        ART.ava(m.face != null ? m.face : -1, (m.name || '?').charAt(0).toUpperCase(), 'sm') +
        dot + '</span>' +
        '<span class="hname"><b>' + esc(m.name) + '</b>' +
        '<span class="hsub">' + sub.join(' · ') + '</span></span>' +
        (busy && !mine
          ? (m.table.go
            /* За столом уже играют. Кнопки тут нет не для красоты:
               хозяин такого стола посадит только своих — тех, кто
               начинал, — а всем прочим ответит отказом. Пусть лучше
               видно сразу, чем после стука. */
            ? '<span class="hst">партия идёт</span>'
            : '<button class="btn tiny" data-hjoin="' + m.table.code + '">Подключиться</button>')
          : '') +
        '</div>';
    }).join('');
  }

  function hallLog() {
    var l = Hall.log();
    if (!l.length) return '<div class="hempty">Тут будет разговор. Историю не храним — только то, что говорят сейчас.</div>';
    return l.map(function (x) {
      if (x.k === 'sys') return '<div class="hmsg sys">' + esc(x.t) + '</div>';
      if (x.k === 'table') {
        var mine = Hall.S.me.table && Hall.S.me.table.code === x.code;   // свой стол не зовём
        /* Объявление висит в разговоре, а стол за это время мог уже
           сесть играть. Смотрим не на старую строку, а на живой список
           комнаты. */
        var going = Hall.S.members.some(function (p) {
          return p.table && p.table.code === x.code && p.table.go;
        });
        return '<div class="hmsg tbl">' + esc(x.t) +
          (mine ? ' <span class="hst">это ваш стол</span>'
            : going ? ' <span class="hst">партия идёт</span>'
              : ' <button class="btn tiny" data-hjoin="' + x.code + '">Подключиться</button>') + '</div>';
      }
      return '<div class="hmsg"><b>' + esc(x.from) + '</b> ' + esc(x.t) + '</div>';
    }).join('');
  }

  /* Звук и сворачивание — две одинаковые круглые иконки справа в шапке.
     Раньше тут была текстовая кнопка «♫ Звук», и вместе с двумя чипами
     ряд не помещался по ширине: чипы уезжали на вторую строку и оставляли
     в шапке дыру. Теперь слева название, справа две иконки — переносить нечего. */
  function hallBtns() {
    return '<button class="hico hsnd' + (CFG.snd ? '' : ' off') + '" data-m="hsnd" title="' +
      (CFG.snd ? 'Звуки комнаты включены. Нажмите — замолчит' : 'Звуки комнаты выключены. Нажмите — заговорит') +
      '">' + (CFG.snd ? '\u266a' : '\u266a') + '</button>' +
      '<button class="hico hfold" data-m="hfold" title="Свернуть комнату">' +
      (hallFold ? '\u25be' : '\u25b4') + '</button>';
  }

  /* ---------- вкладки комнаты ----------
     «Люди» и «Чат». Список и разговор раньше делили одну колонку: список
     был зажат в треть высоты и скроллился уже на пятерых, пока разговор внизу
     пустовал. Теперь каждая вкладка занимает всю высоту, а чтобы при одном
     госте не приходилось переключаться зря, число людей стоит прямо в ярлыке,
     а непрочитанное в чате отмечено точкой. */
  /* Ник: «пишу-пишу, а сообщения не видят». Комната открывается на чате —
     разговор виден сразу, а список людей ждёт во второй вкладке справа. */
  var hallTab = 'log', hallSeen = 0;

  function hallTabs() {
    var S = Hall.S, n = (S.on && S.ready && !S.err) ? S.members.length : 0;
    var unread = Hall.log().length - hallSeen;
    return '<button class="htab' + (hallTab === 'log' ? ' on' : '') + '" data-ht="log">Чат' +
      (hallTab !== 'log' && unread > 0 ? ' <i class="hnew"></i>' : '') + '</button>' +
      '<button class="htab' + (hallTab === 'people' ? ' on' : '') + '" data-ht="people">Люди' +
      (n ? ' <i class="hnum">' + n + '</i>' : '') + '</button>';
  }


  /* ---------- кто сейчас в сети и чем занят ----------

     Ник: «можешь показывать тех, кто онлайн, но условно в игре? В сетевой
     или просто с ботами?» Раньше ответ был «нет»: сел играть — вышел из
     комнаты, и она показывала «Люди 1», сколько бы столов ни шло рядом.
     Теперь человек из комнаты не исчезает, а получает отметку, и строка
     под вкладками разбирает всех по занятиям. */
  function hallOnline() {
    var S = Hall.S;
    if (!S.on || !S.ready || S.err) return '';
    var c = Hall.counts();
    if (c.all <= 1) return '<div class="honline">Пока вы тут один.</div>';
    var part = [];
    if (c.room) part.push(c.room + ' в комнате');
    if (c.table) part.push(c.table + ' за столом');
    if (c.bots) part.push(c.bots + ' с ботами');
    return '<div class="honline">' + c.all + ' в сети: ' + part.join(' · ') + '</div>';
  }

  function hallHTML() {
    return '<div class="hallcol' + (hallFold ? ' folded' : '') + ' t-' + hallTab + '">' +
      '<div class="hhead"><h4 class="hd">Комната</h4>' + hallHead() + hallBtns() + '</div>' +
      '<div class="htabs" id="hTabs">' + hallTabs() + '</div>' +
      '<div class="honlinebox" id="hOnline">' + hallOnline() + '</div>' +
      '<div class="hpeople" id="hPeople">' + hallPeople() + '</div>' +
      '<div class="hlog" id="hLog">' + hallLog() + '</div>' +
      '<div class="hsay"><input class="fld" id="hSay" maxlength="200" placeholder="Сказать всем…">' +
      '<button class="btn" data-m="hsend">Сказать</button></div>' +
      '</div>';
  }

  // перерисовываем только список и разговор, чтобы не сбивать набор текста
  function hallRefresh() {
    var box = document.getElementById('hPeople');
    if (!box) return;
    var keep = box.scrollTop;                       // список обновляется сам по себе —
    box.innerHTML = hallPeople();                   // не выдёргиваем его из-под пальца
    box.scrollTop = keep;
    var lg = document.getElementById('hLog');
    if (lg) { lg.innerHTML = hallLog(); lg.scrollTop = 1e6; }
    if (hallTab === 'log') hallSeen = Hall.log().length;
    var tb = document.getElementById('hTabs');
    if (tb) tb.innerHTML = hallTabs();
    var ob = document.getElementById('hOnline');
    if (ob) ob.innerHTML = hallOnline();
    var hh = document.querySelector('#splash .hhead');
    if (hh) hh.innerHTML = '<h4 class="hd">Комната</h4>' + hallHead() + hallBtns();
  }

  // Комната по умолчанию открыта везде — Ник: «хочу, чтобы он был всегда сбоку
  // и не прятался». Свернуть можно кнопкой, и только на узком экране.
  var hallFold = false;

  // звук общий для комнаты и стола; кнопки есть и там, и там
  function toggleSnd() {
    CFG.snd = !CFG.snd; save(); ART.setSnd(CFG.snd);
    if (CFG.snd) ART.play('msg');               // сразу слышно, что включилось
    try { if (UI.chatDraw) UI.chatDraw(); } catch (e) { }
    return CFG.snd;
  }

  /* В комнату заходим и во время партии: `enter` при уже поднятой комнате
     просто перевешивает обработчик и выходит, а если связь отвалилась —
     поднимет её заново. Раньше тут стояло `if (!running())`, и после
     любой осечки комната не возвращалась до перезагрузки. */
  function hallEnter() {
    Hall.enter(myName(), CFG.face, hallRefresh, hallCard());
  }

  /* Где мы сейчас — отвечаем в одном месте, по состоянию игры, а не
     расставляя вызовы по экранам. */
  function hallWhere() {
    Hall.where(!atTable() ? 'room' : (Net.S && Net.S.on ? 'table' : 'bots'));
    /* Стола больше нет, а объявление о нём в комнате осталось бы
       висеть до перезагрузки — с живой кнопкой «Подключиться» в
       никуда. Снимаем его здесь же, одним местом со «где мы». */
    if (Hall.S.me.table && !(Net.S && Net.S.on && Net.S.host)) Hall.table(null);
  }

  // звуки комнаты живут только в лобби: сели за стол — молчим
  Hall.sound(function (k) {
    if (atTable() || running()) return;
    ART.play(k);
  });

  // общие для всех экранов клики холла; true — событие наше, дальше не идёт
  function hallWire(ev, m) {
    var hj = ev.target.closest('[data-hjoin]');
    if (hj) { hallJoin(hj.dataset.hjoin); return true; }
    var hp = ev.target.closest('[data-hprof]');
    if (hp && !ev.target.closest('[data-hjoin]')) { hallProfile(hp.dataset.hprof); return true; }
    var ht = ev.target.closest('[data-ht]');
    if (ht) {
      hallTab = ht.dataset.ht;
      if (hallTab === 'log') hallSeen = Hall.log().length;
      var col = m.querySelector('.hallcol');
      if (col) { col.classList.toggle('t-people', hallTab === 'people'); col.classList.toggle('t-log', hallTab === 'log'); }
      hallRefresh();
      return true;
    }
    var b = ev.target.closest('[data-m]');
    if (!b) return false;
    var v = b.dataset.m;
    if (v === 'hsend') { hallSend(m); return true; }
    if (v === 'hsnd') { toggleSnd(); hallRefresh(); return true; }
    if (v === 'hretry') { Hall.leave(); hallEnter(); hallRefresh(); return true; }
    if (v === 'hfold') {
      hallFold = !hallFold;
      var c = m.querySelector('.hallcol');
      if (c) c.classList.toggle('folded', hallFold);
      b.textContent = hallFold ? '\u25be' : '\u25b4';
      if (!hallFold) hallRefresh();
      return true;
    }
    return false;
  }

  function hallStart(m) {
    hallEnter();
    hallWhere();
    hallRefresh();
    var f = m.querySelector('#hSay');
    if (f) f.onkeydown = function (e) {
      if (e.key === 'Enter') { hallSend(m); e.preventDefault(); }
    };
  }

  function hallSend(m) {
    var f = m.querySelector('#hSay');
    if (!f) return;
    var t = (f.value || '').trim();
    if (!t) return;
    Hall.say(t); f.value = '';
    bumpStats({ hallMsgs: 1 });
    if (stats().hallMsgs >= 50) ach('tamada');
  }

  // «Подключиться» из холла — сразу входим на стол под своим именем
  function hallJoin(code) {
    UI.toast('Стучусь на стол ' + code + '…');
    Net.S.myFace = CFG.face;
    Net.joinRoom(code, myName(), Net.LS('durak-key-' + code) || '', CFG.face)
      .then(function () { leftTable = false; netBtn(); go(scrGuestLobby); })
      .catch(function (e) { UI.toast('Не вышло: ' + (e && e.message ? e.message : e)); });
  }

  /* ============================================================
     ЭКРАН 1. Главное меню
     ============================================================ */
  function scrMain() {
    var sv = savedSolo(), host = Net.savedHost(), back = Net.S.on ? null : Net.savedBack();
    var fan = '';
    ['6S', '6H', 'QC', 'KD', 'AS'].forEach(function (id) {
      fan += '<div class="card">' + ART.faceHTML(K.parse(id)) + '</div>';
    });
    var body = '<div class="cards">' + fan + '</div>' +
      (sv ? '<div class="row"><button class="btn pri wide" data-m="resume">Продолжить партию — ' +
        modeName(sv.players, sv.game && sv.game.o && sv.game.o.pairs) + ', партия ' + (sv.game.handNo || 1) + '</button></div>' : '') +
      '<div class="menu">' +
      '<button class="btn' + (sv ? '' : ' pri') + '" data-m="solo">Играть одному</button>' +
      '<button class="btn" data-m="host">Играть по сети</button>' +
      '<button class="btn" data-m="join">Присоединиться к игре</button>' +
      '<button class="btn" data-m="profile">Профиль</button>' +
      '<button class="btn" data-m="rules">Правила</button>' +
      '</div>' +
      '<div class="rtmenu" data-m="profile" title="Ваш рейтинг — подробно в профиле">' +
      '<span>Ваш рейтинг</span>' + rtStars() + '</div>' +
      (host ? '<div class="row"><button class="btn wide" data-m="rehost">Продолжить отложенную партию — стол ' +
        host.code + (host.game && host.game.handNo ? ', партия ' + host.game.handNo : '') + '</button></div>' : '') +
      (back && !host ? '<div class="row"><button class="btn wide" data-m="back">Вернуться за стол ' +
        esc(back.code) + ' — место ' + (back.seat + 1) + '</button></div>' : '') +
      '<div class="foot"><span class="sub build">сборка ' + BUILD + '</span>' +
      '<a class="donate" href="https://malefictum.itch.io/durak/donate" target="_blank"' +
      ' rel="noopener noreferrer" title="Открыть страницу поддержки на itch.io">' +
      '\u2665 Поддержать</a></div>';

    screen({
      title: 'ОДЕССКИЙ ДУРАК',
      body: body,
      wire: function (ev, m) {
        var b = ev.target.closest('[data-m]'); if (!b) return;
        var v = b.dataset.m;
        if (v === 'resume') return resumeSolo();
        if (v === 'solo') return go(scrSolo);
        if (v === 'host') return go(scrHost);
        if (v === 'join') return go(scrJoin);
        if (v === 'profile') return go(scrProfile);
        if (v === 'rules') return dlgRules();
        if (v === 'rehost') return resumeHost(Net.savedHost());
        if (v === 'back') return resumeSeat(b);
      },
    });
  }

  /* Кто за столом, во что и на сколько — одним куском для «Играть одному»
     и «Играть по сети»: два экрана не должны разъехаться. */
  function tableSetupHTML() {
    return '<h4 class="hd">Кто за столом</h4>' +
      segHTML('segP', CFG.players, [[2, 'Вдвоём'], [3, 'Втроём'], [4, 'Вчетвером']]) +
      (CFG.players === 4 ? segHTML('segPair', CFG.pairs ? 1 : 0, [[0, 'Каждый за себя'], [1, 'Напару']]) : '') +
      '<h4 class="hd">Дурак</h4>' +
      segHTML('segV', CFG.perevod ? 1 : 0, [[0, 'Подкидной'], [1, 'Переводной']]) +
      '<h4 class="hd">Турнир</h4>' +
      segHTML('segTour', CFG.tour, [[0, 'Без турнира'], [10, 'Малый, до 10'], [20, 'Большой, до 20']]) +
      '<h4 class="hd">Боты</h4>' +
      segHTML('segL', CFG.level, [[1, 'Новичок'], [2, 'Дворовый'], [3, 'Катала']]);
  }
  function tableSetupClick(ev) {
    var seg = ev.target.closest('.seg button');
    if (!seg) return false;
    var box = seg.parentNode.id, v = seg.dataset.v;
    if (box === 'segP') CFG.players = +v;
    else if (box === 'segPair') CFG.pairs = v === '1';
    else if (box === 'segV') CFG.perevod = v === '1';
    else if (box === 'segTour') CFG.tour = +v;
    else if (box === 'segL') CFG.level = +v;
    else return false;
    save();
    return true;
  }

  /* ============================================================
     ЭКРАН 2. Играть одному
     ============================================================ */
  function scrSolo() {
    var body = tableSetupHTML() +
      '<div class="row"><button class="btn wide" data-m="cfg">Варианты правил</button>' +
      '<button class="btn wide" data-m="me">Мои настройки</button></div>' +
      '<div class="row"><button class="btn pri wide" data-m="go">Начать партию</button></div>';
    screen({
      title: 'Играть одному',
      sub: 'Свободные места займут боты. ' + rulesSummary(opts(CFG.players, []), CFG.level),
      body: body,
      wire: function (ev) {
        if (tableSetupClick(ev)) return scrSolo();
        var b = ev.target.closest('[data-m]'); if (!b) return;
        if (b.dataset.m === 'cfg') return dlgSettings('game', scrSolo);
        if (b.dataset.m === 'me') return dlgSettings('me', scrSolo);
        if (b.dataset.m === 'go') return rtAskNew(function () { closeAll(); dropSolo(); start(); });
      }
    });
  }

  /* ============================================================
     ЭКРАН 3. Играть по сети — создать стол
     ============================================================ */
  function scrHost() {
    var body =
      '<h4 class="hd">Как вас звать за столом</h4>' +
      '<input class="fld" id="hostName" maxlength="14" placeholder="Хозяин" value="' +
      esc(Net.LS('durak-name') || '') + '">' +
      '<h4 class="hd">Ваш портрет</h4>' + faceRow(CFG.face) +
      tableSetupHTML() +
      '<div class="row"><button class="btn wide" data-m="cfg">Варианты правил</button></div>' +
      '<div class="row"><button class="btn pri wide" data-m="go">Создать стол на ' + CFG.players + '</button></div>' +
      '<div class="warn" id="netWarn" hidden></div>';
    screen({
      title: 'Играть по сети',
      sub: 'Вы поднимаете стол и диктуете код остальным. Свободные места займут боты — ' +
        'начинать можно и вдвоём. Связь идёт напрямую между браузерами, своего сервера нет.',
      body: body,
      wire: function (ev, m) {
        if (qHint(ev)) return;
        var fc = ev.target.closest('[data-face]');
        if (fc) { CFG.face = +fc.dataset.face; save(); return scrHost(); }
        if (tableSetupClick(ev)) return scrHost();
        var b = ev.target.closest('[data-m]'); if (!b) return;
        if (b.dataset.m === 'cfg') return dlgSettings('game', scrHost);
        if (b.dataset.m !== 'go') return;
        var w = m.querySelector('#netWarn');
        var hn = (m.querySelector('#hostName').value || '').trim().slice(0, 14) || 'Хозяин';
        Net.LS('durak-name', hn);
        b.textContent = 'Поднимаю стол…';
        Net.S.myFace = CFG.face;
        Net.createRoom({ N: CFG.players, o: opts(CFG.players, []) }, hn, Net.lobbyPush, null, CFG.face)
          .then(function () {
            netBtn();
            Hall.table(Net.S.code, CFG.players);
            go(scrHostLobby);
          })
          .catch(function (e) {
            b.textContent = 'Создать стол на ' + CFG.players;
            w.hidden = false; w.textContent = 'Не вышло: ' + (e && e.message ? e.message : e);
          });
      }
    });
  }


  // рамка с крупным кодом и кнопкой «скопировать»; сам код тоже кликабелен
  function codeBox(val, note) {
    return '<div class="codebox">' + UI.copyHTML(val) +
      '<b data-cpy="' + val + '">' + val + '</b><span>' + note + '</span></div>';
  }

  /* ---------- лобби хозяина ---------- */
  function scrHostLobby() {
    var body =
      codeBox(Net.S.code, 'код стола — продиктуйте или скиньте игрокам') +
      '<div class="seats" id="seatsBox"' + (Net.S.cfg.o.pairs ? ' data-swap="1"' : '') + '>' +
      seatRows(hostSeatList(), !!Net.S.cfg.o.pairs) + '</div>' +
      '<div class="row"><button class="btn pri wide" data-m="go">Начать партию</button></div>' +
      '<div class="row"><button class="btn wide" data-m="cfg">Настройки партии</button>' +
      '<button class="btn wide" data-m="close">Закрыть стол</button></div>';
    screen({
      title: 'Стол собран',
      sub: rulesSummary(opts(CFG.players, []), CFG.level),
      body: body,
      wire: function (ev) {
        var kb = ev.target.closest('[data-kick]');
        if (kb) {
          var ks = +kb.dataset.kick;
          var kn = (Net.S.conns[ks] && Net.S.conns[ks].name) || '';
          dlgKick(ks, kn, scrHostLobby);
          return;
        }
        var sw = ev.target.closest('[data-swap]');
        if (sw && sw.dataset.swap && sw.classList.contains('seatrow')) {
          var seat = +sw.dataset.swap;
          if (swapPick < 0) swapPick = seat;
          else if (swapPick === seat) swapPick = -1;
          else { Net.swapSeats(swapPick, seat); swapPick = -1; }
          return scrHostLobby();
        }
        var b = ev.target.closest('[data-m]'); if (!b) return;
        if (b.dataset.m === 'cfg') return dlgSettings('game', scrHostLobby);
        if (b.dataset.m === 'go') {
          swapPick = -1;
          hallStartNote();                      // комната должна знать, что партия началась
          closeAll(); return startNet();
        }
        Net.leave(); Net.dropSaved(); netBtn(); Hall.table(null); back();
      }
    });
  }

  /* ============================================================
     ЭКРАН 4. Присоединиться
     ============================================================ */
  function scrJoin() {
    var savedCode = Net.LS('durak-room') || '';
    var savedKey = savedCode ? (Net.LS('durak-key-' + savedCode) || '') : '';
    var body =
      '<h4 class="hd">Код стола</h4>' +
      '<input class="fld code" id="joinCode" maxlength="4" placeholder="КОД" value="' + savedCode + '">' +
      '<h4 class="hd">Как вас звать</h4>' +
      '<input class="fld" id="joinName" maxlength="14" placeholder="Ваше имя" value="' +
      (Net.LS('durak-name') || '') + '">' +
      '<h4 class="hd">Ваш портрет</h4>' + faceRow(CFG.face) +
      (savedKey ? '<h4 class="hd">Ключ места — если возвращаетесь</h4>' +
        '<input class="fld" id="joinKey" maxlength="6" value="' + savedKey + '">' : '') +
      '<div class="row"><button class="btn pri wide" data-m="go">Войти</button>' +
      '<button class="btn wide" data-m="me">Мои настройки</button></div>' +
      '<div class="warn" id="netWarn" hidden></div>';

    screen({
      title: 'Присоединиться',
      sub: 'Спросите у хозяина код из четырёх знаков. Настройки стола задаёт он — ' +
        'вы выбираете только имя и портрет.',
      body: body,
      wire: function (ev, m) {
        if (qHint(ev)) return;
        var fc = ev.target.closest('[data-face]');
        if (fc) { CFG.face = +fc.dataset.face; save(); return scrJoin(); }
        var b = ev.target.closest('[data-m]'); if (!b) return;
        if (b.dataset.m === 'me') return dlgSettings('me', scrJoin);
        var w = m.querySelector('#netWarn');
        var code = (m.querySelector('#joinCode').value || '').trim().toUpperCase();
        var nm = (m.querySelector('#joinName').value || '').trim() || 'Игрок';
        var kf = m.querySelector('#joinKey');
        if (code.length !== 4) { w.hidden = false; w.textContent = 'Код из четырёх знаков.'; return; }
        b.textContent = 'Стучусь…';
        Net.S.myFace = CFG.face;
        Net.joinRoom(code, nm, kf ? kf.value.trim().toUpperCase() : '', CFG.face)
          .then(function () { leftTable = false; netBtn(); go(scrGuestLobby); })
          .catch(function (e) {
            b.textContent = 'Войти';
            w.hidden = false; w.textContent = 'Не вышло: ' + (e && e.message ? e.message : e);
          });
      }
    });
  }

  /* ---------- лобби гостя ---------- */
  function scrGuestLobby() {
    var o = (Net.S.cfg && Net.S.cfg.o) || {};
    var body =
      codeBox(Net.S.key, 'ваш ключ места — по нему вернётесь после обрыва') +
      '<h4 class="hd">Стол ' + Net.S.code + UI.copyHTML(Net.S.code, 'inline') + '</h4>' +
      '<div class="rules" style="font-size:13px">' + rulesSummary(o) + '</div>' +
      '<h4 class="hd">Ваш портрет</h4>' + faceRow(CFG.face) +
      '<div class="seats" id="seatsBox">' + seatRows(Net.lobbyList ? Net.lobbyList() : [], false) + '</div>' +
      '<div class="row"><button class="btn wide" data-m="me">Мои настройки</button>' +
      '<button class="btn wide" data-m="out">Выйти со стола</button></div>';
    screen({
      title: 'Ждём хозяина',
      sub: 'Партию начинает хозяин стола. Пока можно поменять портрет.',
      body: body,
      wire: function (ev) {
        if (qHint(ev)) return;
        var fc = ev.target.closest('[data-face]');
        if (fc) { CFG.face = +fc.dataset.face; save(); Net.updateMe(null, CFG.face); return scrGuestLobby(); }
        var b = ev.target.closest('[data-m]'); if (!b) return;
        if (b.dataset.m === 'me') return dlgSettings('me', scrGuestLobby);
        Net.leave(); netBtn(); back();
      }
    });
  }

  /* ============================================================
     ЭКРАН 5. Пауза — вызывается Esc и кнопкой «Меню»
     ============================================================ */
  function scrPause() {
    var net = Net.S.on;
    var body = '<div class="menu">' +
      '<button class="btn pri" data-m="back">Вернуться к партии</button>' +
      '<button class="btn" data-m="me">Мои настройки</button>' +
      '<button class="btn" data-m="profile">Профиль</button>' +
      '<button class="btn" data-m="rules">Правила</button>' +
      '<button class="btn" data-m="cfg">Правила этой партии</button>' +
      (net && Net.S.host
        ? '<button class="btn" data-m="later">Отложить партию — доиграем потом</button>' +
          '<button class="btn" data-m="end">Закончить партию и закрыть стол</button>'
        : '<button class="btn" data-m="quit">Выйти в главное меню</button>') +
      '</div>' +
      (net ? '<div class="sub" style="margin-top:12px">Стол <b>' + Net.S.code + '</b>' + UI.copyHTML(Net.S.code, 'inline') +
        (Net.S.host ? ' — вы хозяин.' : ', ваш ключ места <b>' + Net.S.key + '</b>' + UI.copyHTML(Net.S.key, 'inline')) + '</div>' : '') +
      '';
    screen({
      title: 'Пауза',
      sub: game ? rulesSummary(game.o, game.lvl) : '',
      body: body,
      wire: function (ev) {
        var b = ev.target.closest('[data-m]'); if (!b) return;
        var v = b.dataset.m;
        if (v === 'back') return closeAll();
        if (v === 'me') return dlgSettings('me', scrPause);
        if (v === 'profile') return go(scrProfile);
        if (v === 'cfg') return dlgSettings('game', scrPause);
        if (v === 'rules') return dlgRules();
        if (v === 'later') {
          Net.postpone(); netBtn();
          UI.toast('Партия отложена. Продолжить — в главном меню');
          return mainMenu();
        }
        if (v === 'end') {
          return rtAskLeave(function () {
            try { Net.closeTable('Хозяин закончил партию — стол закрыт.'); } catch (e) { }
            netBtn(); mainMenu();
          });
        }
        if (v === 'quit') {
          return rtAskLeave(function () {
            if (Net.S.on) { Net.leave(); netBtn(); }
            mainMenu();                        // стола для нас больше нет — вернёмся в комнату
          });
        }
      }
    });
  }

  function pauseMenu() { go(scrPause, true); }
  // в главное меню уходят только со стола — значит, партия для нас кончилась
  function mainMenu() { leftTable = true; go(scrMain, true); }

  /* ---------- вернуться на своё место ----------
     Ник: «вдруг вылетел — чтобы мог вернуться туда, где был». Код стола и
     ключ места хранились и раньше, но достать их можно было только руками
     через «Присоединиться». Теперь это одна кнопка: садимся по ключу, и
     хозяин возвращает то же место — партия при этом могла уже уйти вперёд,
     это нормально, состояние приедет целиком. */
  function resumeSeat(btn) {
    var d = Net.savedBack();
    if (!d) return;
    if (btn) btn.textContent = 'Стучусь за стол ' + d.code + '…';
    Net.S.myFace = CFG.face;
    Net.joinRoom(d.code, myName(), d.key, CFG.face)
      .then(function () {
        leftTable = false; netBtn();
        UI.toast('Вы снова за столом ' + d.code);
        go(scrGuestLobby);
      })
      .catch(function (e) {
        if (btn) btn.textContent = 'Вернуться за стол ' + d.code + ' — место ' + (d.seat + 1);
        UI.toast('Стол не отвечает: ' + (e && e.message ? e.message : e));
      });
  }

  /* ---------- поднять прежний стол ---------- */
  function resumeHost(d) {
    if (!d) return;
    Net.S.myFace = CFG.face;
    Net.createRoom(d.cfg, d.conns[0].name || 'Хозяин', Net.lobbyPush, { code: d.code, conns: d.conns }, CFG.face)
      .then(function () {
    leftTable = false;
    game = Engine.restore(d.game);
        game.chars = d.chars || game.chars || [];
        game.faces = d.faces || game.faces || [];
        brains = [];
        for (var i = 0; i < game.N; i++) {
          var wasBot = i !== 0 && (!d.conns[i] || d.conns[i].bot === undefined || d.conns[i].bot);
          brains.push(wasBot ? new Bots.Brain(game, i, CFG.level) : null);
        }
        Talk.reset();
        UI.setSpeed(CFG.speed);
        UI.attach(game, brains, 0);
        Net.startGame(game);
        Net.holdHumans();                      // люди с прошлого раза — ждём их, ботов не сажаем
        closeAll(); netBtn(); talkBtn();
        UI.netEvents([]);
        UI.toast('Стол ' + d.code + ' поднят. Игроки входят по своим ключам');
      })
      .catch(function (e) { UI.toast('Не вышло поднять стол: ' + (e && e.message ? e.message : e)); });
  }

  /* ---------- правила ---------- */
  function rulesHTML() {
    var tr = K.TRAKT.map(function (t) {
      return '<div class="trakt"><b>' + t[0] + '</b>' + t[1] + '</div>';
    }).join('');
    return '<div class="rules">' +
      '<h4 class="hd">Коротко</h4>' +
      '<p>Колода 36 карт, от шестёрки до туза. Каждому по шесть, следующая карта открывается и кладётся под колоду — ' +
      'её масть козырь. Кто первым избавился от карт — вышел; последний, у кого остались карты, — <b>дурак</b>.</p>' +
      '<h4 class="hd">Чем бьют</h4>' +
      '<ul><li>Старшинство: <b>6 7 8 9 10 В Д К Т</b>, одно для всех мастей.</li>' +
      '<li>Карту бьют старшей той же масти или любым козырем. Козырь — только старшим козырем.</li></ul>' +
      '<h4 class="hd">Заход и подкидывание</h4>' +
      '<ul><li>Заходят одной картой или несколькими одного достоинства — под соседа слева.</li>' +
      '<li>Отбился — можно подкинуть ещё: только того достоинства, что уже лежит на столе (и заходные, и отбойные). ' +
      'Первым подкидывает заходивший; сказал «бито» — право идёт по часовой. Отбивающийся сам себе не подкидывает.</li>' +
      '<li>Не больше шести карт за заход и не больше, чем было у отбивающегося на руках.</li>' +
      '<li>Отбился от всего — «бито», карты уходят в сброс, ходит отбившийся. Не отбился — «беру»: ' +
      'остальные могут подкинуть вдогонку, и он забирает всё. Ходит следующий за ним.</li>' +
      '<li>После захода добирают до шести: сначала заходивший, потом подкидывавшие, отбивающийся последним.</li></ul>' +
      '<h4 class="hd">Переводной</h4>' +
      '<p>Пока ни одна карта не побита, можно не отбиваться, а положить карту того же достоинства — заход ' +
      'переходит к следующему. У него должно хватить карт, чтобы отбиться от всего, что ляжет.</p>' +
      '<h4 class="hd">Погоны</h4>' +
      '<p>Колода кончилась, за столом двое, и последний ход — ровно две карты одного достоинства, которые ' +
      'отбивающийся забирает. Это погоны. Вешают по лестнице званий: <b>шестёрки — ефрейтор, семёрки — сержант, ' +
      'восьмёрки — лейтенант, девятки — капитан, десятки — майор, валеты — подполковник, дамы — полковник, ' +
      'короли — генерал, тузы — маршал</b>. Звание не сгорает: майору в следующий раз будут вешать валетов. ' +
      'Отбился от своей пары — погоны сорваны.</p>' +
      '<h4 class="hd">Турнир</h4>' +
      '<ul><li>Дураку — одно штрафное очко. В погонах — тоже одно.</li>' +
      '<li>Кто повесил погоны — списывает себе два штрафных (ниже нуля не бывает).</li>' +
      '<li>Малый турнир до 10 штрафных, большой — до 20. Кто набрал — дурак турнира.</li>' +
      '<li>Напару штрафные у пары общие.</li></ul>' +
      '<h4 class="hd">Как это сделано</h4>' + tr + '</div>';
  }

  function init() {
    load();
    var got = CARDS.apply(CFG.deck, CFG.back); CFG.deck = got.deck; CFG.back = got.back;
    document.documentElement.style.setProperty('--backimg', 'url("' + IMG.back + '")');
    ART.applySkin(CFG.skin);
    ART.setSnd(CFG.snd);
    ART.warm();                                  // колода в кэш, пока человек читает меню

    Rating.injectCSS();
    rtBoot();                 // незаконченная прошлая партия — поражение
    UI.bindOnce();
    $('#rulepane').innerHTML = rulesHTML();
    $('#bSettings').onclick = function () { dlgSettings('me'); };
    $('#bNet').onclick = function () { go(Net.S.on ? scrPause : scrMain, true); };
    $('#bTalk').onclick = toggleTalk;
    talkBtn();
    $('#bNew').onclick = function () { go(running() ? scrPause : scrMain, true); };
    // сначала выясняем, какие портреты лежат в img/faces, потом раздаём их за стол
    var started = false;
    function boot() { if (started) return; started = true; go(scrMain, true); }
    ART.probeFaces(function (ok, have) {
      var mine = myFaces();
      if (ok && mine.indexOf(CFG.face) < 0) { CFG.face = mine.length ? mine[0] : (have[0] || 0); save(); }
      var fresh = firstRun();
      if (fresh) { rollMe(); firstRun2 = true; }
      boot();
      // первый заход — сразу знакомимся: имя уже своё, но пусть поправит
      if (fresh) go(scrProfile);
    });
  }

  return {
    init: init, start: start, startNet: startNet, resumeHost: resumeHost,
    dlgMenu: mainMenu, mainMenu: mainMenu, pauseMenu: pauseMenu,
    saveSolo: saveSolo, dropSolo: dropSolo, bumpStats: bumpStats, setBest: setBest,
    stats: stats, statsLine: statsLine, statCard: statCard, setMax: setMax,
    showProfile: showProfile, scrProfile: scrProfile, running: running, myName: myName, toggleSnd: toggleSnd,
    hallCard: hallCard, hallProfile: hallProfile,
    CFG: CFG, dlgSettings: dlgSettings, unlockFace: unlockFace, facesLine: facesLine,
    ach: ach, achHas: achHas, achTake: achTake, ACH: ACH,
    profileText: profileText, profileLoad: profileLoad, profileSave: profileSave,
    BOTNAMES: BOTNAMES, rollBots: rollBots,
    lobbyRefresh: lobbyRefresh, lobbySeat: lobbySeat, netBtn: netBtn, talkBtn: talkBtn, save: save,
    /* рейтинг */
    RCFG: RCFG, rating: rtLoad, ratingSave: rtSave, ratingStars: rtStars,
    rtStart: rtStart, rtFinish: rtFinish, rtNet: rtNet, rtQuit: rtQuit, rtPend: rtPend,
    rtTableGone: rtTableGone, rtBlock: rtBlock, rtLine: rtLine
  };
})();
document.addEventListener('DOMContentLoaded', Boot.init);

</script>
</body>
</html>
