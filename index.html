             не трогаем вовсе: за столом всё в порядке, а новому стуку
             отвечаем, что он лишний. */
          var cur = S.conns[seat].conn;
          var fresh = Math.max(2000, T.beat * 3);
          if (cur.open && (Date.now() - (cur._seen || 0)) < fresh) {
            send(conn, { t: 'bye', seated: true,
              why: 'Вы уже за этим столом — играйте в том окне, где сидите.' });
            return;
          }
          try { send(cur, { t: 'bye', why: 'Вы вошли за этот стол из другого окна.' }); } catch (e) { }
          try { cur.close(); } catch (e) { }
          S.conns[seat].conn = null;
        }
      }
      // возврат по ключу — но занятое живое место не отбираем (двое за одним браузером)
      if (seat < 0 && m.key)
        for (i = 1; i < S.conns.length; i++)
          if (S.conns[i].key === m.key && !(S.conns[i].conn && S.conns[i].conn.open)) { seat = i; break; }
      /* ---------- партия идёт — за стол садятся только свои ----------

         Ник, 28.10, со скриншота комнаты: «если игра уже идёт, в неё
         должны садиться только те user с ID, которые были на момент
         старта. Тут двое играют — третий сесть к ним не должен. И не
         дай бог заместить другого игрока».

         Своих мы уже нашли выше: по номеру игрока (uid) или по ключу
         места. Всё, что ниже, — раздача ПУСТЫХ мест новичкам, и за
         идущим столом её быть не должно: пустых мест там не бывает
         вовсе. Любое место без соединения — чьё-то: либо его держат за
         вылетевшим, либо хозяин посадил туда бота, либо бот сидел там
         с самого начала. Посадить на такое место прохожего — значит
         отдать ему чужие карты.

         До старта (в лобби) всё по-прежнему: кто пришёл, тот и сел. */
      if (seat < 0 && S.ready) {
        /* Канал не рвём: `bye` должен доехать и сказать человеку, что
           случилось. Закрой соединение здесь — и гость увидит глухое
           «стол не отвечает», как будто стол сломан (так и вышло на
           первом прогоне проверки). */
        send(conn, { t: 'bye', rt: 'lost', why: 'Партия уже идёт. За этот стол могут вернуться ' +
          'только те, кто играл за ним с начала.' });
        return;
      }
      /* Пустые места раздаём новичкам — но место, которое СЕЙЧАС держат
         за вылетевшим, не трогаем ни в какую: иначе он вернётся, а за
         его картами уже сидит чужой человек. */
      if (seat < 0)
        for (i = 1; i < S.conns.length; i++)
          if (!S.conns[i].conn && !S.conns[i].away && S.conns[i].bot && !S.conns[i].name) { seat = i; break; }
      if (seat < 0)
        for (i = 1; i < S.conns.length; i++) if (!S.conns[i].conn && !S.conns[i].away) { seat = i; break; }
      if (seat < 0) {
        var held = awayList().length;
        send(conn, { t: 'bye', rt: 'lost', why: held
          ? 'Все места заняты: одно держат за игроком, который вот-вот вернётся.'
          : 'Стол уже полон' });
        return;
      }
      S.conns[seat].conn = conn; S.conns[seat].bot = false;
      S.conns[seat].conn._seen = Date.now();
      /* Вернулся — ждать больше нечего. Пауза снимется в `awayPush`
         ниже, когда список опустеет. */
      S.conns[seat].away = 0;
      S.conns[seat].uid = m.uid || null;
      /* Если этот же человек уже сидел где-то ещё (стол сломался до
         починки — так и бывало), освобождаем то место здесь и сейчас. */
      for (i = 1; i < S.conns.length; i++)
        if (i !== seat && m.uid && S.conns[i].uid === m.uid) {
          try { if (S.conns[i].conn) S.conns[i].conn.close(); } catch (e) { }
          S.conns[i].conn = null; S.conns[i].uid = null; S.conns[i].bot = true;
        }
      /* Место снова живое — снимаем с него бота, которого посадил
         обрыв связи. Иначе хозяин продолжает ходить за вернувшегося, и
         перехватить управление он не может ничем, кроме нового стола. */
      if (UI && UI.netFreeSeat) UI.netFreeSeat(seat);
      S.conns[seat].name = (m.name || 'Игрок').slice(0, 14);
      // портрет гостя: если такой уже занят — хозяин подберёт свободный того же пола
      var want = (typeof m.face === 'number' && m.face >= 0) ? m.face : -1;
      var busy = [];
      for (i = 0; i < S.conns.length; i++) if (i !== seat && S.conns[i].face >= 0) busy.push(S.conns[i].face);
      if (want < 0 || busy.indexOf(want) >= 0) {
        var free = ART.facesOf(want >= 0 ? ART.FACE_SEX[want] : 'm', busy);
        if (!free.length) free = ART.facesOf(want >= 0 && ART.FACE_SEX[want] === 'm' ? 'f' : 'm', busy);
        want = free.length ? free[0] : -1;
      }
      S.conns[seat].face = want;
      S.conns[seat].stats = m.stats || null;         // профиль гостя — его увидят соперники
      if (g) {
        if (!g.stats) g.stats = [];
        g.stats[seat] = S.conns[seat].stats;
      }
      if (g && g.faces) { g.faces[seat] = want; broadcast(g); }
      S.conns[seat].sent = 0;
      if (g) g.names[seat] = S.conns[seat].name;
      send(conn, {
        t: 'welcome', seat: seat, key: S.conns[seat].key, code: S.code,
        cfg: { N: S.cfg.N, o: S.cfg.o, names: names() }, started: !!S.ready
      });
      lobbyPush(); awayPush(); onState && onState();
      if (S.ready && g) { S.conns[seat].sent = 0; broadcast(g); }
      return;
    }
    if (m.t === 'me') {                              // гость поменял имя или портрет
      var st2 = seatOfConn(conn);
      if (st2 < 0) return;
      if (m.name) S.conns[st2].name = String(m.name).slice(0, 14);
      if (m.stats) {
        S.conns[st2].stats = m.stats;
        if (g) { if (!g.stats) g.stats = []; g.stats[st2] = m.stats; }
      }
      if (typeof m.face === 'number' && m.face >= 0) {
        var taken = [];
        for (i = 0; i < S.conns.length; i++) if (i !== st2 && S.conns[i].face >= 0) taken.push(S.conns[i].face);
        if (taken.indexOf(m.face) < 0) S.conns[st2].face = m.face;
      }
      if (g) {
        if (g.names) g.names[st2] = S.conns[st2].name;
        if (g.faces) g.faces[st2] = S.conns[st2].face;
        broadcast(g);
      }
      lobbyPush();
      return;
    }
    if (m.t === 'quit') {                            // гость ушёл кнопкой — место боту сразу
      var qs = seatOfConn(conn);
      if (qs <= 0) return;
      markAway(qs, onState);
      if (S.ready) seatBot(qs);
      return;
    }
    if (m.t === 'done') {                            // гость попрощался со счётом
      var ds = seatOfConn(conn);
      if (ds > 0) markDone(ds);
      return;
    }
    if (m.t === 'chat') {
      var cs = seatOfConn(conn);
      if (cs < 0) return;
      chatOut(S.conns[cs].name || ('Место ' + (cs + 1)), String(m.text || '').slice(0, 200), cs);
      return;
    }
    if (m.t === 'act') {
      if (!g || !g.pending) return;
      var st = seatOfConn(conn);
      if (st !== m.seat) return;
      if (g.pending.p !== st && g.pending.type !== 'next') return;
      UI.applyRemote(m.a);
    }
  }

  function toGuests(msg) {
    for (var i = 1; i < S.conns.length; i++)
      if (S.conns[i] && S.conns[i].conn) send(S.conns[i].conn, msg);
  }

  /* ---------- разговор за столом ----------
     Живой чат в сетевой партии. Хозяин — почтальон: принимает реплику,
     показывает у себя и раздаёт остальным. Историю нигде не храним. */
  // место отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // два игрока могут назваться одинаково
  function chatOut(from, text, seat) {
    if (!text) return;
    if (UI && UI.chatIn) UI.chatIn(from, text, seat);
    toGuests({ t: 'chat', from: from, text: text, seat: seat });
  }
  function chat(text) {
    text = String(text || '').trim().slice(0, 200);
    if (!text || !S.on) return;
    if (S.host) chatOut(S.conns[0].name || 'Хозяин', text, 0);
    else send(S.conns[0], { t: 'chat', text: text });
  }

  function names() { return S.conns.map(function (c, i) { return c.name || ('Место ' + (i + 1)); }); }

  // хозяин пересаживает двух игроков местами. Команды напару — это места
  // (0+2 против 1+3), так что пересадка и есть выбор команды.
  function swapSeats(i, j) {
    if (!S.host || S.ready) return false;
    if (i === j || i < 0 || j < 0 || i >= S.conns.length || j >= S.conns.length) return false;
    var a = S.conns[i], b = S.conns[j], k, t;

    /* ---------- пересадка переносит ЧЕЛОВЕКА, а не часть его ----------

       Ник: «при возврате сажает не на своё место — если хозяин тебя
       ПЕРЕСАДИЛ».

       Тут стоял список полей, которые едут с игроком: имя, ключ,
       соединение, портрет, профиль. Список надо было помнить и
       дополнять, и когда место стало опознаваться по номеру игрока
       (БОТЫ-ЗАМЕРЫ §54), номер в этот список дописать забыли. Снаружи
       это выглядело так: хозяин пересадил человека, тот вылетел и
       вернулся — а номер остался на СТАРОМ месте, по нему хозяин и
       сажал. Вернувшийся попадал на чужое место и вышибал оттуда
       соседа: «вы вошли за этот стол из другого окна».

       Поэтому не список, а наоборот: меняем местами ВСЁ, кроме номера
       самого места. Что бы к записи ни добавили завтра — оно поедет с
       человеком само, и эти грабли больше не разложить. */
    var keys = {};
    for (k in a) keys[k] = 1;
    for (k in b) keys[k] = 1;
    delete keys.seat;
    for (k in keys) { t = a[k]; a[k] = b[k]; b[k] = t; }
    a.seat = i; b.seat = j;
    // живым игрокам сообщаем их новое место, иначе они будут ждать чужих карт
    if (a.conn) send(a.conn, { t: 'seat', seat: i, key: a.key });
    if (b.conn) send(b.conn, { t: 'seat', seat: j, key: b.key });
    lobbyPush();
    return true;
  }
  function lobbyPush() {
    if (!S.host) return;
    var list = S.conns.map(function (c, i) { return { seat: i, name: c.name, online: !!c.conn || i === 0, bot: c.bot, face: c.face }; });
    for (var i = 1; i < S.conns.length; i++) send(S.conns[i].conn, { t: 'lobby', players: list, code: S.code });
    if (UI && UI.lobbyRefresh) UI.lobbyRefresh(list);
  }

  /* ---------- гость ---------- */
  function joinRoom(code, myName, key, face) {
    return loadPeer().then(function (ok) {
      if (!ok) throw new Error('нет связи с брокером');
      S.host = false; S.on = true; S.code = code.toUpperCase();
      LS('durak-room', S.code); LS('durak-name', myName);
      return new Promise(function (res, rej) {
        var done = false, tries = 0;
        function ok2(v) { done = true; S._resolve = S._reject = null; res(v); }
        /* Отказ хозяина — такой же ответ, как согласие, и ждать после
           него нечего. Без этого стук в идущую партию заканчивался так:
           человек видел «Партия уже идёт», а через четырнадцать секунд
           вдогонку глухое «стол не отвечает» — будто стол ещё и сломан. */
        function no2(e) { done = true; S._resolve = S._reject = null; rej(e); }
        S._resolve = ok2; S._reject = no2;
        (function attempt() {
          tries++;
          var p = newPeer(null);
          S.peer = p;
          p.on('open', function () {
            keepAlive(p, 'гость');
            var conn = p.connect(PREFIX + S.code, { reliable: true });
            /* Столом этот провод станет не сейчас, а когда хозяин
               ответит «добро пожаловать» (см. ниже). Пока мы только
               стучимся, и подменять им рабочий провод нельзя: брошенный
               стук не должен уводить за собой стол. */
            conn.on('open', function () {
              S.lastHost = Date.now();
              send(conn, {
                t: 'hello', name: myName, face: face, uid: myUid(),
                key: key || LS('durak-key-' + S.code) || '',
                stats: (window.Boot && Boot.statCard) ? Boot.statCard() : null
              });
            });
            conn.on('data', function (m) {
              /* ---------- старое соединение за стол не говорит ----------

                 Ник, 29.10: «при начале партии иногда не появляется окно
                 торга, из-за каких-то сбоев; помогает только если хозяин
                 перезапускает партию и игроки доприсоединяются».

                 Вот как это выходило. Провод мигнул на пару секунд —
                 гость поднимает НОВОЕ соединение и садится на своё место
                 («Вы снова за столом»). А хозяин, сажая его, прощается со
                 старым соединением того же номера игрока: «Вы вошли за
                 этот стол из другого окна». Прощание едет в ТУ ЖЕ
                 вкладку — провод-то вернулся, — и она послушно уходит в
                 меню. Хозяин при этом видит место живым и ждёт от гостя
                 слова, а гость сидит в меню. Дальше круг: гость
                 возвращается, его опять выбрасывает прощанием, и так без
                 конца — пока стол не поднимут заново.

                 Правило: за стол говорит только ТЕКУЩЕЕ соединение.
                 Всё, что приходит со старого, — эхо; его слушать нельзя,
                 и само оно нам больше не нужно. */
              /* «Добро пожаловать» приходит по тому проводу, который
                 хозяин ТОЛЬКО ЧТО посадил за стол, — значит этот провод
                 и есть стол, каким бы старым ни был наш стук. Так цепь
                 сходится сама: пока мы стучались несколько раз подряд,
                 хозяин оставил за нами последний, прочие сам и
                 оборвал. */
              if (m && m.t === 'welcome') S.conns = [conn];
              if (S.conns[0] && conn !== S.conns[0]) { try { conn.close(); } catch (e) { } return; }
              S.lastHost = Date.now();
              if (m && m.t === 'pong') return;
              onGuestMsg(m, res);
            });
            /* Обрыв считается обрывом СТОЛА только если оборвался тот
               самый провод, которым мы за столом сидим. Закрытие
               брошенного стука — не беда: мы его сами и погасили.
               (Пока «добро пожаловать» не пришло, стола у нас ещё нет,
               и стучится за нас сам `joinRoom` — он же и отвечает за
               неудачу.) */
            conn.on('close', function () { if (S.conns[0] && conn === S.conns[0]) onLost(); });
            conn.on('error', function () { if (!done) no2(new Error('стол не отвечает')); });
          });
          p.on('error', function (e) {
            if (done) return;
            var t = (e && e.type) || '';
            /* брокер ответил, а хозяина нет — считаем подряд: три раза
               подряд значит стол умер у хозяина, а не у нас (у нас бы
               не ответил и брокер). Нужно рейтингу: гость не виноват. */
            if (t === 'peer-unavailable') S.hostMiss = (S.hostMiss || 0) + 1;
            else if (TRANSIENT[t]) S.hostMiss = 0;
            if (TRANSIENT[t] && tries < 3) {
              try { p.destroy(); } catch (e2) { }
              return setTimeout(attempt, 500 * tries);
            }
            try { p.destroy(); } catch (e2) { }
            S.on = false; S.peer = null;
            no2(new Error(netErr(e)));
          });
        })();
        setTimeout(function () { if (!done) no2(new Error('стол не отвечает')); }, 14000);
      });
    });
  }

  function onGuestMsg(m, res) {
    /* Мы уже не за столом — всё, что долетает следом, не наше дело.
       Иначе поздний `sync` заново заводил бы партию и клал заявку на
       рейтинг на брошенный стол (урок клабора, 09-РЕЙТИНГ). */
    if (m.t !== 'bye' && m.t !== 'welcome' && (!S.on || !S.conns[0])) return;
    if (m.t === 'welcome') {
      S.seat = m.seat; S.key = m.key;
      LS('durak-key-' + S.code, m.key);
      /* Куда возвращаться, если вылетел. Код стола и ключ места и так
         лежали в хранилище, но добраться до них можно было только через
         «Присоединиться» с ручным вводом. Теперь это одна запись, и меню
         делает из неё кнопку «Вернуться за стол». */
      try {
        LS('durak-back', JSON.stringify({
          code: S.code, key: m.key, seat: m.seat, at: Date.now()
        }));
      } catch (e) { }
      S.cfg = m.cfg;
      S.game = new NetGame(m.cfg, m.seat);
      /* Стол у нас теперь НОВЫЙ объект, и показывать его должен тот же
         `UI` — значит привязать его надо заново. Признак «партия уже
         идёт» для этого и гасим: первый же `sync` сделает `UI.attach`.

         Без этого выходило тихо и обидно: после возврата окно торга на
         экране было (от прежнего стола), а ответить в него было
         нельзя — вопрос приезжал в новый стол, а интерфейс жил старым.
         Ровно то, на что жаловались: «окно не появляется / не
         работает, помогает только перезапуск». */
      S.ready = false;
      S.lost = false;
      if (S._resolve) { S._resolve(m); return; }
      /* Ждать это «добро пожаловать» уже некому: наш стук сочли
         неудачным и начали следующий, а ответ пришёл с опозданием. Всё
         равно мы за столом — значит возврат состоялся: гасим цикл
         возврата и окно «Связь прервалась», иначе человек так и будет
         стучаться в стол, за которым уже сидит. */
      stopLoop();
      if (UI && UI.closeModal) UI.closeModal();
      if (UI && UI.toast) UI.toast('Вы снова за столом');
      return;
    }
    if (m.t === 'lobby') { S.lobby = m.players; if (UI && UI.lobbyRefresh) UI.lobbyRefresh(m.players); return; }
    if (m.t === 'away') {                            // стол ждёт вылетевшего — и мы ждём вместе с ним
      S.away = m.list || [];
      if (UI && UI.netAway) UI.netAway(S.away);
      return;
    }
    if (m.t === 'seat') {                            // хозяин пересадил — запоминаем новое место
      S.seat = m.seat;
      if (m.key) { S.key = m.key; LS('durak-key-' + S.code, m.key); }
      if (S.game) S.game.seat = m.seat;
      if (UI && UI.toast) UI.toast('Хозяин пересадил вас на место ' + (m.seat + 1));
      if (window.Boot && Boot.lobbySeat) Boot.lobbySeat();
      return;
    }
    if (m.t === 'chat') {
      if (UI && UI.chatIn) UI.chatIn(m.from, String(m.text || '').slice(0, 200), m.seat);
      return;
    }
    if (m.t === 'bye') {
      /* Отказ «вы уже за этим столом» — не беда, а ответ на лишний
         стук: стол на месте, мы за ним сидим другим проводом. Гасим
         возврат и окно «Связь прервалась», и живём дальше. */
      if (m.seated) {
        S.lost = false; stopLoop();
        if (UI && UI.closeModal) UI.closeModal();
        return;
      }
      /* Стол закрылся не по нашей вине — хозяин его свернул или высадил
         нас. Это единственный случай, когда заявка на партию снимается
         БЕЗ поражения: мы бы доиграли, да стола больше нет. Свой
         проигрыш за это получит тот, кто бросил, — из своей заявки. */
      /* Рейтинг по причине: void — стол закрыл/убрал хозяин (без поражения),
         hold — отложено (заявка ждёт), lost — места за нами больше нет
         (поражение). Без причины («вы вошли из другого окна» и т. п.)
         заявку не трогаем: партия идёт в другом окне. */
      if (window.Boot && Boot.rtTableGone) { try { Boot.rtTableGone(m.rt || '', S.code); } catch (e) { } }
      S.on = false;
      /* Ещё стучались — значит это ответ на стук: отдаём его тому, кто
         ждёт обещание (кнопке «Подключиться» в комнате, например), и
         второй раз не тостим. */
      if (S._reject) { var no = S._reject; S._resolve = S._reject = null; no(new Error(m.why || 'Стол закрыт')); return; }
      UI.toast(m.why || 'Стол закрыт');
      // высаженного гостя не оставляем перед мёртвым списком мест
      try { if (window.Boot && Boot.mainMenu) { UI.closeModal(); Boot.mainMenu(); } } catch (e) { }
      return;
    }
    if (m.t === 'sync') {
      var g = S.game; if (!g) return;
      if (!S.ready) {
        S.ready = true;
        g.applySync(m.pub, m.priv);
        g.pendHold = m.priv.pending || null;
        UI.attach(g, [], g.seat);
        /* Партия для нас началась (или мы вернулись в идущую) — заявка.
           Номер партии общий (основа `mbase` + номер кона). */
        if (window.Boot && Boot.rtStart) { try { Boot.rtStart(g); } catch (e) { } }
        UI.closeModal();
        UI.closeSplash();                         // партия началась — убираем лобби со стола
        if (window.Hall) Hall.where('table');     // из комнаты не уходим — только помечаемся
      } else {
        g.applySync(m.pub, m.priv);
        g.pendHold = m.priv.pending || null;
      }
      UI.netEvents(m.ev || []);
    }
  }

  function updateMe(name, face) {
    if (!S.on) return;
    if (S.host) {                                   // хозяин меняет себе сам
      if (name) S.conns[0].name = String(name).slice(0, 14);
      if (typeof face === 'number' && face >= 0) S.conns[0].face = face;
      if (window.Boot && Boot.statCard) S.conns[0].stats = Boot.statCard();
      if (S.game) {
        if (name) S.game.names[0] = S.conns[0].name;
        if (S.game.faces) S.game.faces[0] = S.conns[0].face;
        if (!S.game.stats) S.game.stats = [];
        S.game.stats[0] = S.conns[0].stats;
        broadcast(S.game);
      }
      lobbyPush();
      return;
    }
    send(S.conns[0], {
      t: 'me', name: name || undefined, face: face,
      stats: (window.Boot && Boot.statCard) ? Boot.statCard() : null
    });
  }

  function onLost() {
    if (!S.on || S.host) return;
    S.lost = true;
    if (UI && UI.netLost) UI.netLost();
  }

  function reconnect() {
    /* Прежний пир после обрыва новых соединений не принимает и сам ни
       к кому не подключится — его надо гасить целиком, а не «чинить». */
    S.conns = [];
    try { if (S.peer) S.peer.destroy(); } catch (e) { }
    S.peer = null; S.ready = false;
    return joinRoom(S.code, LS('durak-name') || 'Игрок', LS('durak-key-' + S.code) || '', S.myFace);
  }

  /* ---------- возврат за стол ----------

     Ник: «при обрыве игрок вылетает и не может вернуться назад в той же
     сессии — он не может сесть за своё старое место».

     Место ему вернуть умел уже номер игрока. Вернуться было НЕЧЕМ:
     `reconnect` в игре не вызывал никто. Гость видел красную кнопку
     «Связь!» — и дальше только главное меню и новый стол.

     Теперь гость стучится сам, с растущей паузой, пока хозяин не
     отзовётся. Пир каждый раз новый, а `hello` идёт с тем же номером и
     ключом — и хозяин отдаёт ему его место. */
  var looping = null, backT = null, loopStop = false;
  function reconnectLoop(onTry, limit) {
    if (looping) return looping;
    clearTimeout(backT); loopStop = false;
    var n = 0, code = S.code;
    S.hostMiss = 0;
    looping = new Promise(function (res, rej) {
      (function once() {
        if (loopStop || S.host || S.code !== code) { looping = null; return rej(new Error('стол уже не тот')); }
        n++;
        if (onTry) onTry(n);
        /* Неудачный вход гасит признак «мы за столом» — для входа с нуля
           это правда, для возврата нет: место за нами держат, и стучаться
           мы собираемся до конца. Поэтому поднимаем признак сами, иначе
           цикл обрывался на первой же неудачной попытке. */
        S.on = true;
        reconnect().then(function (w) {
          S.lost = false; S.hostMiss = 0; looping = null; res(w);
        }, function () {
          if (n >= (limit || 40)) { looping = null; return rej(new Error('стол не отозвался')); }
          backT = setTimeout(once, Math.min(6000, 1200 + n * 400));
        });
      })();
    });
    return looping;
  }
  function stopLoop() { loopStop = true; clearTimeout(backT); looping = null; }

  /* ---------- конец партии: в лобби выходят все ----------

     Ник: «нужно просто после сетевой партии выкидывать всех в лобби, и
     всё — после того как каждый нажал ок после счёта».

     Раньше стол закрывал ПЕРВЫЙ нажавший: хозяин жал «выйти в лобби», и
     остальных выдёргивало из-за стола прямо со счётом на экране. Теперь
     наоборот — закрывает ПОСЛЕДНИЙ: пока кто-то ещё смотрит итог, связь
     ему нужна. Каждый нажал — стол закрылся, и все оказались в лобби.

     Чтобы один задумавшийся не держал стол вечно, у хозяина стоит срок:
     не дождались — закрываем сами. */
  var DONE_WAIT = 45000;
  var doneT = null;

  /* Кого ещё ждём. Считаем только живых: вылетевший своё «ок» не нажмёт,
     и ждать его смысла нет. */
  function doneList() {
    var out = [], i, c;
    for (i = 0; i < S.conns.length; i++) {
      c = S.conns[i];
      if (!c) continue;
      if (i === 0 || c.conn) out.push({ seat: i, name: c.name || ('Место ' + (i + 1)), done: !!c.done });
    }
    return out;
  }
  function allDone() {
    var l = doneList(), i;
    for (i = 0; i < l.length; i++) if (!l[i].done) return false;
    return true;
  }
  function closeNow() {
    clearTimeout(doneT); doneT = null;
    try { closeTable('Партия окончена — стол закрыт.'); } catch (e) { }
    /* окно со счётом у хозяина ещё открыто («Ждём остальных…») — убираем,
       иначе оно остаётся под меню и потом ложится на новый стол */
    try { if (UI && UI.closeModal) UI.closeModal(); } catch (e) { }
    try { if (window.Boot && Boot.mainMenu) Boot.mainMenu(); } catch (e) { }
  }
  /* Хозяин отметил, что место со счётом попрощалось. */
  function markDone(seat) {
    if (!S.host) return;
    if (S.conns[seat]) S.conns[seat].done = true;
    if (UI && UI.netDone) UI.netDone(doneList());
    if (allDone()) closeNow();
  }
  /* Нажали «в лобби» здесь. Возвращаем true, если ждать больше некого. */
  function doneHere() {
    if (!S.on) return true;
    if (!S.host) { send(S.conns[0], { t: 'done' }); return true; }
    clearTimeout(doneT);
    doneT = setTimeout(closeNow, DONE_WAIT);     // один задумался — стол не вечный
    markDone(0);
    return allDone();
  }

  /* ---------- закрыть стол ----------

     Ник: «когда заканчивается игра с сетевыми игроками, кнопка „ещё
     партию“ баганутая — запускается для одного игрока. Просто оставь
     кнопку выйти в лобби, где игроки выходят в главное меню, а текущий
     стол закрывается».

     Так и делаем: хозяин говорит всем «стол закрыт» (у гостя это уже
     разобрано — он получает `bye`, видит причину и уходит в меню),
     убирает сохранённый стол и гасит связь. Гость просто уходит сам. */
  function closeTable(why) {
    if (!S.on) return;
    if (S.host) {
      for (var i = 1; i < S.conns.length; i++) {
        var c = S.conns[i];
        if (!c || !c.conn) continue;
        try { send(c.conn, { t: 'bye', rt: 'void', why: why || 'Партия окончена, стол закрыт.' }); } catch (e) { }
        try { c.conn.close(); } catch (e) { }
        c.conn = null;
      }
      dropSaved();
    }
    leave();
  }

  /* ---------- отложить партию ----------
     [stated] Ник 22.10.2026: «игра сохраняется — недоигранная партия
     записывается хозяину стола; её можно закрыть и потом продолжить».
     Запись уже лежит (saveHost на каждом ходе). Здесь хозяин закрывает
     стол, НЕ стирая её, и прощается с гостями — иначе они бесконечно
     стучались бы обратно. У гостей остаётся «Вернуться за стол»: когда
     хозяин поднимет стол, они сядут на свои места по ключу и номеру. */
  function postpone() {
    if (!S.on) return;
    if (S.host) {
      if (S.game) saveHost(S.game);
      for (var i = 1; i < S.conns.length; i++) {
        var c = S.conns[i];
        if (c && c.conn) send(c.conn, { t: 'bye', later: true, rt: 'hold',
          why: 'Хозяин отложил партию. Доиграете потом: «Вернуться за стол» в главном меню, когда он снова поднимет стол.' });
      }
      setTimeout(leave, 400);                 // прощание уходит по проводу — рвём связь не сразу
      return;
    }
    leave();
  }
  /* Поднятый стол: места людей не отдаём ботам, а ждём их — как при
     обрыве. Вернулся — сел на своё место; не вернулся — хозяин решает
     сам (кнопка «Посадить бота» в плашке). */
  function holdHumans() {
    if (!S.host) return 0;
    var k = 0;
    for (var i = 1; i < S.conns.length; i++) {
      var c = S.conns[i];
      if (c && !c.bot && !c.conn) { c.away = Date.now(); k++; }
    }
    if (k) { lobbyPush(); awayPush(); }
    return k;
  }

  function leave() {
    stopLoop();
    /* Явный уход гостя кнопкой: сначала говорим хозяину, чтобы место
       сразу отдали боту (09-РЕЙТИНГ: партия у ушедшего уже проиграна,
       ждать его незачем). Канал закрываем чуть позже, иначе прощание
       не успеет уйти. */
    /* Стол гасим ПЕРЕД тем, как рвать провод: закрытие соединения
       иначе выглядит обрывом, и цикл возврата сажает ушедшего обратно. */
    var h0 = !S.host && S.conns && S.conns[0], pr = S.peer;
    var bye = !!(h0 && h0.open && !S.lost);
    if (bye) { try { send(h0, { t: 'quit' }); } catch (e) { } }
    S.on = false; S.host = false; S.ready = false; S.peer = null; S.conns = []; S.game = null;
    S.away = []; S.lost = false; S.lastHost = 0;
    if (bye) setTimeout(function () { try { if (pr) pr.destroy(); } catch (e) { } }, 250);
    else { try { if (pr) pr.destroy(); } catch (e) { } }
    if (UI && UI.netAway) UI.netAway([]);
  }

  /* ---------- часовой ----------
     Один на всё: он и пульс стучит, и терпение считает. Тикаем чаще,
     чем стучим: шаг в полсекунды нужен, чтобы сроки не округлялись до
     четырёх секунд — это видно и на столе, и в проверках. */
  var lastPing = 0;
  setInterval(function () {
    if (!S.on) return;
    var now = Date.now(), i, c;
    if (S.host) {
      for (i = 1; i < S.conns.length; i++) {
        c = S.conns[i];
        if (!c || !c.conn) continue;
        if (now - (c.conn._seen || now) > T.dead) {
          var dead = c.conn;
          try { dead.close(); } catch (e) { }
          dropConn(dead);                            // молчит слишком долго — считаем, что ушёл
        }
      }
      return;
    }
    var h = S.conns && S.conns[0];
    if (!h) return;
    if (h.open && now - lastPing >= T.beat) { lastPing = now; send(h, { t: 'ping' }); }
    if (!S.lost && S.lastHost && now - S.lastHost > T.dead) {
      try { h.close(); } catch (e) { }
      onLost();
    }
  }, 500);

  function startGame(game) {
    S.game = game; S.ready = true;
    for (var i = 0; i < S.conns.length; i++) if (S.conns[i]) S.conns[i].sent = 0;
    broadcast(game);
  }

  return {
    S: S, createRoom: createRoom, joinRoom: joinRoom, broadcast: broadcast,
    startGame: startGame, leave: leave, reconnect: reconnect, loadPeer: loadPeer,
    hostGone: function () { return !!S.lost && (S.hostMiss || 0) >= 3; },
    T: T, reconnectLoop: reconnectLoop, seatBot: seatBot, awayList: awayList,
    newPeer: newPeer, brokerText: brokerText, brokerCfg: brokerCfg,
    setBroker: setBroker, testBroker: testBroker,
    myUid: myUid, setUid: setUid, newUid: newUid,
    saveHost: saveHost, savedHost: savedHost, dropSaved: dropSaved, updateMe: updateMe,
    closeTable: closeTable, postpone: postpone, holdHumans: holdHumans, doneHere: doneHere, doneList: doneList,
    savedBack: savedBack, dropBack: dropBack,
    chat: chat,
    loadPeer: loadPeer, PREFIX: PREFIX, send: send,
    names: names, lobbyPush: lobbyPush, swapSeats: swapSeats, kick: kick, lobbyList: function () { return S.lobby || []; }, NetGame: NetGame, rndKey: rndKey, LS: LS
  };
})();

/* ============================================================
   ДУРАК — холл: кто сейчас в меню и о чём говорят

   Своего сервера у игры нет, поэтому холл держит браузер одного из игроков.
   Все занимают один и тот же известный адрес у брокера; кому он достался —
   тот и «главный в комнате»: он ведёт список и пересылает сообщения.
   Ушёл главный — оставшиеся через случайную паузу переизбирают нового.

   Истории нет и не задумано: зашёл — видишь то, что говорят сейчас.
   ============================================================ */
var Hall = (function () {
  'use strict';

  var HALL = 'HALL';                 // адрес комнаты у брокера: PREFIX + HALL
  var PING = 20000;                  // как часто напоминаем о себе
  var CLAIM_WAIT = 2600;             // сколько ждём, пока займётся адрес

  var H = {
    on: false, host: false, ready: false,
    peer: null, hostConn: null, conns: [],
    me: { id: '', name: '', face: -1, table: null, where: 'room' },
    members: [], msgs: [], hostName: '',
    onChange: null, err: ''
  };

  // счётчик попыток: старые таймеры и события от прошлого соединения
  // не должны рушить уже поднятую комнату
  var gen = 0;
  function now() { return Date.now(); }
  function hallId() { return Net.PREFIX + HALL; }
  function fire() { if (H.onChange) try { H.onChange(); } catch (e) { } }

  /* Звуки комнаты. Наружу отдаём только повод — играть или молчать,
     решает оболочка (за столом молчим всегда).
     Про свои же действия не сигналим: вошёл кто-то другой, сказал кто-то другой,
     стол поднял кто-то другой. */
  function snd(k) { if (H.onSound) try { H.onSound(k); } catch (e) { } }
  var seenIds = null;
  function noteMembers() {
    var ids = H.members.map(function (m) { return m.id; });
    if (seenIds === null) { seenIds = ids; return; }     // первый список — молчим
    var me = H.me.id, fresh = ids.filter(function (id) {
      return id !== me && seenIds.indexOf(id) < 0;
    });
    seenIds = ids;
    if (fresh.length) snd('join');
  }

  function line(kind, text, from, code, N) {
    H.msgs.push({ k: kind, t: text, from: from || '', code: code || null, N: N || 0, ts: now() });
    if (H.msgs.length > 60) H.msgs.splice(0, H.msgs.length - 60);
    fire();
  }

  /* ---------- вход ---------- */

  /* Вместе с именем и портретом человек несёт в комнату визитку: сколько
     портретов открыл, сколько секретов выбил, пара лучших достижений.
     Это несколько чисел, а не вся статистика — список рассылается всем
     при каждом изменении, и тяжёлую поклажу туда класть нельзя. */
  function enter(name, face, onChange, card) {
    if (H.on) { H.onChange = onChange; if (card) H.me.card = card; fire(); return; }
    H.on = true; H.err = ''; H.onChange = onChange;
    H.me.name = (name || 'Игрок').slice(0, 14);
    H.me.face = (face == null ? -1 : face);
    H.me.card = card || null;
    H.me.table = null;
    H.me.where = 'room';
    H.members = []; H.msgs = []; seenIds = null;
    Net.loadPeer().then(function (ok) {
      if (!ok) { H.err = 'нет связи с брокером'; H.on = false; fire(); return; }
      claim();
    }).catch(function () { H.err = 'нет связи с брокером'; H.on = false; fire(); });
  }

  // сперва пробуем стать главным; адрес занят — значит холл уже есть, идём гостем
  function claim() {
    if (!H.on) return;
    var my = ++gen, p, done = false;
    try { p = Net.newPeer(hallId()); } catch (e) { return guest(my); }
    p.on('open', function () {
      if (done || my !== gen || !H.on) { try { p.destroy(); } catch (e) { } return; }
      done = true;
      H.peer = p; H.host = true; H.ready = true;
      H.me.id = 'host';
      H.hostName = H.me.name;
      H.members = [{ id: 'host', name: H.me.name, face: H.me.face,
        card: H.me.card, table: null, where: H.me.where, host: true }];
      seenIds = ['host'];        // подняли комнату: мы в ней одни, дальше всякий новый — со звуком
      p.on('connection', onGuest);
      line('sys', 'Комната поднята. Пока главный тут — вы.');
      fire();
    });
    p.on('error', function () {
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch (e) { }
      guest(my);
    });
    setTimeout(function () {
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch (e) { }
      guest(my);
    }, CLAIM_WAIT);
  }

  function guest(my) {
    if (!H.on || my !== gen) return;
    var p, done = false;
    try { p = Net.newPeer(null); } catch (e) { H.err = 'нет связи'; fire(); return; }
    H.peer = p; H.host = false;
    p.on('open', function () {
      if (my !== gen) { try { p.destroy(); } catch (e) { } return; }
      var c = p.connect(hallId(), { reliable: true });
      H.hostConn = c;
      c.on('open', function () {
        if (my !== gen) return;
        H.lastHost = now();
        done = true; H.ready = true;
        Net.send(c, { t: 'hi', name: H.me.name, face: H.me.face, card: H.me.card, w: H.me.where });
        fire();
      });
      c.on('data', function (m) { H.lastHost = now(); if (my === gen) onHostMsg(m); });
      c.on('close', function () { if (my === gen) lostHost(); });
      c.on('error', function () { if (!done && my === gen) retry(); });
    });
    p.on('error', function () { if (!done && my === gen) retry(); });
    setTimeout(function () { if (!done && H.on && my === gen) retry(); }, CLAIM_WAIT);
  }

  // главный ушёл — ждём вразнобой и пробуем занять его место
  function retry() {
    if (!H.on) return;
    gen++;                                    // всё, что было до этого, больше не наше
    H.ready = false; H.host = false; H.hostConn = null; H.members = [];
    try { if (H.peer) H.peer.destroy(); } catch (e) { }
    H.peer = null;
    fire();
    setTimeout(claim, 200 + Math.floor(Math.random() * 900));
  }

  function lostHost() {
    if (!H.on || H.host) return;
    line('sys', 'Главный вышел из комнаты, ищем нового…');
    retry();
  }

  function leave() {
    H.on = false; H.ready = false; H.host = false; gen++;
    if (H.hostConn) { try { Net.send(H.hostConn, { t: 'bye' }); } catch (e) { } }
    try { if (H.peer) H.peer.destroy(); } catch (e) { }
    H.peer = null; H.hostConn = null; H.conns = []; H.members = []; H.msgs = [];
    fire();
  }

  /* ---------- главный ---------- */

  function onGuest(conn) {
    conn._seen = now();
    H.conns.push(conn);
    conn.on('data', function (m) { conn._seen = now(); fromGuest(conn, m); });
    conn.on('close', function () { dropGuest(conn); });
    conn.on('error', function () { dropGuest(conn); });
  }

  function dropGuest(conn) {
    var i = H.conns.indexOf(conn);
    if (i >= 0) H.conns.splice(i, 1);
    var m = memberOf(conn);
    if (m) {
      H.members = H.members.filter(function (x) { return x.id !== m.id; });
      line('sys', m.name + ' вышел из комнаты.');
      pushList();
    }
  }

  function memberOf(conn) {
    for (var i = 0; i < H.members.length; i++) if (H.members[i].conn === conn) return H.members[i];
    return null;
  }

  function fromGuest(conn, m) {
    if (!m || !m.t) return;
    if (m.t === 'hi') {
      var was = memberOf(conn);
      if (was) {                                 // это не новый игрок, а тот же сменил имя
        was.name = String(m.name || was.name).slice(0, 14);
        if (typeof m.face === 'number' && m.face >= 0) was.face = m.face;
        if (m.card) was.card = m.card;
        pushList();
        return;
      }
      var id = 'p' + (++seq);
      var mem = { id: id, name: String(m.name || 'Игрок').slice(0, 14),
        face: (typeof m.face === 'number' ? m.face : -1), card: m.card || null,
        table: null, where: (m.w === 'table' || m.w === 'bots') ? m.w : 'room',
        conn: conn };
      H.members.push(mem);
      Net.send(conn, { t: 'you', id: id });
      line('sys', mem.name + ' вошёл в комнату.');
      pushList();
      return;
    }
    var who = memberOf(conn);
    if (!who) return;
    if (m.t === 'msg') return broadcastMsg(who.name, String(m.text || '').slice(0, 200), who.id);
    if (m.t === 'table') {
      var had = who.table && who.table.code;
      who.table = m.code ? { code: String(m.code).slice(0, 6), N: m.N || 3, go: !!m.go } : null;
      // новость — только новый стол; «теперь там играют» объявлять незачем
      if (who.table && who.table.code !== had) tableLine(who.name, who.table.code, who.table.N, who.id);
      else if (!who.table && had) line('sys', who.name + ' закрыл стол.');
      pushList();
      return;
    }
    if (m.t === 'note') {                       // «сели играть» — разносим от имени комнаты
      var tx = String(m.text || '').slice(0, 120);
      if (tx) { line('sys', tx); toAll({ t: 'sys', text: tx }); }
      return;
    }
    /* Раньше тут был `gone`: сел играть — и мы вычёркивали человека из
       комнаты совсем. Ник: «можешь показывать тех, кто онлайн, но условно
       в игре?» Может, и это честнее: человек никуда не делся, он просто
       занят. Теперь вместо вычёркивания — пометка, где он. */
    if (m.t === 'where') {
      var w = (m.w === 'table' || m.w === 'bots') ? m.w : 'room';
      if (who.where !== w) { who.where = w; whereLine(who.name, w, who.id); }
      pushList();
      return;
    }
    if (m.t === 'bye') return dropGuest(conn);
  }
  var seq = 0;

  function pubList() {
    return H.members.map(function (m) {
      return { id: m.id, name: m.name, face: m.face, card: m.card || null,
        table: m.table, where: m.where || 'room', host: !!m.host };
    });
  }
  function pushList() {
    // соединение могло тихо отвалиться — такие места в списке не держим
    H.members = H.members.filter(function (m) { return m.host || (m.conn && m.conn.open !== false); });
    H.conns = H.conns.filter(function (c) { return c && c.open !== false; });
    var l = pubList();
    H.conns.forEach(function (c) { Net.send(c, { t: 'list', members: l, hostName: H.me.name }); });
    noteMembers();
    fire();
  }
  function toAll(msg) {
    H.conns.forEach(function (c) { Net.send(c, msg); });
  }
  // id отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // двое могут назваться одинаково
  function broadcastMsg(from, text, sid) {
    if (!text) return;
    line('msg', text, from);
    if (sid !== H.me.id) snd('msg');
    toAll({ t: 'msg', from: from, text: text, sid: sid });
  }
  function tableLine(name, code, N, sid) {
    line('table', name + ' создал стол' + (N ? ' на ' + N : ''), name, code, N);
    if (sid !== H.me.id) snd('table');
    toAll({ t: 'table', from: name, code: code, N: N, sid: sid });
  }

  /* Короткая строка в разговор: человек сел играть или вернулся. Это не
     болтовня, а повод не гадать, куда он делся посреди разговора. */
  function whereLine(name, w, sid) {
    var t = w === 'table' ? name + ' сел за стол.'
      : w === 'bots' ? name + ' сел играть с ботами.'
        : name + ' вернулся в комнату.';
    line('sys', t);
    toAll({ t: 'sys', text: t });
    if (sid !== H.me.id && w === 'table') snd('table');
  }

  /* Сколько людей где. Ровно то, что Ник просил показывать: сколько в
     комнате, сколько за сетевым столом, сколько играет с ботами. */
  function counts() {
    var c = { all: 0, room: 0, table: 0, bots: 0 };
    for (var i = 0; i < H.members.length; i++) {
      var w = H.members[i].where || 'room';
      c.all++;
      c[w === 'table' ? 'table' : (w === 'bots' ? 'bots' : 'room')]++;
    }
    return c;
  }

  /* ---------- гость ---------- */

  function onHostMsg(m) {
    if (!m || !m.t) return;
    if (m.t === 'you') { H.me.id = m.id; return; }
    if (m.t === 'list') {
      H.members = m.members || [];
      noteMembers();
      if (m.hostName && m.hostName !== H.hostName) {
        var first = !H.hostName;
        H.hostName = m.hostName;
        if (!first) line('sys', 'Теперь главный в комнате — ' + m.hostName + '.');
      }
      fire(); return;
    }
    if (m.t === 'msg') {
      if (m.sid !== H.me.id) snd('msg');
      return line('msg', m.text, m.from);
    }
    if (m.t === 'sys') return line('sys', m.text);
    if (m.t === 'table') {
      if (m.sid !== H.me.id) snd('table');
      return line('table', m.from + ' создал стол' + (m.N ? ' на ' + m.N : ''), m.from, m.code, m.N);
    }
  }

  /* ---------- что делает игрок ---------- */

  function say(text) {
    text = String(text || '').trim().slice(0, 200);
    if (!text || !H.ready) return;
    if (H.host) broadcastMsg(H.me.name, text, H.me.id);
    else Net.send(H.hostConn, { t: 'msg', text: text });
  }

  // объявить, что я поднял стол (или закрыл его)
  /* `go` — за столом уже играют. Объявление стола этим и живёт дальше:
     пока стол в лобби, в комнату зовут; как партия началась — зовут
     зря, таких гость всё равно разворачивает (см. p7_net, `hello`), и
     кнопка «Подключиться» только обманывает. Строку в разговор пишем
     ТОЛЬКО когда стол новый: обновление пометки — не новость. */
  function table(code, N, go) {
    if (!H.ready) return;
    var was = H.me.table && H.me.table.code;
    H.me.table = code ? { code: code, N: N, go: !!go } : null;
    if (H.host) {
      var m = H.members.filter(function (x) { return x.id === 'host'; })[0];
      if (m) m.table = H.me.table;
      if (code && code !== was) tableLine(H.me.name, code, N, H.me.id);
      else if (!code && was) line('sys', 'Вы закрыли стол.');
      pushList();
    } else Net.send(H.hostConn, { t: 'table', code: code || null, N: N || 0, go: !!go });
  }

  /* ---------- где человек сейчас ----------

     Ник: «можешь показывать тех, кто онлайн, но условно в игре? В сетевой
     или просто с ботами?»

     Раньше на этом месте стоял выход из комнаты: сел играть — и тебя в
     ней больше нет. Поэтому комната всегда показывала «Люди 1», даже
     когда за тремя столами шла игра: все играющие из неё вычёркивались.

     Так сделано в «Колдовстве», и оттуда же взята цена: связь с комнатой
     во время партии НЕ рвём, только меняем отметку. Это второе
     соединение рядом с игровым — лёгкое (раз в двадцать секунд), но
     помнить о нём надо, и звуки комнаты за столом обязаны молчать. */
  function where(w) {
    w = (w === 'table' || w === 'bots') ? w : 'room';
    if (H.me.where === w) return;
    H.me.where = w;
    if (!H.on || !H.ready) return;
    if (H.host) {
      var m = null, i;
      for (i = 0; i < H.members.length; i++) if (H.members[i].id === 'host') m = H.members[i];
      if (m) m.where = w;
      whereLine(H.me.name, w, H.me.id);
      pushList();
    } else Net.send(H.hostConn, { t: 'where', w: w });
  }

  // сменил имя или портрет — заново представиться
  function updateMe(name, face, card) {
    if (name) H.me.name = String(name).slice(0, 14);
    if (typeof face === 'number' && face >= 0) H.me.face = face;
    if (card) H.me.card = card;
    if (!H.ready) return;
    if (H.host) {
      H.hostName = H.me.name;
      var m = H.members.filter(function (x) { return x.id === 'host'; })[0];
      if (m) { m.name = H.me.name; m.face = H.me.face; m.card = H.me.card; }
      pushList();
    } else Net.send(H.hostConn, { t: 'hi', name: H.me.name, face: H.me.face, card: H.me.card });
  }

  /* Объявить на всю комнату, что стол сел играть. Говорит хозяин стола
     перед тем, как выйти: иначе комната видит только «такой-то вышел»
     и не понимает, партия началась или человек закрыл вкладку. */
  function announce(text) {
    text = String(text || '').trim().slice(0, 120);
    if (!text || !H.ready) return;
    if (H.host) { line('sys', text); toAll({ t: 'sys', text: text }); }
    else Net.send(H.hostConn, { t: 'note', text: text });
  }

  /* ---------- пульс комнаты ----------

     Пока играющие вычёркивались, список жил сам собой: вышел — убрали.
     Теперь люди остаются в нём часами, и молчаливый обрыв (а он молчит
     всегда — см. платформа/01-СЕТЬ-СТОЛА) оставил бы в комнате призраков:
     «5 в сети», а их двое. Поэтому главный считает, когда в последний раз
     слышал каждого, а гость — когда в последний раз слышал главного. */
  var DEAD = 70000;          // три пропущенных круга — значит человека нет

  setInterval(function () {
    if (!H.on || !H.ready) return;
    if (H.host) {
      var t = now(), i, c;
      for (i = H.conns.length - 1; i >= 0; i--) {
        c = H.conns[i];
        if (c && t - (c._seen || t) > DEAD) { try { c.close(); } catch (e) { } dropGuest(c); }
      }
      pushList();
      return;
    }
    Net.send(H.hostConn, { t: 'ping' });
    if (H.lastHost && now() - H.lastHost > DEAD) lostHost();
  }, PING);

  return {
    S: H, enter: enter, leave: leave, say: say, table: table,
    sound: function (f) { H.onSound = f; },
    where: where, counts: counts, updateMe: updateMe, announce: announce,
    list: function () { return H.members.slice(); },
    log: function () { return H.msgs.slice(); }
  };
})();

/* ============================================================
   ДУРАК — стол, анимация, ввод
   Каркас взят из клабора как есть: места, пузыри реплик, очередь
   событий с двумя паузами, страж стола, плашка ожидания вылетевшего,
   возврат за стол, чат. Своё — только стол дурака: пары «заход/отбой»
   в центре, колода с козырем, бито и кнопки «Беру / Бито / Перевести».

   Стол рисуется НЕ из состояния движка, а из своей копии (vt, vcount,
   vhand…), которую двигают события. Состояние приходит раньше, чем
   доиграна анимация: по сети гость получает уже «бито», пока у него на
   экране только летит первая карта захода. Когда очередь доиграна,
   копия сверяется с движком (resync) — расхождений не накапливается.
   ============================================================ */
var UI = (function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var g = null, brains = [], ME = 0, evIdx = 0, busy = false, gen = 0;
  var SEATIDS = ['seatL', 'seatT', 'seatR'];
  var speed = 1;
  var MARK = 1300;          // короткая отметка хода над местом: «Беру», «Бито», «Пас»

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function wait(ms, cb) { var my = gen; setTimeout(function () { if (my === gen) cb(); }, ms / speed); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function plural(n, a, b, c) { return Engine.plural(n, a, b, c); }

  /* ---------- копия стола для показа ---------- */
  var vt = [], vcount = [], vtalon = 0, vbito = 0, vhand = [], vout = [];
  function resync() {
    if (!g) return;
    vt = (g.table || []).map(function (pr) { return { a: pr.a, d: pr.d, by: pr.by }; });
    vcount = (g.hands || []).map(function (h) { return h.length; });
    vtalon = (g.talon || []).length;
    vbito = (g.bito || []).length;
    vhand = ((g.hands && g.hands[ME]) || []).slice();
    vout = (g.out || []).slice();
  }

  /* ---------- места ---------- */
  function seatEl(p) {
    if (p === ME) return null;
    var off = (p - ME + g.N) % g.N;               // 1,2,3 по часовой
    var idx = (g.N === 2) ? 1 : ((g.N === 3) ? (off === 1 ? 0 : 2) : (off - 1));
    return document.getElementById(SEATIDS[idx]);
  }
  function faceOf(p) { return (g.faces && g.faces[p] != null) ? g.faces[p] : -1; }
  function letterOf(p) { return (g.names[p] || '?').charAt(0).toUpperCase(); }
  var bubbles = {}, bubSeq = {};
  function badge(full, short, cls) {
    return '<span class="badge' + (cls ? ' ' + cls : '') + '" data-s="' + short + '">' + full + '</span>';
  }
  function scoreOf(p) { return g.score ? g.score[p] : 0; }
  function scoreChip(p) {
    if (g.o.pairs) return '';
    return '<span class="sc" title="' + (g.o.tour ? 'штрафные очки' : 'сколько раз был дураком') + '">' +
      (g.o.tour ? scoreOf(p) : (g.fools ? g.fools[p] : 0)) + '</span>';
  }
  function roleBadges(p, mine) {
    var b = '', bt = g.bout;
    if (vout[p]) b += badge(mine ? 'вы вышли' : 'вышел' + (g.sex && g.sex[p] === 'f' ? 'а' : ''), 'вых.', 'out');
    else if (bt && !dealing) {
      if (p === bt.att) b += badge(mine ? 'ходите' : 'ходит', 'ход');
      if (p === bt.def) b += badge(mine ? 'отбиваетесь' : 'отбивается', 'отб.', 'def');
    }
    if (g.rank && g.rank[p] > 0) b += badge(K.titleOf(g.rank[p]), K.titleOf(g.rank[p]).slice(0, 4) + '.', 'rank');
    if (g.isBot && g.isBot[p] && window.Net && Net.S && Net.S.on) b += badge('бот', 'бот', 'bot');
    return b;
  }

  function drawSeats() {
    SEATIDS.forEach(function (id) {
      var e = document.getElementById(id); e.style.display = 'none'; e.innerHTML = '';
    });
    for (var p = 0; p < g.N; p++) {
      if (p === ME) continue;
      var s = seatEl(p); if (!s) continue;
      s.style.display = '';
      var b = roleBadges(p, false);
      if (g.o.pairs && p === (ME + 2) % 4) b += badge('ваш партнёр', 'пара');
      var fan = '', n = dealing ? Math.min(vcount[p] || 0, dealt[p] || 0) : (vcount[p] || 0);
      var shown = Math.min(n, 12);
      for (var i = 0; i < shown; i++) fan += '<i></i>';
      if (n > shown) fan += '<span class="more">+' + (n - shown) + '</span>';
      var bub = bubbles[p];
      s.innerHTML = '<div class="pl" data-prof="' + p + '">' + ART.ava(faceOf(p), letterOf(p), 'sm') +
        '<span class="nm">' + esc(g.names[p]) + '</span>' + b + scoreChip(p) +
        '</div><div class="fan' + (vout[p] ? ' gone' : '') + '">' + fan +
        (n ? '<span class="cnt">' + n + '</span>' : '') + '</div>' +
        '<div class="bubble ' + (bub ? bub.c + ' on' : '') + '" id="bub' + p + '">' +
        (bub ? esc(bub.t) : '') + '</div>';
      s.classList.toggle('act', !!(g.pending && g.pending.p === p));
      s.classList.toggle('isdef', !!(g.bout && g.bout.def === p && !vout[p]));
    }
    var me = $('#seatMe');
    if (me) {
      var mb = roleBadges(ME, true);
      if (g.o.pairs) mb += badge('с ' + esc(g.names[(ME + 2) % 4]), 'с ' + esc(g.names[(ME + 2) % 4]));
      me.innerHTML = '<span data-prof="' + ME + '">' + ART.ava(faceOf(ME), letterOf(ME), 'sm') + '</span>' +
        '<span class="nm">' + esc(g.names[ME]) + '</span>' + mb + scoreChip(ME);
      me.classList.toggle('act', !!(g.pending && g.pending.p === ME));
    }
  }

  function bubble(p, txt, cls, ms, realTime) {
    var now = Date.now(), cur = bubbles[p];
    if (cur && cur.c === 'talk' && cls !== 'talk' && now < (cur.until || 0) - 300) return;
    bubbles[p] = { t: txt, c: cls || '', until: now + (ms || 1500) };
    if (p === ME) drawMyBubble(); else drawSeats();
    var my = ++bubSeq[p] || (bubSeq[p] = 1), myGen = gen;
    function off() {
      if (bubSeq[p] !== my || myGen !== gen) return;
      delete bubbles[p];
      if (p === ME) drawMyBubble(); else drawSeats();
    }
    if (realTime) setTimeout(off, ms || 1500);
    else wait(ms || 1500, off);
  }
  function drawMyBubble() {
    var e = $('#bubMe'); if (!e) return;
    var b = bubbles[ME];
    e.textContent = b ? b.t : '';
    e.className = 'bubble ' + (b && b.c ? b.c : '') + (b ? ' on' : '');
  }

  /* ---------- одесский базар ---------- */
  function charOfSeat(p) {
    if (g.chars && g.chars[p]) return g.chars[p];
    if (p === ME && window.Boot) {
      var c = Boot.CFG.myChar || 'auto';
      if (c === 'off') return null;
      if (c !== 'auto') return c;
    }
    var f = faceOf(p);
    return (f >= 0 && ART.FACE_CH) ? ART.FACE_CH[f % ART.FACE_CH.length] : 'b';
  }
  function sexOfSeat(p) {
    var f = faceOf(p);
    if (f < 0 && p === ME && window.Boot) f = Boot.CFG.face;
    return (f >= 0 && ART.FACE_SEX) ? ART.FACE_SEX[f % ART.FACE_SEX.length] : '';
  }
  function talk(p, key, ctx, force) {
    if (!window.Boot || !Boot.CFG.talk) return;
    if (p < 0 || p >= g.N) return;
    var ch = charOfSeat(p);
    if (!ch) return;
    var t = Talk.say(ch, key, {
      seat: p, suit: ctx && ctx.suit, lvl: g.lvl || 2, mine: (p === ME),
      joke: !!(ctx && ctx.joke), tags: ctx && ctx.tags,
      sex: sexOfSeat(p), tsex: (ctx && ctx.to != null) ? sexOfSeat(ctx.to) : ''
    }, force);
    if (!t) return;
    bubble(p, t, 'talk', Math.min(17000, 4200 + t.length * 95), true);
  }
  function anyBot(except) {
    var l = [];
    for (var p = 0; p < g.N; p++)
      if (p !== ME && p !== except && charOfSeat(p) && !vout[p]) l.push(p);
    if (!l.length) for (p = 0; p < g.N; p++) if (p !== ME && p !== except && charOfSeat(p)) l.push(p);
    return l.length ? l[Math.floor(Math.random() * l.length)] : -1;
  }

  function chat(e) {
    if (!window.Boot || !Boot.CFG.talk) return;
    var p;
    switch (e.e) {
      case 'deal':
        if (g.handNo === 1) for (p = 0; p < g.N; p++) talk(p, 'greet');
        else talk(e.dealer, 'dealing');
        if (e.low) wait(900, function () { talk(e.att, 'lowTrump', { tags: Talk.cardTags(e.low, g.trump) }); });
        else if (Math.random() < 0.5) talk(anyBot(), 'trumpSay', { suit: e.trump.s });
        break;
      case 'attack':
        if (e.cards.length >= 2) talk(e.p, 'attackPair');
        else if (e.cards[0].s === g.trump) talk(e.p, 'attackTrump');
        else if (Math.random() < 0.45) talk(e.p, 'attack');
        break;
      case 'beat':
        if (e.c.s === g.trump && K.SEQ[e.c.r] >= 4) talk(e.p, 'beatTrump');
        else if (Math.random() < 0.3) talk(e.p, 'beat');
        break;
      case 'transfer':
        talk(e.p, 'transfer');
        wait(900, function () { talk(e.to, 'transferOpp', { to: e.p }); });
        break;
      case 'take': talk(e.p, e.n >= 4 ? 'takeBig' : 'take'); break;
      case 'takeAll':
        if (e.cards.length >= 3 && Math.random() < 0.6) talk(anyBot(e.p), 'takeOpp', { to: e.p });
        break;
      case 'throw': talk(e.p, e.chase ? 'chase' : 'throwIn'); break;
      case 'bito':
        if (Math.random() < 0.55) talk(e.def, 'bitoSelf');
        else talk(anyBot(e.def), 'bitoOpp', { to: e.def });
        if (Math.random() < 0.12) wait(1600, function () {
          talk(anyBot(), Math.random() < 0.55 ? 'anekdot' : 'idle', { joke: true });
        });
        break;
      case 'out': talk(e.p, 'out', null, true); break;
      case 'hand-end':
        var r = e.res;
        if (r.draw) { talk(anyBot(), 'draw', null, true); break; }
        if (r.pog) {
          talk(r.pog.by, 'pogonyGive', { to: r.pog.to }, true);
          wait(1300, function () { talk(r.pog.to, 'pogonyGot', null, true); });
          wait(2600, function () { talk(anyBot(r.pog.by), 'pogonyOpp', { to: r.pog.to }); });
        } else {
          talk(r.fool, 'foolSelf', null, true);
          wait(1200, function () { talk(anyBot(r.fool), 'foolOpp', { to: r.fool }, true); });
        }
        if (Math.random() < 0.45) wait(3200, function () { talk(anyBot(), 'anekdot', null, true); });
        break;
    }
  }

  /* ---------- центр: пары «заход / отбой» ---------- */
  function cardW() {
    var n = Math.max(1, vhand.length || 6);
    var t = $('#table'), w = t.clientWidth, h = t.clientHeight;
    var narrow = w < 620;
    // много карт в руке — сильнее нахлёст, но не мельче, чем можно разглядеть
    var over = narrow ? (n > 10 ? 0.34 : 0.46) : (n > 12 ? 0.5 : 0.66);
    var byW = (w - 16) / (1 + over * (n - 1));
    var byH = (h * (h < 460 ? 0.24 : narrow ? 0.28 : 0.32)) / 1.49;
    var v = Math.round(Math.min(byW, byH, narrow ? 92 : 116));
    v = Math.max(40, v);
    document.documentElement.style.setProperty('--ov', -(1 - over).toFixed(2));
    return v;
  }
  /* Свободная полоса стола: от нижнего края табло и мест соперников до
     строки над своей рукой. Центр ставится в неё, а не в проценты высоты —
     иначе на телефоне боком пары уезжали под руку. */
  function freeBox() {
    var tb = $('#table').getBoundingClientRect(), top = 0;
    ['#info', '#seatL', '#seatT', '#seatR'].forEach(function (sel2) {
      var e = $(sel2);
      if (!e || e.style.display === 'none' || !e.offsetWidth) return;
      top = Math.max(top, e.getBoundingClientRect().bottom - tb.top);
    });
    var ml = $('#meline').getBoundingClientRect();
    var bottom = (ml.height ? ml.top : tb.bottom - 160) - tb.top;
    if (bottom - top < 90) { top = Math.max(0, bottom - 90); }
    return { top: top + 6, bottom: bottom - 6, w: tb.width, h: tb.height };
  }
  // размер карты на столе: шесть пар обязаны влезть и по ширине, и по свободной высоте
  function tableCW() {
    var fb = freeBox(), w = fb.w;
    var narrow = w < 620;
    var cols = narrow ? 3 : 6, rows = narrow ? 2 : 1;
    var byW = (w * (narrow ? 0.96 : 0.78)) / (cols * 1.42);
    var byH = (fb.bottom - fb.top) / (rows * 1.49 * 1.22 + 0.1);
    return Math.max(30, Math.round(Math.min(byW, byH, 104)));
  }
  function layout(n) {
    var t = $('#table'), narrow = t.clientWidth < 620;
    var cw = tableCW(), chh = cw * 512 / 344;
    var cols = Math.max(1, Math.min(n, narrow ? 3 : 6));
    var rows = Math.max(1, Math.ceil(n / cols));
    var sw = cw * 1.42, sh = chh * 1.22;
    var W = cols * sw, H = rows * sh;
    var pos = [];
    for (var i = 0; i < n; i++) {
      var r = Math.floor(i / cols), c = i % cols;
      var inRow = Math.min(cols, n - r * cols);
      var x0 = (W - inRow * sw) / 2;
      pos.push([x0 + c * sw + (sw - cw * 1.3) / 2, r * sh]);
    }
    return { cw: cw, W: W, H: H, pos: pos };
  }
  function sizeTrick(n) {
    var L = layout(Math.max(n, 1));
    var tr = $('#trick'), fb = freeBox();
    var mid = Math.round((fb.top + fb.bottom) / 2);
    tr.style.width = Math.round(Math.max(L.W, L.cw * 1.5)) + 'px';
    tr.style.height = Math.round(L.H) + 'px';
    tr.style.top = mid + 'px';
    var d = $('#drop'), tb = $('#table');
    d.style.width = Math.round(Math.min(tb.clientWidth * 0.96, Math.max(L.W, L.cw * 4) + 40)) + 'px';
    d.style.height = Math.round(Math.min(L.H + 30, fb.bottom - fb.top + 10)) + 'px';
    d.style.top = mid + 'px';
    return L;
  }
  function slotRect(i, n, def) {
    var L = layout(Math.max(n, i + 1)), tr = $('#trick').getBoundingClientRect();
    var p = L.pos[i] || [0, 0];
    // размер контейнера мог быть меньше нового: считаем от его центра
    var ox = tr.left + tr.width / 2 - L.W / 2, oy = tr.top + tr.height / 2 - L.H / 2;
    var x = ox + p[0] + (def ? L.cw * 0.3 : 0), y = oy + p[1] + (def ? L.cw * 0.2 : 0);
    return { x: x, y: y, w: L.cw, h: L.cw * 512 / 344 };
  }

  function drawTable() {
    var tr = $('#trick'); tr.innerHTML = '';
    var L = sizeTrick(vt.length);
    var tg = targets();
    vt.forEach(function (pr, i) {
      var p = L.pos[i];
      var box = el('div', 'pair');
      box.style.cssText = 'left:' + p[0] + 'px;top:' + p[1] + 'px;width:' + (L.cw * 1.3) + 'px';
      var a = el('div', 'card att' + (tg.indexOf(i) >= 0 ? ' tgt' : ''));
      a.innerHTML = ART.faceHTML(pr.a);
      a.dataset.i = i;
      a.style.width = L.cw + 'px';
      box.appendChild(a);
      if (pr.d) {
        var d = el('div', 'card def');
        d.innerHTML = ART.faceHTML(pr.d);
        d.style.cssText = 'width:' + L.cw + 'px;left:' + (L.cw * 0.3) + 'px;top:' + (L.cw * 0.2) + 'px';
        box.appendChild(d);
      }
      tr.appendChild(box);
    });
    tr.classList.toggle('pick', tg.length > 0);
  }

  function drawDeck() {
    var d = $('#deckzone'); d.innerHTML = '';
    if (dealing) {
      var st = el('div', 'stock');
      st.innerHTML = '<div class="card cd"></div><div class="card cu back"></div>';
      d.appendChild(st);
      return;
    }
    if (vtalon > 0 && g.trumpCard) {
      var m = el('div', 'stock');
      m.innerHTML = '<div class="card cd face">' + ART.faceHTML(g.trumpCard) + '</div>' +
        (vtalon > 1 ? '<div class="card cu back"></div>' : '') +
        '<span class="lb">' + vtalon + '</span>';
      d.appendChild(m);
    } else if (g.trump) {
      var t = el('div', 'mini trumponly');
      t.innerHTML = '<span class="pip">' + ART.pipSVG(g.trump, 34) + '</span><span class="lb">козырь</span>';
      d.appendChild(t);
    }
    var b = el('div', 'bitozone');
    b.id = 'bitoPile';
    b.innerHTML = vbito ? '<div class="deckpile b1"></div><div class="deckpile b2"></div><span class="lb">бито ' + vbito + '</span>'
      : '<span class="lb dim">бито</span>';
    d.appendChild(b);
  }

  /* ---------- табло ---------- */
  function drawInfo() {
    var b = $('#info'); if (!b) return;
    var t = g.trump, i;
    var suit = t ? '<span class="suit">' + ART.pipSVG(t, 26) + '</span>' : '<span class="suit none">?</span>';
    var mode = (g.o.perevod ? 'переводной' : 'подкидной') + (g.o.pairs ? ', напару' : '');
    var h = '<div class="tr">' + suit + '<span><b>' + (t ? 'козыри — ' + K.SUIT_NAME[t] : 'сдают') + '</b><span>' +
      mode + '</span></span></div>';
    var narrow = matchMedia('(max-width:900px)').matches;
    h += '<div class="grp"><span>колода</span><b>' + (vtalon ? vtalon + ' ' + plural(vtalon, 'карта', 'карты', 'карт') : 'пуста') + '</b></div>';
    if (!narrow) h += '<div class="grp"><span>бито</span><b>' + vbito + '</b></div>';
    if (g.bout && !narrow) h += '<div class="grp"><span>заход</span><b>' + esc(shortName(g.names[g.bout.att])) +
      ' → ' + esc(shortName(g.names[g.bout.def])) + (g.bout.taking ? ' · берёт' : '') + '</b></div>';
    if (g.o.tour) h += '<div class="grp"><span>турнир</span><b>до ' + g.o.tour + '</b></div>';
    h += '<div class="pts">';
    var sd = g.sideList();
    for (i = 0; i < sd.length; i++) {
      var mine = sd[i].indexOf(ME) >= 0;
      var nm = g.o.pairs ? sd[i].map(function (p) { return shortName(g.names[p]); }).join('+') : shortName(g.names[sd[i][0]]);
      var v = g.o.tour ? g.sideScore(i) : g.fools[sd[i][0]];
      h += '<i class="' + (mine ? 'me' : '') + '" title="' + (g.o.tour ? 'штрафные' : 'сколько раз дурак') + '">' +
        esc(nm) + ' ' + v + '</i>';
    }
    h += '</div>';
    b.innerHTML = h;
    document.documentElement.style.setProperty('--infoh', (b.offsetHeight || 46) + 'px');
  }

  /* ---------- рука и выбор ----------
     Выбор как в клаборе: первый тап поднимает карту, второй тап по
     поднятой — ходить. Перетащить на стол — тоже ходить. В заходе
     поднимаются карты одного достоинства, в подкидывании — любые
     подходящие, в отбое — одна карта, и на столе загораются те, что
     она бьёт: тап по такой — побить именно её. */
  var sel = [];
  function myTurn() { return !!(g && g.pending && g.pending.p === ME && !dealing && !pumping); }
  function pend() { return g.pending; }
  function selCards() { return sel.map(K.parse); }
  function isSel(c) { return sel.indexOf(K.id(c)) >= 0; }
  function trCan(c) {
    var p = pend();
    return !!(p && p.type === 'defend' && p.transfer &&
      p.transfer.cards.some(function (x) { return K.same(x, c); }));
  }
  function beatTargets(c) {
    var p = pend(), l = [];
    if (!p || p.type !== 'defend') return l;
    p.open.forEach(function (i) { if ((p.beat[i] || []).some(function (x) { return K.same(x, c); })) l.push(i); });
    return l;
  }
  function canPick(c) {
    var p = pend();
    if (!p || p.p !== ME) return false;
    if (p.type === 'attack') return true;
    if (p.type === 'throw') return p.legal.some(function (x) { return K.same(x, c); });
    if (p.type === 'defend') return beatTargets(c).length > 0 || trCan(c);
    return false;
  }
  function targets() {
    if (!myTurn() || pend().type !== 'defend' || sel.length !== 1) return [];
    return beatTargets(K.parse(sel[0]));
  }

  function drawHand() {
    var h = $('#hand'); h.innerHTML = '';
    document.documentElement.style.setProperty('--cw', cardW() + 'px');
    if (dealing) { drawActs(); return; }
    var mine = myTurn();
    vhand.forEach(function (c) {
      var d = el('div', 'card');
      d.innerHTML = ART.faceHTML(c);
      d.dataset.id = K.id(c);
      if (mine) d.classList.add(canPick(c) ? 'playable' : 'dead');
      if (isSel(c)) d.classList.add('sel');
      h.appendChild(d);
    });
    drawActs();
  }

  function actBtn(k, t, dis, pri) {
    return '<button class="btn act' + (pri ? ' pri' : '') + '" data-act="' + k + '"' + (dis ? ' disabled' : '') + '>' + t + '</button>';
  }
  function drawActs() {
    var box = $('#acts'); if (!box) return;
    if (!g || !myTurn()) { box.innerHTML = ''; return; }
    var p = pend(), h = '';
    if (p.type === 'attack') h = actBtn('go', sel.length ? 'Ходить' + (sel.length > 1 ? ' (' + sel.length + ')' : '') : 'Выберите карту', !sel.length, true);
    else if (p.type === 'throw') {
      if (sel.length) h += actBtn('go', 'Подкинуть' + (sel.length > 1 ? ' (' + sel.length + ')' : ''), false, true);
      h += actBtn('pass', p.chase ? 'Пусть забирает' : (p.main ? 'Бито' : 'Пас'), false, !sel.length);
    } else if (p.type === 'defend') {
      var trs = sel.length && sel.every(function (id) { return trCan(K.parse(id)); });
      if (p.transfer && trs) h += actBtn('tr', 'Перевести' + (sel.length > 1 ? ' (' + sel.length + ')' : ''), false, true);
      h += actBtn('take', 'Беру', false, false);
    }
    box.innerHTML = h;
  }

  function hint(t) { $('#hint').textContent = t || ''; }

  function tapCard(id) {
    if (!myTurn()) return;
    var p = pend(), c = K.parse(id);
    if (!canPick(c)) { toast(p.type === 'defend' ? 'Этой картой не побить' : 'Эту карту сейчас не положить'); return; }
    if (isSel(c)) return commit(c);                      // второй тап по поднятой — ходить
    if (p.type === 'attack') {
      var cs = selCards();
      if (!cs.length || cs[0].r !== c.r || cs.length >= p.limit) sel = [id];
      else sel.push(id);
    } else if (p.type === 'throw') {
      if (sel.length >= p.room) sel = [id]; else sel.push(id);
    } else if (p.type === 'defend') {
      var cs2 = selCards();
      // для перевода можно поднять несколько карт того же достоинства
      if (trCan(c) && cs2.length && cs2.every(trCan) && cs2.length < p.transfer.most) sel.push(id);
      else sel = [id];
    }
    redrawTurn();
  }
  function redrawTurn() { drawHand(); drawTable(); defHint(); }
  function defHint() {
    if (!myTurn()) return;
    var p = pend();
    if (p.type === 'defend' && sel.length === 1) {
      var t = beatTargets(K.parse(sel[0]));
      hint(t.length > 1 ? 'Тапните по карте на столе, которую бьёте' : (t.length ? 'Ещё раз — побить' : 'Этой картой можно только перевести'));
    }
  }

  // ходим тем, что поднято (и картой, по которой тапнули)
  function commit(c) {
    var p = pend(); if (!p || p.p !== ME) return;
    var cs = selCards();
    if (c && !cs.some(function (x) { return K.same(x, c); })) cs.push(c);
    if (p.type === 'attack') {
      if (!cs.length) return;
      cs = cs.filter(function (x) { return x.r === cs[0].r; }).slice(0, p.limit);
      return doAct({ cards: cs });
    }
    if (p.type === 'throw') {
      if (!cs.length) return;
      return doAct({ t: 'throw', cards: cs.slice(0, p.room) });
    }
    if (p.type === 'defend') {
      var one = c || cs[0];
      var tg = beatTargets(one);
      if (tg.length) {
        // бьём самую старшую из тех, что эта карта может побить: младшие ещё пригодятся другим
        tg.sort(function (i, j) { return K.power(vt[j].a, g.trump) - K.power(vt[i].a, g.trump); });
        return doAct({ t: 'beat', i: tg[0], c: one });
      }
      if (trCan(one)) return doAct({ t: 'transfer', cards: cs.filter(trCan) });
    }
  }
  function beatOn(i, c) {
    var p = pend(); if (!p || p.type !== 'defend' || p.p !== ME) return false;
    if (beatTargets(c).indexOf(i) < 0) return false;
    doAct({ t: 'beat', i: i, c: c });
    return true;
  }
  function doAct(a) {
    sel = []; hint('');
    act(a);
  }
  function onActClick(ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var p = pend(); if (!myTurn()) return;
    var k = b.dataset.act;
    if (k === 'go') return commit(null);
    if (k === 'pass') return doAct({ t: 'pass' });
    if (k === 'take') return doAct({ t: 'take' });
    if (k === 'tr') return doAct({ t: 'transfer', cards: selCards().filter(trCan).slice(0, p.transfer.most) });
  }

  /* ---------- сдача и полёты ---------- */
  var dealing = false, dealt = [];
  function deckPoint() {
    var dz = $('#deckzone .stock') || $('#deckzone');
    var r = dz ? dz.getBoundingClientRect() : null;
    if (r && r.width > 4) return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    var t = $('#table').getBoundingClientRect();
    return { x: t.left + t.width / 2, y: t.top + t.height * 0.42 };
  }
  function bitoPoint() {
    var b = $('#bitoPile');
    if (b) { var r = b.getBoundingClientRect(); if (r.width > 2) return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
    var t = $('#table').getBoundingClientRect();
    return { x: t.right - 40, y: t.top + t.height * 0.5 };
  }
  function seatPoint(p) {
    if (p === ME) {
      var h = $('#handwrap').getBoundingClientRect();
      return { x: h.left + h.width / 2, y: h.bottom - 60 };
    }
    var s = seatEl(p);
    if (!s) return deckPoint();
    var r = s.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.75 };
  }
  function flyBack(from, to, w) {
    var h = w * 512 / 344;
    var f = el('div', 'card back');
    f.style.cssText = 'left:' + (from.x - w / 2) + 'px;top:' + (from.y - h / 2) + 'px;' +
      'width:' + w + 'px;height:' + h + 'px;transform:none';
    $('#fly').appendChild(f);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + (to.x - from.x) + 'px,' + (to.y - from.y) + 'px)' +
          ' rotate(' + (Math.random() * 24 - 12) + 'deg)';
      });
    });
    wait(360, function () { f.remove(); });
  }
  // сдаём по одной по кругу, начиная слева от сдающего
  function dealAnim(done) {
    var from = deckPoint(), w = Math.round(cardW() * 0.5);
    var step = 40, k = 0;
    dealt = [];
    for (var i = 0; i < g.N; i++) dealt.push(0);
    for (var r = 0; r < Engine.HAND; r++)
      for (i = 0; i < g.N; i++) {
        (function (pp, d) {
          wait(d, function () {
            flyBack(from, seatPoint(pp), w);
            dealt[pp]++;
            if (pp !== ME && seatEl(pp)) drawSeats();
          });
        })((g.dealer + 1 + i) % g.N, (k++) * step);
      }
    wait(k * step + 380, done);
  }
  function rectOf(e) { var r = e.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; }
  function flyFace(card, from, to, done) {
    var f = el('div', 'card');
    f.innerHTML = ART.faceHTML(card);
    f.style.cssText = 'left:' + from.x + 'px;top:' + from.y + 'px;width:' + from.w + 'px;height:' + from.h + 'px;transform:none';
    $('#fly').appendChild(f);
    var dx = to.x - from.x, dy = to.y - from.y, sc = to.w / from.w;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ') rotate(' + (Math.random() * 6 - 3) + 'deg)';
        f.style.transformOrigin = '0 0';
      });
    });
    wait(340, function () { f.remove(); if (done) done(); });
  }
  function fromOf(p, c) {
    if (p === ME) {
      var hc = $('#hand .card[data-id="' + K.id(c) + '"]');
      if (hc) { var r = rectOf(hc); hc.style.visibility = 'hidden'; return r; }
      return { x: innerWidth / 2, y: innerHeight - 120, w: cardW(), h: cardW() * 1.49 };
    }
    var s = seatEl(p), q = s ? s.getBoundingClientRect() : { left: innerWidth / 2, top: 40, width: 40, height: 40 };
    return { x: q.left + q.width / 2 - 18, y: q.top + 22, w: 36, h: 54 };
  }
  // карты кладутся на стол по одной, с маленьким разбегом
  function layCards(p, cards, done) {
    var n0 = vt.length, k = 0;
    // место в центре — под новое число пар
    cards.forEach(function () { vt.push(null); });
    sizeTrick(vt.length);
    vt.length = n0;
    (function one() {
      if (k >= cards.length) { drawTable(); return wait(160, done); }
      var c = cards[k], i = n0 + k;
      var from = fromOf(p, c), to = slotRect(i, n0 + cards.length, false);
      k++;
      flyFace(c, from, to, function () {
        vt.push({ a: c, d: null, by: p });
        drawTable();
        one();
      });
    })();
  }
  // стол уезжает: к взявшему или в бито
  function sweep(to, done) {
    var cards = $$('#trick .card');
    cards.forEach(function (c, i) {
      var r = c.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      c.style.zIndex = String(20 + i);
      c.style.transition = 'transform ' + SWEEP + 'ms cubic-bezier(.38,.02,.62,1) ' + (i * 30) + 'ms,' +
        'opacity ' + SWEEP + 'ms ease-in ' + (i * 30 + Math.round(SWEEP * 0.5)) + 'ms';
      c.style.transform = 'translate(' + (to.x - cx) + 'px,' + (to.y - cy) + 'px) rotate(' + ((i % 3 - 1) * 9) + 'deg) scale(.35)';
      c.style.opacity = '.15';
    });
    wait(SWEEP + cards.length * 30 + 40, function () {
      vt = []; $('#trick').innerHTML = ''; if (done) done();
    });
  }
  var SWEEP = 520, HOLD = 900;

  /* ---------- события движка ---------- */
  var hs = null;            // что случилось за партию — для достижений и статистики
  function hsReset() {
    hs = { takes: 0, maxTake: 0, transfers: 0, gotTransfer: false, trTransfer: false, trumpsPlayed: 0,
      bito6: false, bitos: 0, outN: -1, botSeen: false, pogSaved: false, tookAny: false, beat: 0 };
  }
  function handleEvent(e, next) {
    brains.forEach(function (b) { if (b) b.note(e); });
    try { chat(e); } catch (err) { }
    var i;
    switch (e.e) {
      case 'log':
        var lp = el('p', e.c, esc(e.t)); $('#logpane').appendChild(lp);
        $('#logpane').scrollTop = 1e6; return next();
      case 'deal':
        $('#logpane').appendChild(el('hr'));
        sel = []; hsReset();
        // заявка на партию: бросишь — засчитается поражением
        try { if (window.Boot && Boot.rtStart) Boot.rtStart(g); } catch (err) { }
        vt = []; vbito = 0; vout = []; vcount = [];
        for (i = 0; i < g.N; i++) { vout.push(false); vcount.push(Engine.HAND); }
        vtalon = 36 - Engine.HAND * g.N;
        vhand = ((g.hands && g.hands[ME]) || []).slice();
        // своя рука на момент сдачи: если мы уже походили — карты вернутся к сверке в ready
        dealing = true; drawAll();
        return wait(120, function () {
          dealAnim(function () {
            dealing = false; drawAll();
            toast('Козыри — ' + K.SUIT_NAME[e.trump.s] + ' ' + K.SUIT_CH[e.trump.s]);
            wait(e.low ? 900 : 500, next);
          });
        });
      case 'bout': drawSeats(); drawInfo(); return next();
      case 'attack':
      case 'throw':
      case 'transfer':
        if (e.p !== ME || e.e !== 'attack') {
          var mark = e.e === 'transfer' ? 'Перевожу!' : (e.e === 'throw' ? (e.chase ? 'Вдогонку' : 'Подкидываю') : '');
          if (mark) bubble(e.p, mark, '', MARK);
        }
        if (e.p === ME) {
          e.cards.forEach(function (c) { var j = K.indexOfCard(vhand, c); if (j >= 0) vhand.splice(j, 1); });
          if (e.e === 'transfer') { hs.transfers++; if (hs.gotTransfer) hs.trTransfer = true; }
          e.cards.forEach(function (c) { if (c.s === g.trump) hs.trumpsPlayed++; });
        }
        if (e.e === 'transfer' && e.to === ME) hs.gotTransfer = true;
        vcount[e.p] = Math.max(0, (vcount[e.p] || 0) - e.cards.length);
        // сорвать погоны: под нас последней парой нашего звания
        if (e.e === 'attack' && g.o.pogony && e.def === ME && e.cards.length === 2 && e.cards[0].r === e.cards[1].r &&
          !vtalon && vcount[e.p] === 0 && e.cards[0].r === K.pogonRank(g.rank[ME]) && liveCount() === 2) hs.pogWatch = true;
        drawSeats();
        return layCards(e.p, e.cards, function () { drawHandLater(); drawInfo(); next(); });
      case 'beat':
        if (e.p === ME) {
          var j2 = K.indexOfCard(vhand, e.c); if (j2 >= 0) vhand.splice(j2, 1);
          hs.beat++;
          if (e.c.s === g.trump) hs.trumpsPlayed++;
        }
        vcount[e.p] = Math.max(0, (vcount[e.p] || 0) - 1);
        var from = fromOf(e.p, e.c), to = slotRect(e.i, vt.length, true);
        drawSeats();
        return flyFace(e.c, from, to, function () {
          if (vt[e.i]) vt[e.i].d = e.c;
          drawTable(); drawHandLater(); wait(140, next);
        });
      case 'take':
        bubble(e.p, 'Беру', '', MARK + 400);
        drawSeats(); drawInfo();
        return wait(650, next);
      case 'pass':
        bubble(e.p, e.chase ? 'Всё' : (e.main ? 'Бито' : 'Пас'), '', MARK);
        return wait(420, next);
      case 'takeAll':
        if (e.p === ME) { hs.takes++; hs.tookAny = true; if (e.cards.length > hs.maxTake) hs.maxTake = e.cards.length; }
        return wait(HOLD, function () {
          sweep(seatPoint(e.p), function () {
            vcount[e.p] = (vcount[e.p] || 0) + e.cards.length;
            if (e.p === ME) vhand = g.hands[ME].slice();
            hs.pogWatch = false;
            drawAll(); wait(160, next);
          });
        });
      case 'bito':
        if (e.def === ME) {
          hs.bitos++;
