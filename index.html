<script>
/* ============================================================
   ДУРАК — ядро: колода, старшинство, кто чем бьётся
   Колода 36 карт, от шестёрки до туза. Старшинство одно на все
   масти: 6 7 8 9 10 В Д К Т. Козырь бьёт любую некозырную карту,
   козырь бьётся только старшим козырем.
   ============================================================ */
var K = (function () {
  'use strict';

  var SUITS = ['S', 'H', 'C', 'D'];
  var SUIT_NAME = { S: 'пики', H: 'черви', C: 'трефы', D: 'бубны' };
  var SUIT_ONE = { S: 'пика', H: 'черва', C: 'трефа', D: 'бубна' };
  var SUIT_CH = { S: '♠', H: '♥', C: '♣', D: '♦' };
  var RED = { H: 1, D: 1 };
  var RANKS = ['6', '7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
  var RANK_RU = { '6': '6', '7': '7', '8': '8', '9': '9', '10': '10', J: 'В', Q: 'Д', K: 'К', A: 'Т' };
  var RANK_WORD = { '6': 'шестёрка', '7': 'семёрка', '8': 'восьмёрка', '9': 'девятка', '10': 'десятка',
    J: 'валет', Q: 'дама', K: 'король', A: 'туз' };
  // «две шестёрки», «два валета» — для погон
  var RANK_TWO = { '6': 'две шестёрки', '7': 'две семёрки', '8': 'две восьмёрки', '9': 'две девятки',
    '10': 'две десятки', J: 'два валета', Q: 'две дамы', K: 'два короля', A: 'два туза' };
  // «шестёрок», «валетов» — для подписей
  var RANK_MANY = { '6': 'шестёрок', '7': 'семёрок', '8': 'восьмёрок', '9': 'девяток', '10': 'десяток',
    J: 'валетов', Q: 'дам', K: 'королей', A: 'тузов' };
  var SEQ = { '6': 0, '7': 1, '8': 2, '9': 3, '10': 4, J: 5, Q: 6, K: 7, A: 8 };

  /* ---------- лестница званий ----------
     Погоны вешаются по порядку: сначала шестёрки, потом семёрки и так
     до тузов. Звание не сгорает: кто дослужился до майора, тому в
     следующий раз будут вешать валетов. Источник — одесский регламент,
     который Ник прислал вместе с правилами (_источники). */
  var TITLES = [
    { r: '6', n: 'ефрейтор' }, { r: '7', n: 'сержант' }, { r: '8', n: 'лейтенант' },
    { r: '9', n: 'капитан' }, { r: '10', n: 'майор' }, { r: 'J', n: 'подполковник' },
    { r: 'Q', n: 'полковник' }, { r: 'K', n: 'генерал' }, { r: 'A', n: 'маршал' }
  ];
  // какой парой вешают погоны тому, у кого уже `rank` званий
  function pogonRank(rank) { return TITLES[Math.min(rank || 0, TITLES.length - 1)].r; }
  function titleOf(rank) { return rank > 0 ? TITLES[Math.min(rank, TITLES.length) - 1].n : ''; }

  function id(c) { return c.r + c.s; }
  function parse(s) { return { r: s.length === 3 ? '10' : s[0], s: s[s.length - 1] }; }
  function name(c) { return RANK_RU[c.r] + SUIT_CH[c.s]; }
  function isRed(c) { return !!RED[c.s]; }
  function same(a, b) { return !!a && !!b && a.r === b.r && a.s === b.s; }

  function deck() {
    var d = [];
    for (var i = 0; i < SUITS.length; i++)
      for (var j = 0; j < RANKS.length; j++) d.push({ r: RANKS[j], s: SUITS[i] });
    return d;
  }

  function shuffle(a, rnd) {
    rnd = rnd || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // бьёт ли карта d карту a при козыре trump
  function beats(a, d, trump) {
    if (!a || !d) return false;
    if (d.s === a.s) return SEQ[d.r] > SEQ[a.r];
    return d.s === trump && a.s !== trump;
  }

  // сила карты для сравнений и ботов: козыри старше всех простых
  function power(c, trump) { return SEQ[c.r] + (c.s === trump ? 9 : 0); }

  function sortHand(h, trump) {
    var so = ['S', 'H', 'C', 'D'];
    return h.sort(function (a, b) {
      var at = a.s === trump, bt = b.s === trump;
      if (at !== bt) return at ? 1 : -1;               // козыри справа
      if (a.s !== b.s) return so.indexOf(a.s) - so.indexOf(b.s);
      return SEQ[a.r] - SEQ[b.r];
    });
  }

  function indexOfCard(list, c) {
    for (var i = 0; i < list.length; i++) if (same(list[i], c)) return i;
    return -1;
  }

  /* ---------- где правила молчат ----------
     Разбор спорных мест: что сделано и откуда это взято. Показывается
     в правилах игры, чтобы через полгода было видно, почему так. */
  var TRAKT = [
    ['Кто ходит первым', 'В первой партии — у кого младший козырь (шестёрка, нет её — семёрка и так далее). ' +
      'Дальше ходят «под дурака»: сосед справа от прошлого дурака заходит на него. Ничья — снова младший козырь. ' +
      'Решение Ника, 29.10.2026.'],
    ['Подкидывание по очереди', 'Сначала подкидывает тот, кто заходил. Он сказал «пас» — право переходит по часовой ' +
      'стрелке, отбивающийся не подкидывает никогда. Кто подкинул — отбивающийся кроет, и очередь снова с заходившего.'],
    ['Предел подкидывания', 'Не больше шести карт за заход и не больше, чем было карт у отбивающегося, когда ' +
      'заход начался. «Пять в первый отбой» — вариант, включается в настройках.'],
    ['Вдогонку', 'Сказал «беру» — каждый по очереди может докинуть подходящие по достоинству карты до того же ' +
      'предела, и только потом отбивающийся забирает всё со стола.'],
    ['Перевод', 'В переводном дураке, пока ни одна карта не побита, можно положить карту того же достоинства — ' +
      'заход переходит к следующему игроку. У того должно хватить карт, чтобы отбиться от всех лежащих.'],
    ['Погоны', 'Колода кончилась, за столом двое, последний ход — ровно две карты одного достоинства, и ' +
      'отбивающийся их забирает: на плечи легли погоны. Достоинство — по званию того, кому вешают: шестёрки, ' +
      'потом семёрки и так до тузов. Звание не сгорает до конца матча.'],
    ['Турнир', 'Дураку — штрафное очко, в погонах тоже одно. Кто повесил погоны — списывает себе два, но не ниже ' +
      'нуля. Малый турнир до 10 штрафных, большой — до 20. Кто набрал — тот дурак турнира.'],
    ['Напару', 'Вчетвером 1-й и 3-й против 2-го и 4-го. Под напарника не ходят и ему не подкидывают. ' +
      'Вышли оба из пары — пара выиграла; дураки — пара, у которой остались карты.'],
    ['Ничья', 'Последние карты вышли у двоих разом — дурака нет, штрафов нет.']
  ];

  return {
    SUITS: SUITS, SUIT_NAME: SUIT_NAME, SUIT_ONE: SUIT_ONE, SUIT_CH: SUIT_CH, RANKS: RANKS,
    RANK_RU: RANK_RU, RANK_WORD: RANK_WORD, RANK_TWO: RANK_TWO, RANK_MANY: RANK_MANY, SEQ: SEQ,
    TITLES: TITLES, pogonRank: pogonRank, titleOf: titleOf,
    id: id, parse: parse, name: name, isRed: isRed, same: same, deck: deck, shuffle: shuffle,
    beats: beats, power: power, sortHand: sortHand, indexOfCard: indexOfCard, TRAKT: TRAKT
  };
})();
if (typeof module !== 'undefined') module.exports = K;

/* ============================================================================
 * Рейтинг Malefictum — общий модуль для карточных игр платформы
 * (клабор, преферанс, бридж, дурак и всё, что будет дальше).
 *
 * Внутри — Glicko-2 (рейтинг r, неуверенность rd, волатильность vol).
 * Снаружи — звёзды от 1 до 5 с шагом в половину.
 * Документация: платформа/09-РЕЙТИНГ.md. Тесты: платформа/rating/rating.test.js
 *
 * Модуль ничего не знает про конкретную игру, не трогает DOM (кроме
 * необязательного injectCSS) и не трогает хранилище — только чистые функции
 * над маленьким объектом состояния. Поэтому одинаково работает в браузере,
 * в node-тестах, у хозяина стола и у гостя.
 *
 * Версия модуля: 2 (31.10.2026). Номер версии лежит в каждом состоянии (поле v).
 *   v2: adopt принимает изменение (delta), если хозяин считал от устаревшего
 *       состояния; holdExpired — срок, сколько заявка может ждать возврата за стол.
 * ========================================================================== */
(function (root) {
  'use strict';

  var VERSION = 2;
  var SCALE = 173.7178;           // перевод шкалы Эло в шкалу Glicko-2 (400 / ln 10)
  var BASE = 1500;                // ноль шкалы Glicko-2 — не путать со стартом игрока

  /* ------------------------------------------------------------------------
   * Настройки по умолчанию. Каждая игра накладывает поверх свой пресет
   * (PRESETS ниже), а поверх пресета — свои замеры: Rating.config(id, {...}).
   * --------------------------------------------------------------------- */
  var DEFAULTS = {
    start: 1500,        // рейтинг нового игрока
    startRd: 350,       // неуверенность нового игрока
    startVol: 0.06,     // волатильность нового игрока
    tau: 0.5,           // как быстро может меняться волатильность (Glicko-2: 0.3–1.2)
    rdMin: 45,          // ниже неуверенность не опускается — иначе рейтинг «застывает»
    rdMax: 350,
    periodDays: 7,      // каждая неделя простоя добавляет неуверенности, как один период

    matchWeight: 1,     // вес одной партии (меньше 1 — для игр с большой удачей)
    multiWeight: 'sqrt',// как делить вес партии на троих-четверых между соперниками:
                        //   'sqrt' — 1/√(число соперников), 'even' — 1/n, 'full' — 1

    // Режим мест (rank): кто выше — тот выиграл у каждого ниже.
    winScore: 1,        // результат обычной победы в паре (1 — чистая, 0.85 — «победа, но не разгром»)
    crushScore: 1,      // результат разгрома (погоны в дураке и т. п.)

    // Режим счёта (score): победитель по итоговому счёту, с поправкой на разницу.
    scoreMargin: 0,     // разница счёта, которая считается разгромом; 0 — учитывать только знак
    scoreWinFloor: 0.75,// сколько даёт победа впритык (при scoreMargin > 0)

    // Дубль (сравнение с ботами на тех же картах).
    impScale: 6,        // сколько IMP за сдачу — «уверенно лучше бота» (результат ≈ 0.88)
    dealWeight: 0.15,   // вес одной сдачи
    dupRef: 3,          // с каким ботом сравниваем по умолчанию (уровень)

    // Боты — якоря шкалы. Их рейтинг не меняется. Ключ — уровень бота в игре.
    bots: { 1: 1350, 2: 1500, 3: 1650 },
    botRd: 40,

    // Звёзды.
    stars: null,        // пороги [2★, 3★, 4★, 5★]; null — взять из ботов: [1, 2, 3, 3+topGap]
    topGap: 120,        // 5★ — на столько выше сильнейшего бота
    calibrationGames: 12,
    confK: 1,           // осторожный рейтинг: rc = r − confK·max(0, rd − rdSettled)
    rdSettled: 70,      // неуверенность устоявшегося игрока (Glicko-2 при партии за партией
                        // держится около 60–70) — сверх неё и штрафуем осторожностью
    hysteresis: 45,     // звезду теряем, только опустившись ниже порога на столько
    caps: [[5, 100], [4.5, 60], [4, 30]], // [звёзды, минимум партий] — потолок по стажу
    expLevels: [10, 30, 100, 300, 1000],  // стаж: 1…5 по числу партий (≈ ×3 на ступень)

    keepIds: 30,        // сколько последних id партий помнить (защита от двойного зачёта)

    // Брошенная партия. Бросил — проиграл всем за столом, как разгромно.
    leaveWeight: 1,     // вес такого поражения (больше 1 — штрафовать сильнее обычного проигрыша)
    pendTtlDays: 30,    // заявка старше — всё равно поражение, но без снимка соперников (против среднего бота)
    holdDays: 7         // сетевая партия: столько заявка ждёт возврата за стол / подъёма стола, потом — поражение
  };

  /* ------------------------------------------------------------------------
   * Пресеты игр. Числа ботов здесь — стартовые догадки. Их нужно заменить
   * замером (Rating.calibrate) — см. 09-РЕЙТИНГ.md, «Калибровка».
   * --------------------------------------------------------------------- */
  var PRESETS = {
    klabor: {
      mode: 'score',
      scoreMargin: 300,     // ПОДОБРАТЬ: разница итогового счёта, которую считать разгромом
      scoreWinFloor: 0.75,
      bots: { 1: 1380, 2: 1500, 3: 1620 }
    },
    preferans: {
      mode: 'score',
      scoreMargin: 150,     // ПОДОБРАТЬ: разница в вистах между двумя игроками — разгром
      scoreWinFloor: 0.65,  // в преферансе размер выигрыша важнее, чем в клаборе
      bots: { 1: 1380, 2: 1500, 3: 1620 }
    },
    bridge: {
      mode: 'score',        // запасной путь: итог роббера; основной — дубль (applyDeals)
      scoreMargin: 1000,
      scoreWinFloor: 0.7,
      matchWeight: 0.5,     // счёт роббера шумный — вес вдвое меньше
      leaveWeight: 2,       // брошенный роббер весит как обычная партия, а не как половина
      impScale: 6,
      dealWeight: 0.15,
      dupRef: 3,
      bots: { 1: 1350, 2: 1500, 3: 1650 }
    },
    durak: {
      mode: 'rank',
      winScore: 0.85,       // обычная победа
      crushScore: 1,        // погоны
      bots: { 1: 1350, 2: 1500, 3: 1650 }
    }
  };

  /* ------------------------------------------------------------------------ */

  function extend(dst) {
    for (var i = 1; i < arguments.length; i++) {
      var src = arguments[i];
      if (!src) continue;
      for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) {
        var v = src[k];
        if (v && typeof v === 'object' && !Array.isArray(v)) dst[k] = extend({}, dst[k] || {}, v);
        else dst[k] = Array.isArray(v) ? v.slice() : v;
      }
    }
    return dst;
  }

  /** Собрать настройки игры: DEFAULTS + пресет + свои поправки. */
  function config(gameId, overrides) {
    var c = extend({}, DEFAULTS, PRESETS[gameId] || {}, overrides || {});
    c.game = gameId;
    // боты не сливаются, а заменяются целиком: у игры может быть другой набор уровней
    var src = (overrides && overrides.bots) || (PRESETS[gameId] && PRESETS[gameId].bots) || DEFAULTS.bots;
    var b = {};
    for (var k in src) b[String(k)] = +src[k];
    c.bots = b;
    return c;
  }

  function r2(x) { return Math.round(x * 100) / 100; }
  function now(t) { return typeof t === 'number' ? t : Date.now(); }

  /** Новое состояние игрока. Это всё, что нужно хранить (≈150 байт). */
  function fresh(cfg, t) {
    return {
      v: VERSION,
      r: cfg.start, rd: cfg.startRd, vol: cfg.startVol,
      n: 0,        // партий всего
      h: 0,        // из них с живыми людьми за столом
      t: now(t),   // время последней партии
      s: 0,        // показанные звёзды (0 — калибровка)
      pk: 0,       // лучшие звёзды за всё время
      ab: 0,       // брошенных партий (засчитаны поражением)
      ids: []      // последние id партий
    };
  }

  /** Привести к виду текущей версии; мусор — в новое состояние. */
  function normalize(cfg, st) {
    if (!st || typeof st !== 'object' || !isFinite(st.r) || !isFinite(st.rd)) return fresh(cfg);
    var o = fresh(cfg, st.t);
    o.r = +st.r; o.rd = Math.min(cfg.rdMax, Math.max(cfg.rdMin, +st.rd));
    o.vol = isFinite(st.vol) && st.vol > 0 ? +st.vol : cfg.startVol;
    o.n = st.n | 0; o.h = st.h | 0; o.s = +st.s || 0; o.pk = +st.pk || 0; o.ab = st.ab | 0;
    o.ids = Array.isArray(st.ids) ? st.ids.slice(-cfg.keepIds) : [];
    return o;
  }

  function botState(cfg, level) {
    var r = cfg.bots[String(level)];
    if (!isFinite(r)) throw new Error('Rating: нет рейтинга для бота уровня ' + level);
    return { r: r, rd: cfg.botRd, vol: cfg.startVol, bot: true };
  }

  /* ---------------------------- Glicko-2 ------------------------------- */

  function g(phi) { return 1 / Math.sqrt(1 + 3 * phi * phi / (Math.PI * Math.PI)); }
  function Ex(mu, muj, phij) { return 1 / (1 + Math.exp(-g(phij) * (mu - muj))); }

  /** Неуверенность растёт за простой. */
  function decay(cfg, st, t) {
    var days = (now(t) - (st.t || now(t))) / 86400000;
    if (days < cfg.periodDays) return st.rd;
    var periods = Math.floor(days / cfg.periodDays);
    var phi = st.rd / SCALE;
    phi = Math.sqrt(phi * phi + periods * st.vol * st.vol);
    return Math.min(cfg.rdMax, phi * SCALE);
  }

  function newVol(phi, vol, v, delta, tau) {
    var a = Math.log(vol * vol), eps = 1e-6;
    var d2 = delta * delta, p2 = phi * phi;
    function f(x) {
      var ex = Math.exp(x);
      return ex * (d2 - p2 - v - ex) / (2 * Math.pow(p2 + v + ex, 2)) - (x - a) / (tau * tau);
    }
    var A = a, B, k;
    if (d2 > p2 + v) B = Math.log(d2 - p2 - v);
    else { k = 1; while (f(a - k * tau) < 0 && k < 60) k++; B = a - k * tau; }
    var fA = f(A), fB = f(B), it = 0;
    while (Math.abs(B - A) > eps && it++ < 100) {
      var C = A + (A - B) * fA / (fB - fA), fC = f(C);
      if (fC * fB <= 0) { A = B; fA = fB; } else fA = fA / 2;
      B = C; fB = fC;
    }
    return Math.exp(A / 2);
  }

  /**
   * Одно обновление Glicko-2.
   * obs: [{mu, phi, s, w}] — соперники (в шкале Glicko-2), результат 0..1, вес.
   * muSelf — от чьего рейтинга считать ожидание (для пары — средний по паре).
   */
  function glicko(cfg, st, rdNow, muSelf, obs) {
    var mu = (st.r - BASE) / SCALE, phi = rdNow / SCALE;
    var vInv = 0, dsum = 0;
    for (var i = 0; i < obs.length; i++) {
      var o = obs[i], gj = g(o.phi), e = Ex(muSelf, o.mu, o.phi);
      vInv += o.w * gj * gj * e * (1 - e);
      dsum += o.w * gj * (o.s - e);
    }
    if (vInv <= 0) return { r: st.r, rd: rdNow, vol: st.vol };
    var v = 1 / vInv, delta = v * dsum;
    var vol = newVol(phi, st.vol, v, delta, cfg.tau);
    var phiStar = Math.sqrt(phi * phi + vol * vol);
    var phiNew = 1 / Math.sqrt(1 / (phiStar * phiStar) + 1 / v);
    var muNew = mu + phiNew * phiNew * dsum;
    var rd = Math.min(cfg.rdMax, Math.max(cfg.rdMin, phiNew * SCALE));
    return { r: muNew * SCALE + BASE, rd: rd, vol: vol };
  }

  /** Ожидаемый результат a против b (0..1) — для подсказок и тестов. */
  function expected(a, b) {
    var phi = Math.sqrt((a.rd * a.rd + b.rd * b.rd)) / SCALE;
    return Ex((a.r - BASE) / SCALE, (b.r - BASE) / SCALE, phi);
  }

  /* --------------------------- Звёзды ---------------------------------- */

  /** Пороги в рейтинге: [1★, 2★, 3★, 4★, 5★] (уже с поправкой на осторожность). */
  function thresholds(cfg) {
    var t;
    if (cfg.stars && cfg.stars.length === 4) t = cfg.stars.slice();
    else {
      var lv = Object.keys(cfg.bots).map(Number).sort(function (a, b) { return a - b; });
      var lo = cfg.bots[lv[0]], mid = cfg.bots[lv[Math.floor((lv.length - 1) / 2)]], hi = cfg.bots[lv[lv.length - 1]];
      if (lv.length === 2) mid = (lo + hi) / 2;
      t = [lo, mid, hi, hi + cfg.topGap];
    }
    var t1 = t[0] - (t[1] - t[0]);              // 1★ — на шаг ниже слабого бота
    return [t1, t[0], t[1], t[2], t[3]];
  }

  /** Непрерывные звёзды 1..5 по осторожному рейтингу. */
  function starsAt(cfg, rc) {
    var T = thresholds(cfg);
    if (rc <= T[0]) return 1;
    if (rc >= T[4]) return 5;
    for (var i = 0; i < 4; i++) if (rc < T[i + 1]) return 1 + i + (rc - T[i]) / (T[i + 1] - T[i]);
    return 5;
  }

  /** Обратное: какой осторожный рейтинг нужен для value звёзд. */
  function rcFor(cfg, value) {
    var T = thresholds(cfg);
    var v = Math.max(1, Math.min(5, value)), i = Math.min(3, Math.floor(v - 1));
    return T[i] + (v - 1 - i) * (T[i + 1] - T[i]);
  }

  function capFor(cfg, n) {
    var cap = 5;
    for (var i = 0; i < cfg.caps.length; i++) if (n < cfg.caps[i][1]) cap = Math.min(cap, cfg.caps[i][0] - 0.5);
    return cap;
  }

  /** Пересчитать показанные звёзды с гистерезисом. Мутирует st. */
  function rcOf(cfg, st) { return st.r - cfg.confK * Math.max(0, st.rd - cfg.rdSettled); }

  function refreshStars(cfg, st) {
    if (st.n < cfg.calibrationGames) { st.s = 0; return st; }
    var rc = rcOf(cfg, st);
    var raw = Math.floor(starsAt(cfg, rc) * 2) / 2;
    raw = Math.min(raw, capFor(cfg, st.n));
    if (!st.s || raw >= st.s) st.s = raw;
    else if (rc < rcFor(cfg, st.s) - cfg.hysteresis) st.s = raw;
    if (st.s > st.pk) st.pk = st.s;
    return st;
  }

  function expLevel(cfg, n) {
    var L = 0;
    for (var i = 0; i < cfg.expLevels.length; i++) if (n >= cfg.expLevels[i]) L = i + 1;
    return { level: L, next: cfg.expLevels[L] || null };
  }

  /** Всё, что нужно для показа в профиле и за столом. */
  function view(cfg, st) {
    st = normalize(cfg, st);
    var cal = st.n < cfg.calibrationGames;
    var e = expLevel(cfg, st.n);
    return {
      stars: cal ? 0 : st.s,
      calibrating: cal,
      left: cal ? cfg.calibrationGames - st.n : 0,
      peak: st.pk,
      games: st.n, human: st.h, abandoned: st.ab,
      r: Math.round(st.r), rd: Math.round(st.rd),
      rc: Math.round(rcOf(cfg, st)),
      exp: e.level, expNext: e.next
    };
  }

  /* ------------------------- Зачёт партии ------------------------------ */

  function pushId(cfg, st, id) {
    if (id == null) return;
    st.ids.push(String(id));
    if (st.ids.length > cfg.keepIds) st.ids = st.ids.slice(-cfg.keepIds);
  }

  function multiW(cfg, nOpp) {
    if (nOpp <= 1 || cfg.multiWeight === 'full') return 1;
    if (cfg.multiWeight === 'even') return 1 / nOpp;
    return 1 / Math.sqrt(nOpp);
  }

  function pairScore(cfg, mode, A, B, crushSet) {
    // бросивший проигрывает всем, кто остался, — полностью, как разгромом
    if (A.left || B.left) return A.left && B.left ? 0.5 : (A.left ? 0 : 1);
    if (mode === 'rank') {
      if (A.place === B.place) return 0.5;
      var win = A.place < B.place, w = win ? A : B, l = win ? B : A;
      var sc = crushSet[w.id + '>' + l.id] ? cfg.crushScore : cfg.winScore;
      return win ? sc : 1 - sc;
    }
    var d = A.score - B.score;
    if (d === 0) return 0.5;
    var base = cfg.scoreMargin > 0
      ? cfg.scoreWinFloor + (1 - cfg.scoreWinFloor) * Math.min(1, Math.abs(d) / cfg.scoreMargin)
      : 1;
    return d > 0 ? base : 1 - base;
  }

  /**
   * Зачесть партию.
   *
   * match = {
   *   id:    'уникальный id партии' (обязательно для сети: защита от двойного зачёта),
   *   mode:  'rank' | 'score'   (по умолчанию cfg.mode),
   *   now:   Date.now(),
   *   weight: 1                 (необязательно: доп. множитель веса партии),
   *   seats: [{
   *     key:   'p0',            — как вы зовёте место (вернётся в ответе)
   *     state: {...} | null,    — состояние живого игрока (null — новичок)
   *     bot:   2,               — уровень бота (тогда state не нужен)
   *     team:  0,               — номер пары; без него каждый сам за себя
   *     place: 1,               — режим rank: 1 — лучший; равные места — ничья
   *     score: 312              — режим score: итог партии (больше — лучше)
   *   }],
   *   crush: [['p1','p3'], …]   — режим rank: пары «победитель, проигравший», где был разгром
   *                               (можно указывать и по командам: ключ любого члена пары)
   * }
   *
   * Ответ: { states: {key: новоеСостояние}, deltas: {key: изменение r}, skipped: [key] }
   * Боты в ответ не попадают.
   */
  function applyMatch(cfg, match) {
    var mode = match.mode || cfg.mode || 'rank';
    var t = now(match.now);
    var seats = match.seats || [];
    var units = [], byTeam = {};

    // 1. собрать места в «единицы» (игрок-одиночка или пара)
    seats.forEach(function (s, i) {
      var p = s.bot != null ? botState(cfg, s.bot) : normalize(cfg, s.state);
      var rdNow = p.bot ? p.rd : decay(cfg, p, t);
      var m = { key: s.key != null ? String(s.key) : String(i), seat: s, st: p, rdNow: rdNow, bot: !!p.bot, left: !!s.left };
      var tk = s.team != null ? 'T' + s.team : 'S' + i;
      var u = byTeam[tk];
      if (!u) {
        u = byTeam[tk] = { id: tk, members: [], place: s.place, score: s.score };
        units.push(u);
      }
      if (u.place == null) u.place = s.place;
      if (u.score == null) u.score = s.score;
      u.members.push(m);
      if (m.left) u.left = true;
    });
    if (units.length < 2) return { states: {}, deltas: {}, skipped: [] };

    units.forEach(function (u) {
      var mus = 0, phis = 0;
      u.members.forEach(function (m) {
        mus += (m.st.r - BASE) / SCALE;
        phis += Math.pow(m.rdNow / SCALE, 2);
      });
      u.mu = mus / u.members.length;
      u.phi = Math.sqrt(phis / u.members.length);
    });

    // 2. разгромы: ключи мест → id единиц
    var keyUnit = {};
    units.forEach(function (u) { u.members.forEach(function (m) { keyUnit[m.key] = u.id; }); });
    var crushSet = {};
    (match.crush || []).forEach(function (pr) {
      var a = keyUnit[String(pr[0])], b = keyUnit[String(pr[1])];
      if (a && b) crushSet[a + '>' + b] = true;
    });

    var humans = 0;
    seats.forEach(function (s) { if (s.bot == null) humans++; });

    // 3. каждому живому — своё обновление против всех чужих единиц
    var out = { states: {}, deltas: {}, skipped: [], void: [] };
    var only = match.only != null ? [].concat(match.only).map(String) : null;
    var w0 = (cfg.matchWeight || 1) * (match.weight || 1);
    units.forEach(function (u) {
      var opp = units.filter(function (x) { return x !== u; });
      var w = w0 * multiW(cfg, opp.length);
      u.members.forEach(function (m) {
        if (m.bot) return;
        if (only && only.indexOf(m.key) < 0) return;
        var st = m.st;
        // остался за столом, а партнёр бросил: партия для него не считается
        if (u.left && !m.left) { out.void.push(m.key); return; }
        // бросивший: проигрыш каждой чужой единице, кто бы где ни оказался
        var obs = opp.map(function (o) {
          var sc = m.left ? (o.left ? 0.5 : 0) : pairScore(cfg, mode, u, o, crushSet);
          return { mu: o.mu, phi: o.phi, s: sc, w: m.left ? w * cfg.leaveWeight : w };
        });
        if (match.id != null && st.ids.indexOf(String(match.id)) >= 0) {
          out.states[m.key] = st; out.deltas[m.key] = 0; out.skipped.push(m.key);
          return;
        }
        var res = glicko(cfg, st, m.rdNow, u.mu, obs);
        var ns = extend({}, st, { r: r2(res.r), rd: r2(res.rd), vol: Math.round(res.vol * 1e6) / 1e6, t: t });
        ns.ids = st.ids.slice();
        ns.n = st.n + 1;
        ns.h = st.h + (humans > 1 ? 1 : 0);
        if (m.left) ns.ab = (st.ab | 0) + 1;
        pushId(cfg, ns, match.id);
        refreshStars(cfg, ns);
        out.states[m.key] = ns;
        out.deltas[m.key] = r2(ns.r - st.r);
      });
    });
    return out;
  }

  /**
   * Дубль: зачесть сессию сдач, сравнивая игрока с ботом на тех же картах.
   * Вызывать ОДИН раз на роббер / партию / пульку, передав все сдачи сразу.
   *
   * deals: [число IMP «я минус бот на моём месте»] или [{imps}]
   * opts:  { id, now, ref: уровень бота-эталона (по умолчанию cfg.dupRef),
   *          human: true, если за столом были живые люди }
   * Ответ: { state, delta, skipped }
   */
  function applyDeals(cfg, state, deals, opts) {
    opts = opts || {};
    var st = normalize(cfg, state), t = now(opts.now);
    if (opts.id != null && st.ids.indexOf(String(opts.id)) >= 0) return { state: st, delta: 0, skipped: true };
    var ref = botState(cfg, opts.ref != null ? opts.ref : cfg.dupRef);
    var rdNow = decay(cfg, st, t);
    var refMu = (ref.r - BASE) / SCALE, refPhi = ref.rd / SCALE;
    var obs = (deals || []).map(function (d) {
      var imps = typeof d === 'number' ? d : +d.imps || 0;
      return { mu: refMu, phi: refPhi, s: 0.5 + 0.5 * Math.tanh(imps / cfg.impScale), w: cfg.dealWeight };
    });
    if (!obs.length) return { state: st, delta: 0, skipped: true };
    var res = glicko(cfg, st, rdNow, (st.r - BASE) / SCALE, obs);
    var ns = extend({}, st, { r: r2(res.r), rd: r2(res.rd), vol: Math.round(res.vol * 1e6) / 1e6, t: t });
    ns.ids = st.ids.slice();
    ns.n = st.n + 1;
    ns.h = st.h + (opts.human ? 1 : 0);
    pushId(cfg, ns, opts.id);
    refreshStars(cfg, ns);
    return { state: ns, delta: r2(ns.r - st.r), skipped: false };
  }

  /**
   * Гость получил от хозяина своё новое состояние. Принять, если эта партия
   * у него ещё не зачтена и пришедшее состояние выросло из его же текущего.
   */
  function adopt(cfg, local, remote, matchId, delta) {
    var a = normalize(cfg, local);
    if (!remote) return a;
    var b = normalize(cfg, remote), id = matchId != null ? String(matchId) : null;
    if (id && a.ids.indexOf(id) >= 0) return a;                 // уже зачтено
    // посчитано ровно от моего текущего состояния — берём как есть
    if (b.n === a.n + 1 && (!id || b.ids.indexOf(id) >= 0)) return b;
    // хозяин считал от устаревшего снимка (например, после прошлой партии
    // за этим же столом ему не прислали новое) — переносим только изменение,
    // иначе прошлая партия потерялась бы
    if (isFinite(delta)) {
      var o = extend({}, a);
      o.ids = a.ids.slice();
      o.r = r2(a.r + (+delta));
      o.rd = r2(Math.max(cfg.rdMin, Math.min(a.rd, b.rd)));
      o.vol = b.vol;
      o.n = a.n + 1;
      o.h = a.h + 1;                     // результат от хозяина — партия была с людьми
      o.t = Math.max(a.t, b.t);
      pushId(cfg, o, id);
      refreshStars(cfg, o);
      return o;
    }
    return b.n > a.n ? b : a;            // без изменения не откатываемся
  }

  /** Сетевая заявка ждёт возврата за стол слишком долго — пора засчитать поражение. */
  function holdExpired(cfg, pend, t) {
    if (!pend || !pend.t) return true;
    return (now(t) - pend.t) / 86400000 > cfg.holdDays;
  }

  /** Сложить два профиля (импорт файлом / облако): берём «длиннее», id объединяем. */
  function merge(cfg, a, b) {
    a = normalize(cfg, a); b = normalize(cfg, b);
    var main = (b.n > a.n || (b.n === a.n && b.t > a.t)) ? b : a;
    var other = main === a ? b : a;
    var ids = main.ids.slice();
    other.ids.forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    var o = extend({}, main);
    o.ids = ids.slice(-cfg.keepIds);
    o.pk = Math.max(a.pk, b.pk);
    return o;
  }

  /* ----------------------- Брошенная партия ---------------------------- */

  /**
   * Заявка на партию — «залог поражения». Пишется в хранилище, как только
   * партия началась (розданы карты), и снимается только на итогах.
   * Если вкладку закрыли, браузер упал, игрок ушёл в меню или начал новую
   * партию поверх этой — заявка остаётся, и при следующем запуске
   * forfeit() засчитывает её поражением.
   *
   * match — то же, что для applyMatch (id, mode, seats), только без мест и
   * счёта; me — ключ своего места. Состояния соперников сохраняются снимком
   * (только r и rd), чтобы поражение считалось против тех, кто сидел за столом.
   */
  function pending(cfg, match, me) {
    var seats = (match.seats || []).map(function (s, i) {
      var key = s.key != null ? String(s.key) : String(i);
      var o = { key: key };
      if (s.team != null) o.team = s.team;
      if (s.bot != null) o.bot = s.bot;
      else if (key !== String(me)) {
        var st = normalize(cfg, s.state);
        o.r = r2(st.r); o.rd = r2(st.rd);
      }
      return o;
    });
    return { v: VERSION, id: String(match.id), me: String(me), t: now(match.now), mode: match.mode || cfg.mode, seats: seats };
  }

  /**
   * Засчитать брошенную партию поражением. Возвращает {state, delta, skipped}.
   * skipped — партия уже зачтена (итоги успели записаться до падения).
   */
  function forfeit(cfg, state, pend, t) {
    var st = normalize(cfg, state);
    if (!pend || pend.id == null) return { state: st, delta: 0, skipped: true };
    if (st.ids.indexOf(String(pend.id)) >= 0) return { state: st, delta: 0, skipped: true };
    var tt = now(t);
    var old = (tt - (pend.t || tt)) / 86400000 > cfg.pendTtlDays;
    var seats = (pend.seats || []).map(function (s) {
      var o = { key: s.key, team: s.team };
      if (s.key === pend.me) { o.state = st; o.left = true; }
      else if (s.bot != null || old) o.bot = s.bot != null ? s.bot : midBot(cfg);
      else o.state = { r: s.r, rd: s.rd };
      return o;
    });
    if (!seats.some(function (s) { return s.key === pend.me; })) return { state: st, delta: 0, skipped: true };
    var res = applyMatch(cfg, { id: pend.id, mode: pend.mode, now: tt, seats: seats, only: pend.me });
    var ns = res.states[pend.me] || st;
    return { state: ns, delta: res.deltas[pend.me] || 0, skipped: !res.states[pend.me] };
  }

  function midBot(cfg) {
    var lv = Object.keys(cfg.bots).map(Number).sort(function (a, b) { return a - b; });
    return lv[Math.floor((lv.length - 1) / 2)];
  }

  /* ------------------------- Калибровка ботов -------------------------- */

  /**
   * Рейтинги ботов по матчам бот-против-бота (модель Брэдли — Терри).
   * results: [{a: 1, b: 3, wa: 412, wb: 588, d: 0}] — победы a, победы b, ничьи
   * anchor:  {level: 2, r: 1500} — кого держим на месте
   * Ответ: { 1: 1371, 2: 1500, 3: 1618 }
   */
  function calibrate(results, anchor) {
    var names = {}, W = {}, N = {};
    results.forEach(function (x) {
      var a = String(x.a), b = String(x.b), d = x.d || 0;
      names[a] = names[b] = 1;
      W[a] = (W[a] || 0) + x.wa + d / 2;
      W[b] = (W[b] || 0) + x.wb + d / 2;
      var n = x.wa + x.wb + d;
      N[a + '|' + b] = (N[a + '|' + b] || 0) + n;
      N[b + '|' + a] = (N[b + '|' + a] || 0) + n;
    });
    var ks = Object.keys(names), gm = {};
    ks.forEach(function (k) { gm[k] = 1; W[k] = Math.max(W[k] || 0, 0.5); });
    for (var it = 0; it < 500; it++) {
      var nx = {};
      ks.forEach(function (i) {
        var den = 0;
        ks.forEach(function (j) { if (i !== j && N[i + '|' + j]) den += N[i + '|' + j] / (gm[i] + gm[j]); });
        nx[i] = den > 0 ? W[i] / den : gm[i];
      });
      gm = nx;
    }
    var al = String(anchor ? anchor.level : ks[0]), ar = anchor ? anchor.r : 1500;
    var out = {};
    ks.forEach(function (k) { out[k] = Math.round(ar + 400 * Math.log10(gm[k] / gm[al])); });
    return out;
  }

  /**
   * Подобрать impScale для дубля. Прогнать дублем бота a против бота-эталона b
   * (тот же расклад, a на месте, b — эталон на том же месте) и собрать IMP за сдачу.
   * gap — разница их рейтингов (из calibrate). Возвращает impScale, при котором
   * средний результат сдачи совпадает с ожиданием по Эло.
   */
  function calibrateImps(imps, gap) {
    if (!imps.length) return DEFAULTS.impScale;
    var target = 1 / (1 + Math.pow(10, -gap / 400));
    function mean(sc) {
      var s = 0;
      for (var i = 0; i < imps.length; i++) s += 0.5 + 0.5 * Math.tanh(imps[i] / sc);
      return s / imps.length;
    }
    var lo = 0.2, hi = 200;
    // если даже при самом резком переводе IMP в результат цель недостижима —
    // разница ботов в IMP слишком мала для такого gap: проверьте замер

    'Дворник с Комитетской. Метлу ставил так, что двор боялся сорить.',
    'Электрик в ЖЭКе. Чинил всё, кроме собственной проводки.',
    'Всю жизнь в зеленной лавке. Помидор выбирала на ощупь и не ошибалась.',
    'Шофёр на хлебовозке. К шести утра знал весь город, и город знал его.',
    'Настройщик в музыкальной школе. Слышал фальшь через две стены.',
    'Работала в столовой пароходства. Добавку давала тем, кто здоровался.',
    'Плотник в порту. Сорок лет чинил чужие сходни.',
    'Убирала в школе. Знала каждого второгодника по походке.',
    'Играл в клабор в Дюковском саду. Проигрывал редко и всегда с достоинством.',
    'Вязала на заказ. По её кофтам можно изучать историю двора.',
    'Массовик в санатории на Фонтане. Веселил даже отдыхающих из Москвы.',
    'Сидела в справочном на вокзале. Отвечала быстрее, чем спрашивали.',
    'Слесарь на «Продмаше». Дома чинил всё, кроме того, о чём просила жена.',
    'Билетёрша в кинотеатре «Родина». Знала все фильмы по звуку.',
    'Играл на пляже в очко. С пляжа гоняли, он возвращался.',
    'Пекла хлеб в пекарне на Слободке. Корку отдавала детям — так заведено.',
    'Раздавала карты в летнем кафе на Ланжероне. И советы раздавала, тоже метко.',
    'Администратор в «Красной». Не пускала так, что человек ещё и благодарил.',
    'Рыбный ряд на Привозе, двадцать лет. Голос ставили не в консерватории.',
    'Работала в горисполкоме. Чем именно — не рассказывала даже мужу.',
    'Выросла в проходном дворе. Знала все проходы и половину чужих секретов.',
    'Костюмер в Оперном. Каждую примадонну одевала и каждой сочувствовала.',
    'Соседка со второго этажа. Знала новости раньше, чем они происходили.',
    'Играла в музкомедии. Вторые роли, зато сорок лет подряд.',
    'Гадала на картах на Староконном. Говорила: карты не врут, врут люди.',
    'Фруктовый ряд на Новом базаре. Яблоко выбирала как жениха, придирчиво.',
    'Приехала из Бендер, осталась навсегда. Торговала специями, о прошлом молчала.',
    'Сорок лет в детском саду на Отраде. Через её руки полМолдаванки прошло.',
    'Парикмахер на Дерибасовской. Стригла по фотографии, выходило лучше.',
    'Работала на пивзаводе. Пиво не пила — говорила, на работе насмотрелась.',
    'Держала комиссионку. Вещь оценивала взглядом, человека — тоже.',
    'Продавала билеты в филармонии. Лучшие места держала для тех, кто слушает.',
    'Работала в Доме моделей на Пушкинской. Носила то, что все увидят через год.',
    'Стюардесса на линии Одесса — Москва. Привозила дефицит и сплетни.',
    'Диктор областного радио. Голос знали все, лицо не знал никто.',
    'Администратор в «Аркадии». Ресторан держался на её улыбке и её памяти.',
    'Секретарь в пароходстве. Через её стол шли все, кто собрался в загранрейс.',
    'Товаровед в универмаге. Слово «выбросили» знала раньше очереди.',
    'Гид в «Интуристе». Показывала Потёмкинскую по десять раз на дню.',
    'Инженер в проектном институте. Чертила мосты, а мечтала о Париже.',
    'Экскурсовод в катакомбах. Темноты не боялась, боялась опозданий.',
    'Заведовала отделом в «Пассаже». Порядок железный, помада алая.',
    'Регистрировала рейсы в аэропорту. Лишний килограмм прощала не всем.',
    'Костюмер на киностудии. Одесское кино семидесятых одето её руками.',
    'Преподавала в кулинарном училище. Тесто по науке, соль по наитию.',
    'Кассир в «Украине». Помнила, кто на какой ряд ходит уже десять лет.',
    'Работала в бюро путешествий. Отправила пол-Одессы на Кавказ, сама не ездила.',
    'Мастер в салоне на Ришельевской. Причёску делала под характер, не под моду.',
    'Проводница на поезде Одесса — Киев. Чай у неё был крепче, чем у всех.',
    'Художница в оформительском цехе. Все вывески на Ришельевской — её рука.',
    'Работала в театральной кассе. Бронь держала для тех, кто помнил её имя.',
    'Играла в оркестре филармонии. Скрипку возила в трамвае, как ребёнка.',
    'Приехала из села на «Красную звезду». Осталась и прижилась.',
    'Расписывала афиши для Оперного. Работала ночами, спала днём.',
    'Училась на филфаке, стояла в Доме книги. Читала быстрее, чем продавала.',
    'Пела в ресторане на Фонтане. Репертуар весь, любимая песня одна.',
    'Работала на телеграфе. Читала чужие радости и беды по три сотни в день.',
    'Танцевала в ансамбле Дома учёных. Туфли берегла больше, чем платья.',
    'Приехала из Аккермана торговать зеленью. Пустила корни, как её петрушка.',
    'Держала прилавок с бельём на Староконном. Торговалась с азартом, по-доброму.',
    'Работала в нотариальной конторе. Чужие наследства знала лучше своих дел.',
    'Гардеробщица в театре. Помнила, кому какое пальто, с одного взгляда.',
    'Пела в хоре Дома культуры. Голос вела ровно, соседей не жалела.',
    'Закройщица в ателье. Смеялась так, что мерки снимали дважды.',
    'Чинила сети на Лузановке. Узел вязала за секунду, разговор на час.',
    'Рыбный ряд на Привозе. Взвешивала честно, сдачу давала с присказкой.',
    'Стояла с семечками у Привоза. Кулёк крутила из газеты, всегда с верхом.',
    'Молочный ряд. Сметану пробовать давала всем, покупать — не всем.',
    'Ходила в море с мужем на шаланде. Море знала не хуже него.',
    'Солила огурцы на весь квартал. Рецепт не сказала даже дочери.',
    'Цветочный угол у Оперного. Гвоздики держала для тех, кто идёт на свидание.',
    'Стояла на Привозе сорок лет. Безмен держала так, что спорить не хотелось.',
    'Пекла пирожки с ливером у вокзала. Очередь была всегда, реклама не нужна.',
    'Ходила на Привоз каждое утро с авоськой. Знала, у кого что свежее.',
    'Помидорный ряд. Говорила: помидор выбирают носом, а не глазами.',
    'Торговала арбузами с Херсонщины. Стучала по арбузу, как доктор по спине.',
    'Приехала из Овидиополя торговать брынзой. Осталась, прижилась, обжилась.',
    'Держала зеленной ряд. Укроп у неё был отдельной гордостью.',
    'Продавала бычков на Пересыпи. Бычок у неё был к пиву и к разговору.',
    'Ягодный ряд в июне. Черешню давала пробовать, вишню — под честное слово.',
    'Биндюжник с Молдаванки. Лошадь звал по имени, людей — по прозвищу.',
    'Боцман дальнего плавания. Прошёл три океана, а швартовался у Привоза.',
    'Судовой механик. Машину слышал как врач сердце, руки не отмывались.',
    'Крючник в порту. Мешок на спине носил, как другие пиджак.',
    'Ходил в загранку. Привозил джинсы, жвачку и слухи, что там всё не так.',
    'Крановщик в порту. Полжизни провёл выше всех и молчал об этом.',
    'Рыбак с Лузановки. Бычков ловил столько, что кот отказывался.',
    'Катал на лодке у Ланжерона. Про каждую волну имел отдельное мнение.',
    'Франт с Молдаванки. Тройка, кепка, перстень и никакой определённой работы.',
    'Стоял на шухере у Мясоедовской. Семечки лузгал профессионально.',
    'Крутил напёрстки у вокзала. Всегда выигрывал и всегда удивлялся.',
    'Тот самый катала. Карты держал так, что их не видел даже он сам.',
    'Фарцевал у «Интуриста». Часы на обеих руках — не от жадности, для витрины.',
    'Маркёр в бильярдной. Шары считал вслух, долги про себя.',
    'Скупал золото на Пале-Рояле. Лупу носил в кармане, как другие расчёску.',
    'Старый король двора. Все споры кончались тем, что шли к нему.',
    'Сапожник в будке на Тираспольской. Гвозди во рту, правда на языке.',
    'Часовщик на Ришельевской. Чинил всё, кроме времени.',
    'Жестянщик с Пересыпи. Вёдра его переживали хозяев.',
    'Стекольщик. Ходил по дворам и кричал так, что стёкла дрожали сами.',
    'Точильщик ножей. Станок на ремне, искры на весь двор.',
    'Шарманщик с попугаем. Билетик со счастьем стоил копейку.',
    'Брил на Молдаванке. Под бритвой узнавал больше, чем участковый.',
    'Мясник на Привозе. Кость давал в довесок и никогда не забывал лицо.',
    'Стоял в пивном ларьке на Соборке. Пену снимал только знакомым.',
    'Жарил шашлык в Аркадии. Дым его чувствовали от самого моря.',
    'Торговал семечками у кино. Стакан мерил на глаз, но честно.',
    'Ходил по дворам: «Шурум-бурум!» Из чужого хлама делал чужое счастье.',
    'Бондарь и винодел. Бочки ладил сам, вино наливал только проверенным.',
    'Шил кепки на Мясоедовской. Восьмиклинка от него была как документ.',
    'Ювелир под зелёной лампой. Работал тихо, жил ещё тише.',
    'Банщик на Островидова. Веник у него был инструментом и лекарством.',
    'Одесский адвокат. В суде говорил тихо, а слышали до последнего ряда.',
    'Профессор мединститута. Диагноз ставил в коридоре, лечил по-человечески.',
    'Аптекарь на Пушкинской. Знал, кому таблетку, а кому просто поговорить.',
    'Участковый на Молдаванке. Знал всех, и все знали, когда его лучше не видеть.',
    'Водил восемнадцатый трамвай. Остановки объявлял с интонацией конферансье.',
    'Таксист на «Волге». Дорогу знал, а короткую — только для своих.',
    'Пожарный с Дерибасовской. Тушил всё, кроме дворовых скандалов.',
    'Дворник с бляхой. Двор мёл так, что соседи вытирали ноги на улице.',
    'Клезмер с кларнетом. Играл на всех свадьбах и на всех похоронах.',
    'Тапёр с аккордеоном. Папироса в углу рта не гасла даже на вальсе.',
    'Дирижировал духовым оркестром в горсаду. По воскресеньям парк был его.',
    'Конферансье в летнем театре. Куплеты сочинял в трамвае по дороге.',
    'Кондуктор в трамвае. Безбилетника чувствовала спиной.',
    'Библиотекарь на Троицкой. Книгу давала не всякому, и была права.',
    'Учила музыке на дому. Гаммы слушал весь подъезд, деваться было некуда.',
    'Буфетчица в филармонии. В антракте успевала всех и всё.',
    'Забивал козла до последнего света. «Рыба!» кричал так, что просыпался двор.',
    'Фронтовик. Ордена доставал раз в год, истории — по праздникам и по просьбе.',
    'Играл в нарды у гаражей. Кубики тряс так, будто с ними договаривался.',
    'Тот самый старик с веером карт. В клабор играет с сорокового года.',
    'Дворовый гроссмейстер с Соборки. Обыгрывал всех, кроме одного соседа.',
    'Массовик на пляже в Аркадии. Рупор и панама — всё, что нужно для веселья.',
    'Спасатель на Ланжероне. Свисток за сезон стирался до блеска.',
    'Мороженщик с тележкой. Вафельный стаканчик за девятнадцать копеек.',
    'Дачник с Фонтана. Абрикосы в авоське, разговор на всю дорогу.',
    'Курортник из Москвы. Нос в цинке, фотоаппарат наперевес, счастье полное.',
    'Болел за «Черноморец» с трибуны и с балкона. Голос садился к осени.',
    'Голубятник с Пересыпи. Голубей знал по именам, соседей по жалобам.',
    'Ходила по пляжу с ведром кукурузы. «Горячая, сладкая!» — и ведь правда.',
    'Соседка с балкона. Двор просматривала лучше, чем участковый.',
    'Хозяйка двора. Половник в руке был знаком власти, и все это понимали.',

    'Капельдинер в Оперном. Ливрею носил как мундир, и по делу.',
    'Гардеробщица в театре. Номерки раздавала веером, глядя поверх очков.',
    'Пела в Оперном. Меха носила и летом — для образа.',
    'Танцевала в театре. Станок помнил её лучше, чем зеркало.',
    'Клоун в Одесском цирке. Грим смешной, глаза грустные, как положено.',
    'Укротитель. Блёстки на кителе, хлыст в руке, усы для солидности.',
    'Воздушная акробатка. Канифоль на ладонях не смывалась годами.',
    'Шпрехшталмейстер. Голос поставленный, фрак единственный.',
    'Настройщик роялей. Ухом слышал то, чего не слышал никто.',
    'Рисовал на Приморском. Портрет за десять минут, сходство на всю жизнь.',
    'Оператор Одесской киностудии. Камеру таскал на плече, как ребёнка.',
    'Актёр Русского театра. Грим, парик, папироса и полная готовность.',
    'Поэт в кашне. Печатался редко, читал везде и всем.',
    'Суфлёр. Полспектакля из будки, и ни одного провала.',
    'Костюмер. Булавки во рту, сантиметр на шее, порядок в голове.',
    'Гримёр. Из любого делала героя за двадцать минут.',
    'Штурман. Секстан к глазу — и уже знал, где мы и когда будем.',
    'Радист. Морзянку слышал во сне и во сне же отвечал.',
    'Судовой врач. Халат поверх кителя, спокойствие поверх всего.',
    'Водолаз. Медный шлем носил под мышкой, как шляпу.',
    'Океанолог. Батометр, планшет и вечное «ещё одну станцию».',
    'Ихтиолог. Рыбу в банке со спиртом знал по имени и по-латыни.',
    'Метеоролог. Шар-зонд отпускал каждое утро и каждый раз смотрел вслед.',
    'Маячник. Фонарь держал в порядке, ветер держал в бороде.',
    'Лоцман порта. Заводил суда так, что капитаны не спорили.',
    'Таможенник в порту. Печать ставил медленно, смотрел быстро.',
    'Машинист. Копоть не отмывалась, гудок узнавала вся Пересыпь.',
    'Курсант мореходки. Форменка отглажена, море ещё впереди.',
    'Диспетчер на вокзале. Рупор и китель, и поезда по расписанию.',
    'Стюардесса «Аэрофлота». Пилотка набок, улыбка на публику.',
    'Крановщица в порту. Каска, рукавицы и вид сверху на весь город.',
    'Телефонистка на коммутаторе. Соединяла город, слышала полгорода.',
    'Шеф-повар в «Красной». Колпак крахмальный, характер тоже.',
    'Кондитер. «Птичье молоко» делала так, что очередь стояла с ночи.',
    'Пекарь. Лопата с хлебами, мука по локоть, запах на весь квартал.',
    'Официант в «Красной». Полотенце через руку, память на лица безотказная.',
    'Буфетчик вагона-ресторана. Чай в подстаканнике, нарукавники, спокойствие.',
    'Стояла у автомата с газводой. Двойной сироп по знакомству.',
    'Молочница с бидоном. Разносила по дворам до семи утра.',
    'Делала брынзу. Головку держала в руках, как хрусталь.',
    'Виноградарь с Шабо. Секатор, корзина и вино для своих.',
    'Гнал самогон в сарае. Змеевик прятал, а запах спрятать не умел.',
    'Тамада на свадьбах. Рог поднимал так, что плакали и трезвые.',
    'Свадебная бабушка. Курицу несла под мышкой, а порядок — в голове.',

    'Торговала бубликами у вокзала. Связки на руке, голос на весь перрон.',
    'Коптил бычков на Пересыпи. Дым выдавал его за три квартала.',
    'Мыла посуду в столовой. Тарелок за смену больше, чем людей в квартале.',
    'Учила младшие классы. Указка была нужна для карты, а не для дела.',
    'Завуч. Очки на цепочке и папка, от которой дрожала вся школа.',
    'Пионервожатая. Горн трубил так, что лагерь вставал раньше побудки.',
    'Физрук. Свисток на шее, а спортзал держал одним взглядом.',
    'Школьный сторож. Колокольчик, тулуп и полное знание всех прогульщиков.',
    'Тренер по боксу. Нос сломан дважды, характер ни разу.',
    'Гребец. Вёсла, плечи и Хаджибейский лиман на рассвете.',
    'Яхтсмен. Капитанка набекрень, канат в руках, ветер в планах.',

  // общий трёп и новые реплики — в один банк
  var L = {}, k2;
  for (k2 in GEN) L[k2] = GEN[k2].slice();
  for (k2 in DUR) L[k2] = (L[k2] || []).concat(DUR[k2]);

  /* Пол говорящего берётся из портрета. За столом сидят и мужчины, и
     женщины, а «Взял» из уст мадам Двойры звучало бы дико. Третье поле
     реплики — кому она по полу:
       ''  — любому: в строке нет родовых окончаний
       'm' — только мужчине,  'f' — только женщине
       'M' — только если мужчина ТОТ, К КОМУ обращаются, 'F' — женщина
     Пол неизвестен (портрет не выбран) — считаем мужским, как было раньше. */
  function fitSex(sx, s, t) {
    if (!sx) return true;
    var m = sx.indexOf('m') >= 0, f = sx.indexOf('f') >= 0;
    if (m || f) { if ((s || 'm') === 'f' ? !f : !m) return false; }
    var M = sx.indexOf('M') >= 0, F = sx.indexOf('F') >= 0;
    if (M || F) { if ((t || 'm') === 'f' ? !F : !M) return false; }
    return true;
  }

  /* Четвёртое поле реплики — метка карты: без неё реплику не выберут.
     «Мусор» и «манэлла» — не фигура речи, а имена двух конкретных карт
     (козырный валет и козырная девятка), и сказанные не на ту карту они
     выдают приезжего вернее любого акцента. То же с тузом, десяткой,
     семёркой: если строка называет карту, она обязана лечь на неё. */
  function fitTag(need, tags) {
    if (!need) return true;
    return !!tags && tags.indexOf(' ' + need + ' ') >= 0;
  }

  /* Какие слова вправе прозвучать на эту карту. */
  function cardTags(c, trump) {
    if (!c) return ' ';
    var t = [];
    if (trump && c.s === trump) t.push('trump');
    if (c.r === '6') t.push('six');
    if (c.r === 'A') t.push('ace');
    if (c.r === '10') t.push('ten');
    if (c.r === '7') t.push('seven');
    if (c.r === '8') t.push('eight');
    if (c.r === 'K') t.push('king');
    if (c.r === 'Q') t.push('queen');
    return ' ' + t.join(' ') + ' ';
  }

  function pick(list, ch, rnd, key, sex, tsex, tags) {
    var ok = [], i, t;
    for (i = 0; i < list.length; i++) {
      t = list[i][1];
      if ((!t || t.indexOf(ch) >= 0) && fitSex(list[i][2], sex, tsex) &&
        fitTag(list[i][3], tags)) ok.push(list[i][0]);
    }
    /* Характер уступает полу: лучше не та манера, чем не тот род.
       А метка карты не уступает ничему — реплику про мусор нельзя
       положить на десятку даже за неимением лучшего. Не нашлось своей —
       промолчим, это всегда уместно. */
    if (!ok.length) for (i = 0; i < list.length; i++)
      if (fitSex(list[i][2], sex, tsex) && fitTag(list[i][3], tags)) ok.push(list[i][0]);
    if (!ok.length) for (i = 0; i < list.length; i++)
      if (fitTag(list[i][3], tags)) ok.push(list[i][0]);
    if (!ok.length) return null;
    if (key) {
      var u = used[key] || (used[key] = {});
      var fresh = [];
      for (i = 0; i < ok.length; i++) if (!u[ok[i]]) fresh.push(ok[i]);
      if (!fresh.length) { u = used[key] = {}; fresh = ok; }
      ok = fresh;
    }
    var s = ok[Math.floor((rnd || Math.random)() * ok.length)];
    if (key) used[key][s] = true;
    return s;
  }

  function charOf(id) {
    for (var i = 0; i < CHARS.length; i++) if (CHARS[i].id === id) return CHARS[i];
    return CHARS[0];
  }

  // сколько ботов уже говорили — чтобы стол не превращался в базар без пауз
  var lastAt = {}, tick = 0;

  function say(botChar, key, ctx, force) {
    var list = L[key];
    if (!list) return null;
    var c = charOf(botChar);
    tick++;
    var seat = (ctx && ctx.seat != null) ? ctx.seat : 0;
    var mine = !!(ctx && ctx.mine);
    if (!force) {
      var lvl = (ctx && ctx.lvl) || 2;
      var pr = c.p * (lvl === 1 ? 1.2 : lvl === 3 ? 0.72 : 1);
      // байку рассказывают охотно даже молчуны — иначе за столом тихо
      if (ctx && ctx.joke) pr = Math.max(pr, 0.85);
      // свой игрок говорит охотнее: у него одно место, и это его голос за столом
      if (mine) pr = Math.min(0.95, pr * 1.6);
      if (Math.random() > pr) return null;
      if (lastAt[seat] && tick - lastAt[seat] < (mine ? 3 : 4)) return null;   // не тараторить
      if (!mine && lastAt.any && tick - lastAt.any < 2) return null;           // не хором
    }
    var s = pick(list, botChar, null, key, ctx && ctx.sex, ctx && ctx.tsex,
      ctx && ctx.tags);
    /* Реплики на эту карту не нашлось — молчим, и слот разговора при
       этом не тратим: иначе один промах затыкал бы игрока на две-три
       ситуации вперёд. */
    if (!s) return null;
    lastAt[seat] = tick; lastAt.any = tick;
    if (ctx && ctx.suit) s = s.replace('{м}', K.SUIT_NAME[ctx.suit] + ' ' + K.SUIT_CH[ctx.suit]);
    return s;
  }

  function reset() { lastAt = {}; tick = 0; used = {}; }
  function count() {
    var n = 0; for (var k in L) n += L[k].length; return n;
  }

  return {
    say: say, pick: pick, CHARS: CHARS, L: L, reset: reset,
    count: count, charOf: charOf, fitSex: fitSex,
    cardTags: cardTags, fitTag: fitTag
  };
})();

/* ============================================================
   ДУРАК — движок партии
   Движок ничего не знает про DOM. Он выставляет engine.pending —
   от кого сейчас ждём решение — и складывает события в engine.ev,
   которые интерфейс проигрывает анимацией.

   Ход за столом строго по очереди, без «наперебой»: так в любой
   момент решает ровно один человек, и сеть с одним хозяином-счётчиком
   работает без гонок.
     attack  — заходящий кладёт одну или несколько карт одного достоинства;
     defend  — отбивающийся кроет одну карту, переводит или говорит «беру»;
     throw   — подкидывающий (по очереди, начиная с заходившего) кладёт
               карты подходящего достоинства или пасует;
     next    — партия сыграна, ждём «следующую».
   ============================================================ */
var Engine = (function () {
  'use strict';

  var DEF = {
    players: 3,       // 2 | 3 | 4
    pairs: false,     // вчетвером напару: 1-й и 3-й против 2-го и 4-го
    perevod: false,   // переводной дурак
    tour: 0,          // 0 — свободная игра, 10 — малый турнир, 20 — большой
    first5: false,    // в первый отбой — не больше пяти карт
    pogony: true      // погоны по лестнице званий
  };
  var HAND = 6;

  function Game(opts) {
    this.o = {};
    for (var k in DEF) this.o[k] = (opts && k in opts) ? opts[k] : DEF[k];
    if (this.o.players !== 4) this.o.pairs = false;
    this.N = this.o.players;
    this.names = (opts && opts.names) || ['Вы', 'Бот 1', 'Бот 2', 'Бот 3'].slice(0, this.N);
    this.human = (opts && 'human' in opts) ? opts.human : 0;   // -1 — журнал по именам (сеть)
    this.rnd = (opts && opts.rnd) || Math.random;
    this.sex = (opts && opts.sex) || [];
    this.score = []; this.fools = []; this.rank = []; this.pogGave = []; this.pogGot = [];
    for (var i = 0; i < this.N; i++) {
      this.score.push(0); this.fools.push(0); this.rank.push(0); this.pogGave.push(0); this.pogGot.push(0);
    }
    this.dealer = Math.floor(this.rnd() * this.N);
    this.lastFool = -1; this.lastDraw = false;
    this.handNo = 0; this.handsPlayed = 0; this.draws = 0;
    this.history = [];        // итоги сыгранных партий: кто дурак, погоны
    this.over = false; this.winner = -1; this.loser = -1;
    this.ev = []; this.log = []; this.pending = null;
    this.hands = []; this.out = []; this.place = [];
    this.table = []; this.bito = []; this.talon = []; this.known = [];
    this.trump = null; this.trumpCard = null; this.bout = null; this.boutNo = 0;
    this.result = null;
  }

  /* ---------- стороны ---------- */
  Game.prototype.sideList = function () {
    if (this.o.pairs) return [[0, 2], [1, 3]];
    var l = []; for (var i = 0; i < this.N; i++) l.push([i]); return l;
  };
  Game.prototype.sideOf = function (p) { return this.o.pairs ? p % 2 : p; };
  Game.prototype.sideName = function (i) {
    var s = this.sideList()[i];
    return s.map(function (p) { return this.names[p]; }, this).join(' и ');
  };
  Game.prototype.sideScore = function (i) { return this.score[this.sideList()[i][0]]; };
  Game.prototype.mate = function (p) { return this.o.pairs ? (p + 2) % 4 : -1; };
  Game.prototype.foe = function (a, b) { return a !== b && (!this.o.pairs || (a % 2) !== (b % 2)); };

  // «Вы берёте» вместо «Вы берёт»; с родом: Циля взялА
  Game.prototype.W = function (p, v3, v2) {
    return (p === this.human) ? ('Вы ' + v2) : (this.names[p] + ' ' + v3);
  };
  Game.prototype.W3 = function (p, m, f, v2) {
    if (p === this.human) return 'Вы ' + v2;
    return this.names[p] + ' ' + ((this.sex && this.sex[p] === 'f') ? f : m);
  };
  Game.prototype.say = function (txt, cls) {
    this.log.push({ t: txt, c: cls || '' });
    if (this.log.length > 400) this.log.splice(0, this.log.length - 400);
    this.ev.push({ e: 'log', t: txt, c: cls || '' });
  };
  Game.prototype.push = function (o) { this.ev.push(o); };

  /* ---------- кто ещё в игре ---------- */
  Game.prototype.alive = function (p) { return !this.out[p]; };
  Game.prototype.withCards = function () {
    var l = [];
    for (var i = 0; i < this.N; i++) if (!this.out[i]) l.push(i);
    return l;
  };
  Game.prototype.nextAlive = function (p) {
    for (var k = 1; k < this.N; k++) { var q = (p + k) % this.N; if (!this.out[q]) return q; }
    return -1;
  };
  Game.prototype.prevAlive = function (p) {
    for (var k = 1; k < this.N; k++) { var q = (p - k + this.N * 2) % this.N; if (!this.out[q]) return q; }
    return -1;
  };
  // под кого ходят: следующий по часовой, кто ещё с картами и не напарник
  Game.prototype.nextFoe = function (p) {
    for (var k = 1; k < this.N; k++) {
      var q = (p + k) % this.N;
      if (!this.out[q] && this.foe(p, q)) return q;
    }
    return -1;
  };

  /* ---------- раздача ---------- */
  Game.prototype.newHand = function () {
    var N = this.N, i, p;
    this.handNo++;
    var d = K.shuffle(K.deck(), this.rnd);
    this.hands = []; this.out = []; this.known = []; this.place = []; this.outAt = [];
    for (i = 0; i < N; i++) { this.hands.push([]); this.out.push(false); this.known.push([]); this.outAt.push(0); }
    var k = 0;
    // сдаём по одной по кругу, начиная слева от сдающего
    for (var r = 0; r < HAND; r++)
      for (i = 0; i < N; i++) this.hands[(this.dealer + 1 + i) % N].push(d[k++]);
    this.trumpCard = d[k];
    this.trump = this.trumpCard.s;
    // козырь открытым кладут под колоду — он и будет последней картой
    this.talon = d.slice(k + 1).concat([this.trumpCard]);
    this.table = []; this.bito = []; this.bout = null; this.boutNo = 0;
    this.result = null; this.pending = null;
    this.sortHands();

    // кто ходит первым
    var att = -1, low = null, why = '';
    if (this.lastFool >= 0 && !this.lastDraw && this.handsPlayed > 0) {
      /* Под дурака: сосед справа от прошлого дурака заходит на него.
         По часовой у нас p+1 — это сосед слева, значит справа — p−1. */
      att = (this.lastFool - 1 + N) % N;
      why = 'под дурака';
    } else {
      for (p = 0; p < N; p++)
        this.hands[p].forEach(function (c) {
          if (c.s === this.trump && (!low || K.SEQ[c.r] < K.SEQ[low.r])) { low = c; att = p; }
        }, this);
      if (att < 0) { att = (this.dealer + 1) % N; why = 'козырей ни у кого'; }
      else why = 'младший козырь';
    }
    this.push({ e: 'deal', n: this.handNo, dealer: this.dealer, trump: this.trumpCard, att: att, low: low, why: why });
    this.say(this.W3(this.dealer, 'сдал', 'сдала', 'сдаёте') + '. Козырь — ' + K.SUIT_NAME[this.trump] +
      ' (' + K.name(this.trumpCard) + ' под колодой).', 'sys');
    if (low) this.say('Младший козырь ' + K.name(low) + ' — ' + (att === this.human ? 'у вас, вы и ходите'
      : 'у ' + this.names[att] + ', ' + (this.sex[att] === 'f' ? 'она' : 'он') + ' и ходит') + '.', 'sys');
    else if (why === 'под дурака') this.say('Ходят под дурака: ' + this.names[att] + ' на ' +
      this.names[this.lastFool] + '.', 'sys');
    this.startBout(att);
  };

  Game.prototype.sortHands = function () {
    for (var i = 0; i < this.N; i++) K.sortHand(this.hands[i], this.trump);
  };

  /* ---------- заход ---------- */
  Game.prototype.startBout = function (att) {
    var def = this.nextFoe(att);
    var cap = (this.o.first5 && this.boutNo === 0) ? 5 : 6;
    this.boutNo++;
    this.bout = {
      att: att, def: def, main: att,
      limit: Math.min(cap, this.hands[def].length),
      cap: cap,
      taking: false, thr: 0,
      first: [],                 // чем зашли — для погон
      by: {},                    // сколько карт положил каждый нападавший
      duel: this.withCards().length === 2 && this.talon.length === 0,
      start: this.hands.map(function (h) { return h.length; })
    };
    this.push({ e: 'bout', att: att, def: def, limit: this.bout.limit });
    this.askAttack();
  };

  Game.prototype.ranksOnTable = function () {
    var s = {};
    this.table.forEach(function (pr) { s[pr.a.r] = 1; if (pr.d) s[pr.d.r] = 1; });
    return s;
  };
  Game.prototype.room = function () { return this.bout ? this.bout.limit - this.table.length : 0; };

  Game.prototype.askAttack = function () {
    var b = this.bout;
    this.pending = { type: 'attack', p: b.att, def: b.def, limit: b.limit, legal: this.hands[b.att].slice() };
  };

  function takeFrom(hand, cards) {
    for (var i = 0; i < cards.length; i++) {
      var j = K.indexOfCard(hand, cards[i]);
      if (j < 0) return false;
    }
    for (i = 0; i < cards.length; i++) hand.splice(K.indexOfCard(hand, cards[i]), 1);
    return true;

  };

  /* Человеческое имя ошибки. «Lost connection to server» на экране —
     это не сообщение игроку, это сообщение разработчику. */
  function netErr(e) {
    var t = (e && e.type) || '';
    if (t === 'peer-unavailable') return 'стол не найден — проверьте код';
    if (t === 'unavailable-id') return 'этот стол уже поднят';
    if (t === 'browser-incompatible') return 'браузер не умеет в связь напрямую';
    if (TRANSIENT[t]) return 'брокер не отвечает, попробуйте ещё раз';
    var m = (e && e.message) || '';
    if (/lost connection/i.test(m)) return 'связь с брокером оборвалась';
    return m || 'связь не поднялась';
  }

  /* ---------- пульс ----------

     Ник: «во время партии может отвалиться соединение», «крашей по сети
     было много связанных с вылетом и повторным заходом».

     Самое подлое в связи напрямую: канал умирает МОЛЧА. Закрыли
     ноутбук, переключился вай-фай, провайдер подтянул NAT — на том
     конце уже никого, а у нас `conn.open` по-прежнему true, и события
     'close' не будет никогда. А смотрели мы только на 'close'. Отсюда
     обе беды сразу:

       · хозяин ждал ход от браузера, которого нет, — стол висел;
       · гость не знал, что хозяин пропал, и никуда не возвращался.

     Лечится пульсом. Гость раз в четыре секунды стучит `ping`, хозяин
     отвечает `pong`, и любое пришедшее сообщение — отметка «жив». Нет
     отметки пятнадцать секунд — связи нет, и мы это говорим, а не ждём
     до конца партии.

     Числа вынесены наружу: проверкам нужны секунды вместо минут, и
     трогать для этого сами правила нельзя. */
  var T = { beat: 4000, dead: 15000 };

  /* Держать пира на связи: сорвалось — возвращаемся под тем же именем,
     с растущей паузой и без фанатизма. */
  function keepAlive(p, what) {
    var tries = 0, timer = null, told = false;
    p.on('open', function () { tries = 0; told = false; });
    p.on('disconnected', function () {
      if (!S.on || p.destroyed) return;
      if (tries >= 6) {
        /* Брокер лежит. Партия при этом идёт дальше — каналы к игрокам
           прямые, — но молчать об этом нельзя: человек должен понимать,
           почему к столу никто не может сесть. */
        if (!told && window.UI && UI.toast) {
          told = true;
          UI.toast('Связь с брокером потеряна: новые игроки сесть не смогут. Партия продолжается.');
        }
        return;
      }
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (!S.on || p.destroyed || !p.disconnected) return;
        tries++;
        try { p.reconnect(); } catch (e) { }
      }, Math.min(10000, 600 * (tries + 1)));
    });
  }

  /* ---------- состояние для рассылки ----------
     Закрытая модель: общее — всем, рука — только её хозяину. Колода и
     бито уходят числами: карт в них никто за столом не видит. */
  function pubState(g) {
    var b = g.bout;
    return {
      N: g.N, names: g.names, score: g.score, fools: g.fools, rank: g.rank,
      pogGave: g.pogGave, pogGot: g.pogGot, dealer: g.dealer,
      trump: g.trump, trumpCard: g.trumpCard || null,
      talonN: (g.talon || []).length, bitoN: (g.bito || []).length,
      table: (g.table || []).map(function (pr) { return { a: pr.a, d: pr.d, by: pr.by }; }),
      bout: b ? { att: b.att, def: b.def, main: b.main, limit: b.limit, taking: b.taking } : null,
      out: g.out || [], place: g.place || [],
      handNo: g.handNo, handsPlayed: g.handsPlayed, draws: g.draws,
      over: g.over, winner: g.winner, loser: g.loser,
      counts: (g.hands || []).map(function (h) { return h.length; }),
      result: g.result || null, history: (g.history || []).slice(-30),
      lastFool: g.lastFool, lastDraw: g.lastDraw,
      faces: g.faces || null, chars: g.chars || null, lvl: g.lvl || 2,
      stats: g.stats || null, sex: g.sex || [], isBot: g.isBot || [],
      /* Рейтинг: основа номера партии (номер = основа-партия) и готовый
         расчёт хозяина за последнюю партию. См. платформа/09-РЕЙТИНГ.md. */
      mbase: g.mbase || null, rating: g.rating || null, leftHand: g.leftHand || null
    };
  }
  function privState(g, seat) {
    var pd = null;
    if (g.pending) {
      if (g.pending.p === seat || g.pending.type === 'next') pd = g.pending;
      else pd = { type: g.pending.type, p: g.pending.p };
    }
    return { hand: (g.hands && g.hands[seat]) || [], pending: pd };
  }

  /* ---------- игра на стороне гостя ----------
     Обрубок движка: умеет рисовать (прототип тот же — sideList, W, foe
     работают даром), но не считает. Ход уходит хозяину. */
  function NetGame(cfg, seat) {
    this.o = cfg.o; this.N = cfg.N; this.names = cfg.names.slice();
    this.human = -1; this.isNet = true;   // общий журнал пишется по именам
    this.score = []; this.fools = []; this.rank = []; this.pogGave = []; this.pogGot = [];
    for (var i = 0; i < this.N; i++) { this.score.push(0); this.fools.push(0); this.rank.push(0); this.pogGave.push(0); this.pogGot.push(0); }
    this.hands = []; this.out = []; this.place = []; this.table = []; this.known = [];
    this.talon = []; this.bito = []; this.talonN = 0; this.bitoN = 0;
    this.dealer = 0; this.trump = null; this.trumpCard = null; this.bout = null;
    this.handNo = 0; this.handsPlayed = 0; this.history = []; this.result = null;
    this.over = false; this.winner = -1; this.loser = -1; this.lastFool = -1;
    this.ev = []; this.log = []; this.pending = null; this.pendHold = undefined;
    this.sex = [];
    this.seat = seat;
  }
  NetGame.prototype = Object.create(Engine.Game.prototype);
  NetGame.prototype.constructor = NetGame;
  NetGame.prototype.newHand = function () { };
  NetGame.prototype.apply = function (a) {
    this.pending = null;
    send(S.conns[0], { t: 'act', seat: this.seat, a: a });
    return true;
  };
  NetGame.prototype.applySync = function (pub, priv) {
    for (var k in pub) if (k !== 'counts') this[k] = pub[k];
    var me = this.seat, i;
    this.hands = [];
    for (i = 0; i < this.N; i++) {
      if (i === me) this.hands.push(priv.hand);
      else { var a = []; for (var j = 0; j < pub.counts[i]; j++) a.push(null); this.hands.push(a); }
    }
    // колода и бито у гостя — только числа; рисовальщику хватает длины
    this.talon = new Array(pub.talonN || 0);
    this.bito = new Array(pub.bitoN || 0);
  };

  /* ---------- связь ---------- */
  function send(c, m) { try { if (c && c.open) c.send(m); } catch (e) { } }
  /* ---------- сохранение стола ---------- */
  function saveHost(g) {
    if (!S.host || !g) return;
    try {
      localStorage.setItem('durak-host', JSON.stringify({
        ts: Date.now(), code: S.code, cfg: S.cfg,
        conns: S.conns.map(function (c) { return { seat: c.seat, name: c.name, key: c.key, face: c.face,
          bot: !!c.bot && !c.away, uid: c.uid || null }; }),
        chars: g.chars || null, faces: g.faces || null,
        game: Engine.snapshot(g)
      }));
    } catch (e) { }
  }
  /* Запись живёт полсуток: код стола после этого всё равно мёртвый —
     хозяин давно закрыл вкладку, и кнопка вела бы в никуда. */
  /* [stated] Ник 22.10.2026: партию можно отложить и доиграть потом —
     поэтому и «Вернуться за стол», и сохранённый стол живут месяц. */
  var BACK_TTL = 30 * 24 * 3600 * 1000;
  function savedBack() {
    try {
      var d = JSON.parse(LS('durak-back') || 'null');
      if (!d || !d.code || !d.key) return null;
      if (Date.now() - (d.at || 0) > BACK_TTL) { dropBack(); return null; }
      return d;
    } catch (e) { return null; }
  }
  function dropBack() { try { localStorage.removeItem('durak-back'); } catch (e) { } }

  function savedHost() {
    try {
      var d = JSON.parse(localStorage.getItem('durak-host') || 'null');
      if (!d || !d.code || !d.game) return null;
      if (Date.now() - d.ts > BACK_TTL) return null;          // старше месяца — не предлагаем
      return d;
    } catch (e) { return null; }
  }
  function dropSaved() { try { localStorage.removeItem('durak-host'); } catch (e) { } }

  function broadcast(g) {
    if (!S.host) return;
    saveHost(g);
    for (var i = 0; i < S.conns.length; i++) {
      var c = S.conns[i];
      if (!c || !c.conn) continue;
      var evs = g.ev.slice(c.sent || 0);
      c.sent = g.ev.length;
      send(c.conn, { t: 'sync', pub: pubState(g), priv: privState(g, c.seat), ev: evs });
    }
  }

  /* ---------- хозяин ---------- */
  function createRoom(cfg, myName, onState, fixed, myFace) {
    return loadPeer().then(function (ok) {
      if (!ok) throw new Error('нет связи с брокером');
      S.code = (fixed && fixed.code) || rndCode();
      S.host = true; S.on = true; S.seat = 0; S.cfg = cfg;
      S.conns = [];
      for (var i = 0; i < cfg.N; i++)
        S.conns.push({
          seat: i, name: i === 0 ? myName : '', key: rndKey(), conn: null, sent: 0,
          uid: i === 0 ? myUid() : null,
          bot: i !== 0, face: i === 0 ? (myFace != null ? myFace : -1) : -1,
          stats: (i === 0 && window.Boot && Boot.statCard) ? Boot.statCard() : null
        });
      if (fixed && fixed.conns)                       // поднимаем прежний стол: места и ключи те же
        for (i = 0; i < Math.min(fixed.conns.length, S.conns.length); i++) {
          S.conns[i].key = fixed.conns[i].key || S.conns[i].key;
          S.conns[i].name = fixed.conns[i].name || S.conns[i].name;
          if (fixed.conns[i].face != null) S.conns[i].face = fixed.conns[i].face;
          /* старые записи без отметки — как раньше, боты; новые помнят людей */
          S.conns[i].bot = i !== 0 && (fixed.conns[i].bot === undefined || !!fixed.conns[i].bot);
          if (i !== 0 && fixed.conns[i].uid) S.conns[i].uid = fixed.conns[i].uid;
        }
      LS('durak-room', S.code);
      /* Поднять стол с первого раза выходит не всегда: публичный брокер
         иногда роняет сокет прямо на открытии. Раньше это был конец —
         «Не вышло: Lost connection to server», хотя вторая попытка через
         полсекунды проходит. Теперь пробуем молча, и только исчерпав
         попытки, говорим человеку. */
      return new Promise(function (res, rej) {
        var tries = 0;
        (function attempt() {
          tries++;
          var p = newPeer(PREFIX + S.code);
          S.peer = p;
          var settled = false;
          p.on('open', function () {
            settled = true;
            keepAlive(p, 'стол');
            res(S.code); onState && onState();
          });
          p.on('error', function (e) {
            if (settled) return;            // после открытия за связь отвечает keepAlive
            var t = (e && e.type) || '';
            try { p.destroy(); } catch (e2) { }
            if (t === 'unavailable-id' && !(fixed && fixed.code) && tries < 4) {
              S.code = rndCode(); LS('durak-room', S.code);
              return setTimeout(attempt, 250);
            }
            if (TRANSIENT[t] && tries < 3) return setTimeout(attempt, 500 * tries);
            settled = true;
            S.on = false; S.host = false; S.peer = null;
            rej(new Error(netErr(e)));
          });
          p.on('connection', function (conn) {
            conn._seen = Date.now();
            conn.on('data', function (m) {
              conn._seen = Date.now();
              if (m && m.t === 'ping') return send(conn, { t: 'pong' });
              onHostMsg(conn, m, onState);
            });
            conn.on('close', function () { dropConn(conn, onState); });
            conn.on('error', function () { dropConn(conn, onState); });
          });
        })();
      });
    });
  }

  function seatOfConn(conn) {
    for (var i = 0; i < S.conns.length; i++) if (S.conns[i].conn === conn) return i;
    return -1;
  }
  /* ---------- место опустело ----------

     Ник: «чтобы при вылете игра ставилась на паузу, пока игрок
     возвращается, чтобы за него только потом мог сесть бот».

     Раньше бот садился в ту же секунду. Со стороны человека это
     выглядело так: пока он жмёт «вернуться», его картами уже отыграли
     раздачу, и возвращается он в чужую игру. Теперь между обрывом и
     ботом есть окно: стол замирает, все видят «ждём Колянусика — 38»,
     и только если человек не вернулся, место забирает бот. Хозяин
     может не ждать — в той же плашке кнопка «посадить бота».

     В лобби ждать нечего: партия не началась, место просто пустеет. */

  function markAway(i, onState) {
    var c = S.conns[i];
    if (!c) return;
    c.conn = null;
    if (!S.ready) {                                  // ещё лобби — как было
      c.bot = true;
      lobbyPush(); onState && onState();
      if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' ушёл из-за стола');
      return;
    }
    /* Помечаем МОМЕНТ обрыва, а не срок. Срока больше нет: бот сам на
       место не садится (см. ниже). */
    c.away = Date.now();
    c.bot = false;
    if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' без связи — ждём его, партия на паузе');
    lobbyPush(); onState && onState();
    awayPush();
  }
  function dropConn(conn, onState) {
    var i = seatOfConn(conn);
    if (i < 0) return;
    markAway(i, onState);
  }

  /* Кого ждут и сколько осталось. Список один на всех — и хозяину в
     плашку, и гостям: им тоже надо понимать, почему стол замер.
     Везём остаток, а не срок: часы у всех свои. */
  function awayList() {
    var out = [], now = Date.now();
    for (var i = 0; i < S.conns.length; i++) {
      var c = S.conns[i];
      if (c && c.away)
        out.push({
          seat: i, name: c.name || ('Место ' + (i + 1)),
          /* Сколько УЖЕ ждём. Раньше возили остаток до посадки бота, но
             бот сам больше не садится, и обратный отсчёт врал бы. */
          since: Math.max(0, now - c.away)
        });
    }
    return out;
  }
  function awayPush() {
    if (!S.host) return;
    var list = awayList();
    toGuests({ t: 'away', list: list });
    if (UI && UI.netAway) UI.netAway(list);
  }
  /* Место забирает бот. Путь сюда ОДИН: это решил человек за столом —
     хозяин нажал «посадить бота» в плашке ожидания.

     [stated] Ник 22.10.2026: «бот садится, только если его посадит игрок,
     а не автоматом». Раньше через 45 секунд бот садился сам, и человек,
     который чинил вай-фай или менял сеть, возвращался к тому, что его
     картами уже играют. Теперь стол ждёт столько, сколько нужно, а
     решение «хватит ждать» принимает человек. Бота сажаем ПОСЛЕ
     того, как снята пауза: иначе его первый ход упрётся в неё же. */
  function seatBot(i) {
    if (!S.host) return false;
    var c = S.conns[i];
    if (!c || !c.away) return false;
    c.away = 0; c.bot = true;
    if (S.game) S.game.names[i] = (c.name || ('Место ' + (i + 1))) + ' (бот)';
    if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' не вернулся — место ведёт бот');
    lobbyPush(); awayPush();
    if (UI && UI.netFillBot) UI.netFillBot(i);
    if (S.game) broadcast(S.game);
    return true;
  }

  /* ---------- высадить со стола ----------
     «Вдруг зашёл не тот, что надо». Хозяин освобождает место, а ключ
     высаженного отправляется в бан на минуту: иначе он вернётся тем же
     ключом через секунду и сядет обратно. Ключ — единственное, чем гость
     себя опознаёт (адрес соединения у него каждый раз новый), так что это
     не крепость, а вежливое «не сейчас». */
  var BAN_MS = 60000;

  function kick(seat) {
    if (!S.host || seat <= 0 || seat >= S.conns.length) return false;
    var c = S.conns[seat];
    if (!c.conn) return false;
    var key = c.key;
    S.bans[key] = Date.now() + BAN_MS;
    send(c.conn, { t: 'bye', rt: 'void', why: 'Хозяин убрал вас со стола. Вернуться можно через минуту.' });
    /* рейтинг: убранный хозяином не «бросил» партию — его место дальше
       просто бот, иначе хозяин мог бы убрать проигрывающего себе в плюс */
    if (S.game && S.game.stats) S.game.stats[seat] = null;
    try { c.conn.close(); } catch (e) { }
    c.conn = null; c.bot = true; c.name = ''; c.face = -1; c.stats = null; c.sent = 0;
    if (S.game) { S.game.names[seat] = 'Место ' + (seat + 1); }
    lobbyPush();
    return true;
  }

  function banLeft(key) {
    var t = S.bans[key];
    if (!t) return 0;
    var left = t - Date.now();
    if (left <= 0) { delete S.bans[key]; return 0; }
    return left;
  }

  function onHostMsg(conn, m, onState) {
    var g = S.game;
    if (m.t === 'hello') {
      var seat = -1, i;
      var left = m.key ? banLeft(m.key) : 0;
      if (left > 0) {
        send(conn, { t: 'bye', why: 'Вас убрали со стола. Попробуйте через ' +
          Math.ceil(left / 1000) + ' сек.' });
        try { conn.close(); } catch (e) { }
        return;
      }
      /* Свой номер игрока — старше ключа: он опознаёт ЧЕЛОВЕКА, а ключ
         только место. Место с тем же номером забираем всегда, даже если
         прежнее соединение числится живым: живым оно числится и у
         призрака, и именно на этом стол ломался. */
      if (m.uid) {
        if (S.conns[0] && S.conns[0].uid === m.uid) {
          send(conn, { t: 'bye', why: 'Этот стол вы уже держите — вы за ним хозяин.' });
          try { conn.close(); } catch (e) { }
          return;
        }
        for (i = 1; i < S.conns.length; i++)
          if (S.conns[i].uid && S.conns[i].uid === m.uid) { seat = i; break; }
        if (seat > 0 && S.conns[seat].conn && S.conns[seat].conn !== conn) {
          /* ---------- живой провод за местом не рвём ----------

             Ник, 29.10: «при начале партии иногда не появляется окно
             торга; помогает только если хозяин перезапускает партию и
             игроки доприсоединяются».

             Вот откуда. Гость, у которого мигнула связь, стучится
             несколько раз подряд: первый стук мы сочли потерянным и
             начали второй, а ответ на первый пришёл с опозданием. Для
             хозяина это два «здравствуйте» с одним номером игрока, и
             он честно делал то, что написано ниже: сажал последнего, а
             прежнему слал «вы вошли из другого окна». Прежний — ТА ЖЕ
             вкладка, и она уходила в меню. Хозяин видит место живым и
             ждёт слова, человек сидит в меню; он возвращается — и всё
             по кругу, пока стол не поднимут заново.

             Различить призрака и эхо можно по одному признаку: когда
             этот провод в последний раз подавал голос. Пульс ходит
             каждые `T.beat`, поэтому молчание дольше трёх пульсов —
             призрак, его и меняем. Провод, который только что говорил,
